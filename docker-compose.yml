name: goosar

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: goosar
      POSTGRES_USER: ${POSTGRES_USER:-goosar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goosar}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
