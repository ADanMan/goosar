{{- $frontendImageTag := default .Chart.AppVersion .Values.images.frontend.tag -}}
{{- $remoteApiUrl := default (printf "http://%s:8080" (include "goosar.backend.fullname" .)) .Values.frontend.config.remoteApiUrl -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "goosar.frontend.fullname" . }}
  labels:
    {{- include "goosar.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: goosar
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "goosar.labels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      {{- with .Values.frontend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.images.frontend.repository }}:{{ $frontendImageTag }}"
          imagePullPolicy: {{ .Values.images.frontend.pullPolicy }}
          {{- with .Values.frontend.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
            {{- if .Values.frontend.config.nodeOptions }}
            # V8 sizes its default old-space from the HOST's memory, not the
            # cgroup limit, so on a large node the heap happily grows past
            # frontend.resources.limits.memory and the kubelet OOM-kills the
            # pod instead of V8 collecting (#439). Same pairing as the
            # backend's GOMEMLIMIT; the compose stack uses FRONTEND_NODE_OPTIONS.
            - name: NODE_OPTIONS
              value: {{ .Values.frontend.config.nodeOptions | quote }}
            {{- end }}
            - name: REMOTE_API_URL
              value: {{ $remoteApiUrl | quote }}
            {{- if .Values.frontend.config.docsUrl }}
            - name: DOCS_URL
              value: {{ .Values.frontend.config.docsUrl | quote }}
            {{- end }}
            {{- if .Values.frontend.config.publicApiUrl }}
            - name: NEXT_PUBLIC_API_URL
              value: {{ .Values.frontend.config.publicApiUrl | quote }}
            {{- end }}
            {{- if .Values.frontend.config.publicWsUrl }}
            - name: NEXT_PUBLIC_WS_URL
              value: {{ .Values.frontend.config.publicWsUrl | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem (#520) leaves the Next.js standalone
            # server two paths it must still write: its fetch/ISR cache and
            # the temp dir. Both are per-pod scratch — losing them on restart
            # only costs a cache warm-up.
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/apps/web/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
      {{- with .Values.frontend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "goosar.frontend.fullname" . }}
  labels:
    {{- include "goosar.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: goosar
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: frontend
  ports:
    - port: 3000
      targetPort: 3000
      name: http
