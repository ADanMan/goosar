{{- if .Values.monitoring.prometheusRule.enabled }}
{{- $samplerQueryNames := "active_users|active_workspaces|task_queued|task_running|task_stuck|runtime_online|runtime_heartbeat_age|workspace_total" -}}
{{- $samplerErrorNames := printf "acquire|%s" $samplerQueryNames -}}
{{- $severity := .Values.monitoring.prometheusRule.severity -}}
# Alert rules for the Prometheus Operator (#396).
# API reference: https://prometheus-operator.dev/docs/api-reference/api/
#
# deploy/monitoring/prometheus/alerts.yml carries the same rule set for the
# Compose overlay. Alert NAMES are kept identical between the two and
# scripts/selfhost-monitoring.test.sh fails when they drift, so a runbook
# written against one install works on the other.
#
# Switched independently of monitoring.enabled on purpose: a cluster may scrape
# Goosar through some other path and still want these rules.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "goosar.backend.fullname" . }}
  labels:
    {{- include "goosar.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
    {{- with .Values.monitoring.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: goosar-availability
      rules:
        # `up` is synthesised by Prometheus, so this fires when the scrape
        # itself fails — pod gone, CrashLoopBackOff, listener disabled. The job
        # label is the Service name the ServiceMonitor selected.
        - alert: GoosarBackendDown
          expr: up{job="{{ include "goosar.backend.fullname" . }}"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Goosar backend metrics endpoint is down"
            description: "Prometheus cannot scrape the backend. The API is probably down as well."
        - alert: GoosarNotReady
          expr: goosar_ready == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Goosar backend is up but not ready"
            description: "/readyz has been failing for 5 minutes. Check the database connection first."
        - alert: GoosarMigrationsOutOfDate
          expr: goosar_migrations_out_of_date == 1
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Database is missing migrations this backend requires"
            description: "The backend runs migrations on startup; a persistent alert means they are failing. Check the backend logs."
        # Only a deployment that actually uses Redis moves these counters, so
        # the rule is inert without it. When it fires with several backend
        # replicas (#397), the relay is dropping cross-pod traffic: realtime
        # events and connection revocations stop crossing pods, and a removed
        # user keeps their socket on every other replica.
        - alert: GoosarRealtimeRedisErrors
          expr: |
            rate(goosar_realtime_redis_xadd_errors_total[10m]) > 0
              or
            rate(goosar_realtime_redis_xread_errors_total[10m]) > 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Realtime Redis relay is failing"
            description: "The backend cannot publish to or read from Redis. With several replicas, events and connection revocations no longer cross pods. Check Redis and REDIS_URL."

    - name: goosar-fleet
      rules:
        # "None online" is absence, not a zero: goosar_runtime_online is a
        # GROUP BY count over runtimes inside the heartbeat window. The
        # absent_over_time half keeps a cluster that has never connected a
        # daemon quiet — it is empty once the metric has been seen, so the
        # alert only fires for an install that had runtimes and lost them.
        - alert: GoosarNoOnlineRuntime
          expr: |
            absent(goosar_runtime_online)
              and
            absent(absent_over_time(goosar_runtime_online[24h]))
          for: 15m
          labels:
            severity: {{ $severity | quote }}
          annotations:
            summary: "No agent runtime has been online for 15 minutes"
            description: "Queued tasks cannot be dispatched. Check the daemons and their network path to the server."
        - alert: GoosarTasksStuck
          expr: sum(goosar_agent_task_stuck_total) > 0
          for: 30m
          labels:
            severity: {{ $severity | quote }}
          annotations:
            summary: "Agent tasks are stuck in running"
            description: "Tasks have been running past the stuck threshold for 30 minutes. The lease sweeper should reclaim them; if the count keeps growing, look at the runtime."
        - alert: GoosarTaskFailureRateHigh
          expr: |
            sum(rate(goosar_agent_task_failed_total[30m]))
              /
            clamp_min(sum(rate(goosar_agent_task_terminal_total[30m])), 0.001)
              > 0.25
          for: 15m
          labels:
            severity: {{ $severity | quote }}
          annotations:
            summary: "More than 25% of agent tasks are failing"
            description: "Split by failure_reason on goosar_agent_task_failed_total to find the cause."

    - name: goosar-http
      rules:
        - alert: GoosarHTTPErrorRateHigh
          expr: |
            sum(rate(goosar_http_requests_total{status=~"5.."}[10m]))
              /
            clamp_min(sum(rate(goosar_http_requests_total[10m])), 0.001)
              > 0.05
          for: 10m
          labels:
            severity: {{ $severity | quote }}
          annotations:
            summary: "More than 5% of HTTP requests return 5xx"
            description: "Group by route on goosar_http_requests_total to find the failing endpoint."
        - alert: GoosarHTTPLatencyHigh
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (rate(goosar_http_request_duration_seconds_bucket[10m]))
            ) > 2
          for: 15m
          labels:
            severity: {{ $severity | quote }}
          annotations:
            summary: "HTTP p95 latency is above 2s"
            description: "Group by route to find the slow endpoint; check the database pool panels first."
        - alert: GoosarWebhookRateLimited
          expr: sum(rate(goosar_webhook_rate_limited_total[15m])) > 0
          for: 15m
          labels:
            severity: info
          annotations:
            summary: "Inbound webhooks are hitting a safety gate"
            description: "Deliveries are being delayed by a bounded gate ({{ "{{ $labels.gate }}" }}). Sustained pressure means the integration is sending faster than the worker drains."

    - name: goosar-database
      rules:
        - alert: GoosarDBPoolSaturated
          expr: goosar_db_pool_acquired_conns / clamp_min(goosar_db_pool_max_conns, 1) > 0.9
          for: 10m
          labels:
            severity: {{ $severity | quote }}
          annotations:
            summary: "PostgreSQL connection pool is above 90% utilisation"
            description: "Raise DB_MAX_CONNS, or find the slow queries holding connections."
        - alert: GoosarDBPoolAcquireStalls
          expr: rate(goosar_db_pool_empty_acquire_count[10m]) > 1
          for: 10m
          labels:
            severity: {{ $severity | quote }}
          annotations:
            summary: "Requests are waiting for a free PostgreSQL connection"
            description: "The pool is empty often enough that requests queue for it."

    - name: goosar-business-sampler
      rules:
        - alert: GoosarBusinessSamplerQueryErrors
          expr: |
            sum by (name) (
              rate(goosar_business_sampler_query_errors_total{name=~"{{ $samplerErrorNames }}"}[10m])
            ) > 0
          for: {{ .Values.monitoring.prometheusRule.samplerQueryErrorsFor | quote }}
          labels:
            severity: {{ $severity | quote }}
          annotations:
            summary: "Business sampler query errors"
            description: "Business sampler query {{ "{{ $labels.name }}" }} is returning errors. Metrics may go stale if the query keeps timing out."
        - alert: GoosarBusinessSamplerQueryLatencyHigh
          expr: |
            histogram_quantile(
              0.95,
              sum by (le, name) (
                rate(goosar_business_sampler_query_seconds_bucket{name=~"{{ $samplerQueryNames }}"}[10m])
              )
            ) > 0.3
          for: {{ .Values.monitoring.prometheusRule.samplerQueryLatencyFor | quote }}
          labels:
            severity: {{ $severity | quote }}
          annotations:
            summary: "Business sampler query p95 is high"
            description: "Business sampler query {{ "{{ $labels.name }}" }} p95 is above 300ms, leaving little headroom before the 500ms statement_timeout."

    - name: goosar-host
      rules:
        # OPTIONAL. Goosar exports no disk metric — the process cannot see the
        # volume it writes to. This rule stays inert unless node-exporter is
        # also scraped by the same Prometheus (kube-prometheus-stack ships it).
        - alert: GoosarDiskSpaceLow
          expr: |
            min(
              node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
                /
              node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}
            ) < 0.1
          for: 15m
          labels:
            severity: {{ $severity | quote }}
          annotations:
            summary: "Less than 10% free disk on the Goosar host"
            description: "PostgreSQL and the uploads volume share this disk. A full disk stops writes and can corrupt an in-flight backup."
{{- end }}
