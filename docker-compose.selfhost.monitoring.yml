# Prometheus + Grafana for the Compose stack (#396).
#
# The backend has always exported Prometheus metrics, but METRICS_ADDR ships
# empty and nothing scraped them. This overlay is the missing half: it turns
# the listener on, points a Prometheus at it, and ships a provisioned Grafana
# with the same dashboard and the same alert rules the Helm chart installs.
#
# Usage:
#   docker compose -f docker-compose.selfhost.yml \
#                  -f docker-compose.selfhost.monitoring.yml up -d
#
# Grafana:    http://127.0.0.1:${GRAFANA_PORT:-3002}  (admin / GRAFANA_ADMIN_PASSWORD from .env)
# Prometheus: http://127.0.0.1:${PROMETHEUS_PORT:-9090}
#
# Security posture, deliberate and load-bearing:
#   * the backend metrics port is reachable ONLY on the compose network — it is
#     never in a `ports:` mapping. /metrics exposes internal routes, traffic
#     volume and dependency state.
#   * Grafana and Prometheus bind 127.0.0.1 like every other service in the
#     base file. Docker bypasses host firewalls, so 0.0.0.0 here would publish
#     an unauthenticated Prometheus to the internet.
#   * Prometheus runs read-only with no admin API, so the loopback UI cannot
#     delete series or reload arbitrary config.
#
# Alert ROUTING is out of scope: this Prometheus evaluates rules and shows
# firing alerts in its own UI. Point it at an Alertmanager (or use Grafana
# alerting against the same datasource) to get pages out of the host.

services:
  backend:
    environment:
      # Bind inside the container so the prometheus container can reach it.
      # NOT published to the host — see the note above.
      #
      # Deliberately a literal, not ${METRICS_ADDR:-...}: the scrape target in
      # deploy/monitoring/prometheus/prometheus.yml is the fixed `backend:9090`,
      # and .env.example documents METRICS_ADDR=127.0.0.1:9090 for the bare
      # binary. An operator who had uncommented that line would otherwise make
      # the overlay bind loopback inside the container — the whole stack would
      # come up scraping nothing and page GoosarBackendDown.
      METRICS_ADDR: 0.0.0.0:9090

  prometheus:
    # Pinned by digest like the pgvector image in the base file (the tag is
    # mutable, the digest is not). To move to a new build:
    #   docker buildx imagetools inspect prom/prometheus:<tag>
    # and replace the sha256 below.
    image: prom/prometheus:v3.6.0@sha256:76947e7ef22f8a698fc638f706685909be425dbe09bd7a2cd7aca849f79b5f64
    depends_on:
      - backend
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.listen-address=0.0.0.0:9090
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-50m}
        max-file: "${LOG_MAX_FILE:-5}"
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-1g}
    user: "65534:65534"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:12.1.1@sha256:a1701c2180249361737a99a01bc770db39381640e4d631825d38ff4535efa47d
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3002}:3000"
    environment:
      # Generated by scripts/selfhost-env.sh alongside JWT_SECRET; compose
      # refuses to start rather than fall back to the admin/admin default.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required — generate one with `openssl rand -hex 24` and set it in .env (make selfhost does this automatically)}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Loopback-only, single-operator stand: no sign-up, no anonymous access,
      # no phone-home.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      # The dashboard JSON lives in the Helm chart so `.Files.Get` can embed
      # the same file in a ConfigMap — Helm cannot read outside its chart
      # directory, and one dashboard maintained twice drifts.
      - ./deploy/helm/goosar/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-50m}
        max-file: "${LOG_MAX_FILE:-5}"
    mem_limit: ${GRAFANA_MEM_LIMIT:-512m}
    user: "472:472"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  prometheus_data:
  grafana_data:
