# Neutral runtime registry. This is the one place in the codebase where real
# vendor CLI/model names are allowed to live (grep-zero gate exception by
# design) — see docs/superpowers/plans/2026-09-18-neutral-runtime-codes.md.
#
# `code` is the neutral runtime code used everywhere else in product
# code/DB/API ("runtime-a".."runtime-r") and is what pkg/agent.SupportedTypes
# exposes. `cliName` is the real external tool's own *binary* name as it is
# invoked on PATH — note several differ from the tool's product name (agy,
# cursor-agent, kiro-cli, qodercli), and pkg/agent uses this value as the
# ExecutablePath fallback, so it must stay exec-accurate. `displayName`
# MUST be generic ("Runtime <Letter>") — never a real vendor/CLI name.
#
# Each model's `id` is the neutral form `rt-<letter>/<suffix>` (e.g.
# `rt-c/sonnet-5`); `realId` is the literal value the underlying CLI accepts
# and is copied verbatim from pkg/agent/models.go's static catalogs. Only the
# six backends with a static catalog today (claude, codex, cursor, copilot,
# grok, codebuddy) have non-empty `models` lists; every other backend
# discovers its catalog dynamically via ACP/CLI enumeration in models.go and
# intentionally keeps `models: []` here.
#
# `homeEnvVar`/`homeDefaultSubpath`, `skillsHomeSubpath`, `skillsCanDisable`,
# `mcpConfig` and `pluginRegistry` describe each external tool's REAL on-disk
# conventions — the home directory it reads, where its user-level skills live,
# where it keeps its own MCP server config, and (for the single runtime that has
# one) its plugin registry. They live here for the same reason cliName does:
# server/internal/daemon must discover those locations without any Go file
# naming a real tool. Most runtimes only need skillsHomeSubpath; mcpConfig is
# populated for the seven whose local MCP layout the daemon actually knows, and
# the other eleven intentionally omit it so the daemon keeps reporting those as
# unenforceable rather than guessing.
#
# Pricing fields are best-effort, copied from server/internal/metrics/pricing.go
# where a model maps cleanly onto one of its price-table keys. pricing.go
# prices by provider+model tier, not by every exact static-catalog ID, so
# several entries below have no clean match (gpt-5.2, gpt-5-mini, gpt-4.1,
# grok-composer-2.5-fast, deepseek-v3-2-volc-ioa, cursor's "auto") and are left
# at 0. Task 3 (pricing/billing rework) is expected to revisit this file.
runtimes:
  - code: runtime-a
    cliName: agy
    displayName: "Runtime A"
    skillsHomeSubpath: .gemini/antigravity-cli/skills
    skillsWorkdirSubpath: .agents/skills
    skillsAutoDiscovered: true
    contextFilename: AGENTS.md
    models: []


  - code: runtime-c
    cliName: claude
    displayName: "Runtime C"
    skillsHomeSubpath: .claude/skills
    skillsCanDisable: true
    skillsWorkdirSubpath: .claude/skills
    skillsAutoDiscovered: true
    contextFilename: CLAUDE.md
    mcpConfig:
      subpath: .claude.json
      format: json
      key: mcpServers
    pluginRegistry:
      settingsSubpath: .claude/settings.json
      settingsEnabledKey: enabledPlugins
      installedRegistrySubpath: .claude/plugins/installed_plugins.json
      manifestSubpath: .claude-plugin/plugin.json
      defaultSkillsSubpath: skills
      defaultMcpConfigSubpath: .mcp.json
      # runtime-d's real CLI is a fork that reads this same user-level config
      # for MCP servers, but ships its own skills directory — the inheritance
      # is MCP-only on purpose.
      extendsToCode: runtime-d
    models:
      - id: rt-c/sonnet-5
        realId: claude-sonnet-5
        label: "Claude Sonnet 5"
        default: false
        pricingInputPerMTok: 2.00
        pricingOutputPerMTok: 10.00
      - id: rt-c/sonnet-4-6
