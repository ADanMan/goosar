# Vendor-keyed model USD pricing data, relocated from
# server/internal/metrics/pricing.go. This is the grep-zero gate's other
# established exception (alongside runtimes.yaml) for real vendor/model names
# living in a Go-adjacent data file — see
# docs/superpowers/plans/2026-09-18-neutral-runtime-codes.md.
#
# This data is intentionally NOT keyed by runtime code: the same real model
# (e.g. Claude Sonnet 5) is reachable through multiple different runtime
# codes (runtime-c directly, runtime-d since CodeBuddy is a Claude-compatible
# fork, runtime-f since Copilot's catalog includes Anthropic models) — the
# USD rate is a property of the underlying vendor model, not of which CLI
# wrapper reaches it. Keying pricing by runtime code would be factually
# wrong, so it stays keyed by "<provider>:<model>" exactly as it was in
# pricing.go.
#
# modelPrices: one row per "<provider>:<model>" key, read by
# server/internal/metrics/pricing.go's PriceForModelAlias via
# ModelPricing.PriceForAlias. All rates are USD per million tokens.
modelPrices:
  # GPT-5.6 series (Codex `codex` provider). Official rates from OpenAI's
  # GPT-5.6 announcement (openai.com/index/previewing-gpt-5-6-sol). For 5.6+
  # cache read is the 90%-off cached-input rate (0.1x input) and cache write
  # is billed at 1.25x the uncached input rate — unlike earlier OpenAI SKUs,
  # which don't bill cache writes separately. NOTE: Codex's app-server usage
  # stream (0.144.1) does not yet report cache-write tokens separately, so
  # today those tokens fall into plain input and are billed at 1x; the
  # cacheWritePerM rate below is correct but not yet exercised for Codex.
  - key: "openai:gpt-5.6-sol"
    provider: "openai"
    model: "gpt-5.6-sol"
    inputPerM: 5.00
    cacheReadPerM: 0.50
    cacheWritePerM: 6.25
    outputPerM: 30.00
  - key: "openai:gpt-5.6-terra"
    provider: "openai"
    model: "gpt-5.6-terra"
    inputPerM: 2.50
    cacheReadPerM: 0.25
    cacheWritePerM: 3.125
    outputPerM: 15.00
  - key: "openai:gpt-5.6-luna"
