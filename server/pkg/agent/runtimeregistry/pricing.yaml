# aliasRules: first-match-wins regexp rules mapping an incoming model alias
# (already lowercased+trimmed by ModelPricing.PriceForAlias) to a
# modelPrices key.
aliasRules:
  # Anchored exact-match: the effort is carried in a separate field, so the
  # model id is the bare slug. Anchoring to `$` keeps unknown variants
  # (`gpt-5.6-luna-pro`, `gpt-5.6-luna/x`) out of these rows. The `.` is a
  # LITERAL dot, not the `[.-]` class the older rows use — the real Codex
  # slug is always dotted (`gpt-5.6-luna`), and the frontend resolver in
  # utils.ts does NOT dash-normalize, so a dashed `gpt-5-6-luna` must surface
  # as unmapped on both sides rather than silently borrowing a tier here.
  - pattern: '(^|/|:)gpt-5\.6-sol$'
    priceKey: "openai:gpt-5.6-sol"
  - pattern: '(^|/|:)gpt-5\.6-terra$'
    priceKey: "openai:gpt-5.6-terra"
  - pattern: '(^|/|:)gpt-5\.6-luna$'
    priceKey: "openai:gpt-5.6-luna"
  - pattern: '(^|/|:)gpt-5[.-]5$|^gpt-5-5$'
    priceKey: "openai:gpt-5.5"
  - pattern: '(^|/|:)gpt-5[.-]4($|-2026-03-05|-xhigh)'
    priceKey: "openai:gpt-5.4"
  - pattern: '(^|/|:)gpt-5[.-]4-mini($|[^a-z0-9])'
    priceKey: "openai:gpt-5.4-mini"
  - pattern: '(^|/|:)gpt-5[.-]3-codex$'
    priceKey: "openai:gpt-5.3-codex"
  - pattern: '(^|/|:)gpt-5[.-]2-codex$'
    priceKey: "openai:gpt-5.2-codex"
  - pattern: 'claude-sonnet-5|claude-5-sonnet'
    priceKey: "anthropic:claude-sonnet-5"
  - pattern: 'claude-fable-5'
    priceKey: "anthropic:claude-fable-5"
  - pattern: 'claude-opus-5'
    priceKey: "anthropic:claude-opus-5"
  - pattern: 'claude-opus-4[-.]8'
    priceKey: "anthropic:claude-opus-4.8"
  - pattern: 'claude-opus-4[-.]7'
    priceKey: "anthropic:claude-opus-4.7"
  - pattern: 'claude-opus-4[-.]6'
    priceKey: "anthropic:claude-opus-4.6"
  - pattern: 'claude-opus-4[-.]5'
    priceKey: "anthropic:claude-opus-4.5"
  - pattern: 'claude-sonnet-4[-.]6|claude-4[-.]6-sonnet'
    priceKey: "anthropic:claude-sonnet-4.6"
  - pattern: 'claude-sonnet-4[-.]5|claude-4[-.]5-sonnet'
    priceKey: "anthropic:claude-sonnet-4.5"
  - pattern: 'claude-haiku-4[-.]5'
    priceKey: "anthropic:claude-haiku-4.5"
  - pattern: 'deepseek-v4-pro'
    priceKey: "deepseek:v4-pro"
  - pattern: 'deepseek-v4-flash|^deepseek-chat$|^deepseek-reasoner$'
    priceKey: "deepseek:v4-flash"
  - pattern: 'minimax-m2[.]7.*highspeed|highspeed.*minimax-m2[.]7'
    priceKey: "minimax:m2.7-highspeed"
  - pattern: 'minimax-m2[.]7'
    priceKey: "minimax:m2.7"
  - pattern: 'gemini-3-flash'
    priceKey: "google:gemini-3-flash"
  - pattern: 'gemini-3[.]1-pro'
    priceKey: "google:gemini-3.1-pro"
  - pattern: 'gemini-2[.]5-pro'
    priceKey: "google:gemini-2.5-pro"
  - pattern: 'gemini-2[.]5-flash'
    priceKey: "google:gemini-2.5-flash"
  # Anchored exact-match, dotted spelling only — same rule as the gpt-5.6
  # rows above. The frontend resolver does not dash-normalize non-Anthropic
  # ids, so a dashed `grok-4-5` must surface as unmapped on both sides rather
  # than silently borrowing a tier here.
  - pattern: '(^|/|:)grok-4\.5$'
    priceKey: "xai:grok-4.5"
  - pattern: '(^|/|:)grok-4\.3$'
    priceKey: "xai:grok-4.3"
  - pattern: '(^|/|:)grok-build-0\.1$'
    priceKey: "xai:grok-build-0.1"
  - pattern: '(^|/|:)grok-4\.20-multi-agent-0309$'
    priceKey: "xai:grok-4.20-multi-agent-0309"
  - pattern: '(^|/|:)grok-4\.20-0309-reasoning$'
    priceKey: "xai:grok-4.20-0309-reasoning"
  - pattern: '(^|/|:)grok-4\.20-0309-non-reasoning$'
    priceKey: "xai:grok-4.20-0309-non-reasoning"
