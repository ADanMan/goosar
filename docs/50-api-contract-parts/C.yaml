      tags: [Squads]
      summary: Живой статус каждого участника отряда (онлайн/занят) и его активные задачи
      description: >
        Для агентов статус выводится из состояния runtime и наличия активного
        запуска: `working` — есть активная задача; `idle` — runtime online и
        задач нет; `unstable` — runtime не online, но был на связи <5 минут
        назад; `offline` — иначе; `archived` — агент архивирован. Для
        участников-людей статус не вычисляется (поле `status` — null).
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
