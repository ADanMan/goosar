  /api/issues/{id}/subscribe:
    post:
      operationId: subscribeToIssue
      tags: [IssueSubscribers]
      summary: Подписаться на задачу (или подписать другого участника воркспейса)
      description: >
        По умолчанию подписывает вызывающего актора с причиной `manual`.
        Подписка другого пользователя (`user_type`/`user_id` в теле, отличные
        от вызывающего) разрешена только человеку с ролью owner/admin в
        воркспейсе; целевой пользователь должен быть участником воркспейса
        (member) или существующим агентом.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member, agent]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: {type: string, format: uuid}
                user_type: {type: string, enum: [member, agent]}
      responses:
        '200':
          description: Подписка оформлена
          content:
            application/json:
              schema: {type: object, properties: {subscribed: {type: boolean}}}
        '403':
          description: Попытка подписать чужого пользователя без прав owner/admin, либо цель не принадлежит воркспейсу
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404': {$ref: '#/components/responses/NotFound'}
      x-events:
        - name: subscriber:added
          payload: "{ issue_id, user_type, user_id, reason: \"manual\" }"

