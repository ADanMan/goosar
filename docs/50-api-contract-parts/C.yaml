  /api/agents/{id}/env:
    parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getAgentEnv
      tags: [AgentEnv]
      summary: Получить пользовательские переменные окружения агента
      description: >
        Доступ — владелец агента, либо владелец/админ воркспейса (участник
        без этих прав получает 403). Не-владельцу значения всегда
        маскируются (`****`), видны только имена ключей; владельцу — реальные
        значения. Каждое чтение (маскированное перечисление ключей или
        раскрытие значений) обязательно пишет запись в журнал активности —
        если запись в журнал не удалась, эндпоинт отказывает в ответе
        (500), а не отдаёт данные без следа.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: ["agent-owner", owner, admin, member]
      responses:
        '200':
          description: Переменные окружения (маскированные или в открытом виде — см. values_masked)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentEnv'}
        '403':
          description: Нет прав на просмотр переменных окружения этого агента
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500':
          description: Не удалось записать аудит-лог обращения к секретам; выдача данных отменена
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    put:
      operationId: updateAgentEnv
      tags: [AgentEnv]
      summary: Изменить пользовательские переменные окружения агента
      description: >
        Полностью описывает желаемое состояние: ключи, отсутствующие в теле,
        удаляются. Не-владелец агента может передавать только ключи, значение
        которых равно маркеру `****` (то есть "оставить как есть") — попытка
        реально задать/изменить значение чужим агентом-невладельцем — 403 (с
        отдельной записью в аудит `agent_env_update_refused`). Значение,
        которое начинается с `****`, но не равно ему целиком, — ошибка (это
        типичная опечатка поверх маски). Каждое успешное изменение пишет в
        аудит списки добавленных/удалённых/изменённых/сохранённых ключей.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: ["agent-owner", owner, admin, member]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                custom_env: {type: object, additionalProperties: {type: string}}
      responses:
        '200':
          description: Итоговые переменные окружения (маскированные для не-владельца)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentEnv'}
        '400':
          description: Значение похоже на испорченный маркер маски
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: Не-владелец попытался реально изменить значение переменной
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
      x-events:
        - name: agent:status
          payload: "{ agent }"

