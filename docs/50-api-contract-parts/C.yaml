      tags: [Squads]
      summary: Изменить роль участника внутри отряда
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin, "squad-creator"]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [member_type, member_id, role]
              properties:
                member_type: {type: string, enum: [agent, member]}
                member_id: {type: string, format: uuid}
                role: {type: string}
      responses:
        '200':
          description: Обновлённый участник
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SquadMember'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: Такой участник не найден в отряде
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
      x-events:
        - name: squad:updated
          payload: "{ squad_id }"
  /api/autopilots:
    get:
      operationId: listAutopilots
      tags: [Autopilots]
      summary: Список автопилотов воркспейса
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - {name: status, in: query, schema: {type: string, enum: [active, paused, archived]}}
      responses:
        '200':
          description: Список автопилотов (с типами их триггеров, следующим запуском и can_write для вызывающего)
          content:
            application/json:
              schema:
                type: object
                properties:
                  autopilots: {type: array, items: {$ref: '#/components/schemas/Autopilot'}}
                  total: {type: integer}
    post:
      operationId: createAutopilot
      tags: [Autopilots]
      summary: Создать автопилот
      description: >
        Требует человека-участника (`RequireHumanActor`). `assignee_type` по
        умолчанию `agent` (либо `squad`); исполнитель должен существовать,
        не быть архивированным и быть доступным вызывающему для запуска.
        `execution_mode` — `create_issue` (автопилот создаёт новую задачу на
        каждый триггер) или `run_only` (запускает исполнителя без создания
        задачи). Создание всегда фиксирует первую версию правила
        (`autopilot_rule_version`) для истории конфигурации.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAutopilotRequest'}
      responses:
        '201':
          description: Автопилот создан
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Autopilot'}
        '400': {$ref: '#/components/responses/BadRequest'}
      x-events:
        - name: autopilot:created
          payload: "{ autopilot }"

  /api/autopilots/cron-preview:
    get:
      operationId: previewAutopilotCron
      tags: [Autopilots]
      summary: Показать ближайшие 3 срабатывания cron-выражения в заданной таймзоне
      description: Не требует существующего автопилота — чистая функция валидации/вычисления расписания.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - {name: expr, in: query, required: true, schema: {type: string}}
        - {name: tz, in: query, schema: {type: string, default: UTC}, description: IANA-имя таймзоны}
      responses:
        '200':
          description: Ближайшие моменты срабатывания
          content:
            application/json:
              schema:
                type: object
                properties:
                  next_runs: {type: array, items: {type: string, format: date-time}}
        '400':
          description: Невалидное cron-выражение или таймзона
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: {type: string}
                  code: {type: string, enum: [invalid_cron, invalid_timezone]}

  /api/autopilots/{id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getAutopilot
      tags: [Autopilots]
      summary: Получить автопилот целиком (с триггерами и коллабораторами)
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member]
      responses:
        '200':
          description: Автопилот, его триггеры и коллабораторы
          content:
            application/json:
              schema:
                type: object
                properties:
                  autopilot: {$ref: '#/components/schemas/Autopilot'}
                  triggers: {type: array, items: {$ref: '#/components/schemas/AutopilotTrigger'}}
                  collaborators: {type: array, items: {$ref: '#/components/schemas/AutopilotCollaborator'}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateAutopilot
      tags: [Autopilots]
      summary: Изменить автопилот
      description: >
        Требует человека-участника с правом записи (создатель, владелец/админ
        воркспейса или коллаборатор). Существенное изменение правила
        (исполнитель, execution_mode, шаблон заголовка и т.п. — то, что
        реально меняет поведение) создаёт новую версию правила и обновляет
        `published_by` у всех триггеров автопилота, чтобы последующие запуски
        были атрибутированы актуальному автору конфигурации.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: ["autopilot-creator", owner, admin, "autopilot-collaborator"]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateAutopilotRequest'}
      responses:
        '200':
          description: Обновлённый автопилот
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Autopilot'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      x-events:
        - name: autopilot:updated
          payload: "{ autopilot }"
    delete:
      operationId: deleteAutopilot
      tags: [Autopilots]
      summary: Архивировать автопилот
      description: Мягкое удаление (status → archived), с записью новой версии правила.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: ["autopilot-creator", owner, admin, "autopilot-collaborator"]
      responses:
        '204': {description: Автопилот архивирован}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      x-events:
        - name: autopilot:deleted
          payload: "{ autopilot_id }"

  /api/autopilots/{id}/trigger:
    post:
      operationId: triggerAutopilot
      tags: [Autopilots]
      summary: Запустить автопилот вручную прямо сейчас
      description: Автопилот должен быть в статусе `active`; создаёт AutopilotRun с source=manual.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: ["autopilot-creator", owner, admin, "autopilot-collaborator"]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Созданный прогон (может быть сразу skipped с reason_code, если запуск отклонён бизнес-правилами)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AutopilotRun'}
        '400':
          description: Автопилот не активен
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403': {$ref: '#/components/responses/Forbidden'}
      x-events:
        - name: autopilot:run_start
          when: через AutopilotService.DispatchAutopilotManual

  /api/autopilots/{id}/runs:
    get:
      operationId: listAutopilotRuns
      tags: [AutopilotRuns]
      summary: История прогонов автопилота
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, default: 20, maximum: 100}}
        - {name: offset, in: query, schema: {type: integer, default: 0}}
      responses:
        '200':
          description: Список прогонов (укороченная форма, без сырых payload)
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs: {type: array, items: {$ref: '#/components/schemas/AutopilotRun'}}
                  total: {type: integer}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/autopilots/{id}/runs/{runId}:
    get:
      operationId: getAutopilotRun
      tags: [AutopilotRuns]
      summary: Один прогон автопилота целиком (с полным trigger_payload и result)
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Прогон автопилота
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AutopilotRun'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/autopilots/{id}/deliveries:
    get:
      operationId: listAutopilotDeliveries
      tags: [AutopilotDeliveries]
      summary: История входящих вебхук-доставок автопилота
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, default: 20, maximum: 100}}
        - {name: offset, in: query, schema: {type: integer, default: 0}}
      responses:
        '200':
          description: Список доставок (без тела запроса/ответа — см. getAutopilotDelivery для деталей)
          content:
            application/json:
              schema:
                type: object
                properties:
                  deliveries: {type: array, items: {$ref: '#/components/schemas/WebhookDelivery'}}
                  total: {type: integer}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/autopilots/{id}/deliveries/{deliveryId}:
    get:
      operationId: getAutopilotDelivery
      tags: [AutopilotDeliveries]
      summary: Одна вебхук-доставка целиком (с сырым телом и заголовками)
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: deliveryId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Доставка (полная форма)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookDelivery'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/autopilots/{id}/deliveries/{deliveryId}/replay:
    post:
      operationId: replayAutopilotDelivery
      tags: [AutopilotDeliveries]
      summary: Повторно обработать ранее полученную вебхук-доставку
      description: >
        Требует право записи на автопилот. Нельзя реплеить доставку, у которой
        подпись не прошла проверку (`signature_status=invalid` или
        `status=rejected`), у которой нет сохранённого тела, либо чей триггер
        сейчас отключён; автопилот должен быть `active`. Реплей создаёт новую
        запись WebhookDelivery со ссылкой `replayed_from_delivery_id` на
        исходную и снова прогоняет её через диспетчер автопилота.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: ["autopilot-creator", owner, admin, "autopilot-collaborator"]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: deliveryId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '201':
          description: Новая (реплейная) доставка, уже обработанная
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookDelivery'}
        '400':
          description: Доставку нельзя реплеить (см. описание условий)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      x-events:
        - name: autopilot:run_start / autopilot:run_done
          when: через AutopilotService.DispatchAutopilot при реплее

  /api/autopilots/{id}/triggers:
    post:
      operationId: createAutopilotTrigger
      tags: [AutopilotTriggers]
      summary: Добавить триггер автопилоту (расписание, вебхук или API)
      description: >
        Требует человека-участника с правом записи. `kind: webhook` генерирует
        уникальный `webhook_token`, по которому строится публичный URL
        приёма; `kind: schedule` требует `cron_expression` и вычисляет
        `next_run_at`. `event_filters` (для webhook) ограничивает, какие
        входящие события провайдера (например GitHub) реально запускают
        автопилот.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: ["autopilot-creator", owner, admin, "autopilot-collaborator"]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAutopilotTriggerRequest'}
      responses:
        '201':
          description: Триггер создан (webhook_token/URL видны только в этом и последующих ответах владельцу с правом записи)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AutopilotTrigger'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
      x-events:
        - name: autopilot:updated
          payload: "{ autopilot_id, trigger (без webhook_token/webhook_path/webhook_url) }"

  /api/autopilots/{id}/triggers/{triggerId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: triggerId, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      operationId: updateAutopilotTrigger
      tags: [AutopilotTriggers]
      summary: Изменить триггер (включить/выключить, расписание, ярлык, фильтры событий)
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: ["autopilot-creator", owner, admin, "autopilot-collaborator"]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateAutopilotTriggerRequest'}
      responses:
        '200':
          description: Обновлённый триггер
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AutopilotTrigger'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      x-events:
        - name: autopilot:updated
          payload: "{ autopilot_id, trigger }"
    delete:
      operationId: deleteAutopilotTrigger
      tags: [AutopilotTriggers]
      summary: Удалить триггер автопилота
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: ["autopilot-creator", owner, admin, "autopilot-collaborator"]
      responses:
        '204': {description: Удалено}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      x-events:
        - name: autopilot:updated
          payload: "{ autopilot_id, trigger_id }"

  /api/autopilots/{id}/triggers/{triggerId}/rotate-webhook-token:
    post:
      operationId: rotateAutopilotTriggerWebhookToken
      tags: [AutopilotTriggers]
      summary: Перевыпустить секретный токен вебхук-триггера
      description: >
        Только для триггеров `kind: webhook`. Старый токен сразу становится
        недействителен; повторяет генерацию до 3 раз при коллизии.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: ["autopilot-creator", owner, admin, "autopilot-collaborator"]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: triggerId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Триггер с новым webhook_token/webhook_url
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AutopilotTrigger'}
        '400':
          description: Триггер не является webhook-триггером
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      x-events:
        - name: autopilot:updated
          payload: "{ autopilot_id, trigger (без webhook_token/webhook_path/webhook_url в broadcast-версии) }"

  /api/autopilots/{id}/triggers/{triggerId}/signing-secret:
    put:
      operationId: setAutopilotTriggerSigningSecret
      tags: [AutopilotTriggers]
      summary: Установить или очистить секрет для проверки подписи вебхука
      description: >
        Только для `kind: webhook`. Пустая строка снимает секрет (подпись
        перестаёт проверяться); непустой секрет должен быть не короче 16
        символов.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: ["autopilot-creator", owner, admin, "autopilot-collaborator"]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: triggerId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signing_secret]
              properties: {signing_secret: {type: string}}
      responses:
        '200':
          description: Обновлённый триггер
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AutopilotTrigger'}
        '400':
          description: Триггер не webhook-триггер, либо секрет короче 16 символов
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      x-events:
        - name: autopilot:updated
          payload: "{ autopilot_id, trigger }"

  /api/autopilots/{id}/collaborators:
    post:
      operationId: addAutopilotCollaborator
      tags: [Autopilots]
      summary: Дать участнику право управлять автопилотом
      description: >
        Управление доступом (в отличие от обычного управления содержимым
        автопилота) разрешено только создателю автопилота или владельцу/
        админу воркспейса, не самим коллабораторам.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: ["autopilot-creator", owner, admin]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties: {user_id: {type: string, format: uuid}}
      responses:
        '201':
          description: Актуальный список коллабораторов
          content:
            application/json:
              schema:
                type: object
                properties:
                  collaborators: {type: array, items: {$ref: '#/components/schemas/AutopilotCollaborator'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
      x-events:
        - name: autopilot:updated
          payload: "{ autopilot_id }"

  /api/autopilots/{id}/collaborators/{userId}:
    delete:
      operationId: removeAutopilotCollaborator
      tags: [Autopilots]
      summary: Отозвать право коллаборатора на управление автопилотом
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: ["autopilot-creator", owner, admin]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Актуальный список коллабораторов
          content:
            application/json:
              schema:
                type: object
                properties:
                  collaborators: {type: array, items: {$ref: '#/components/schemas/AutopilotCollaborator'}}
        '403': {$ref: '#/components/responses/Forbidden'}
      x-events:
        - name: autopilot:updated
          payload: "{ autopilot_id }"
  /api/pins:
    get:
      operationId: listPins
      tags: [Pins]
      summary: Список закреплённых вызывающим пользователем элементов (задачи/проекты)
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
      responses:
        '200':
          description: Список закреплений вызывающего пользователя, отсортированных по позиции
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Pin'}
    post:
      operationId: createPin
      tags: [Pins]
      summary: Закрепить задачу или проект
      description: Новая закладка получает позицию "в конец" (максимум текущих + 1).
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_type, item_id]
              properties:
                item_type: {type: string, enum: [issue, project]}
                item_id: {type: string, format: uuid}
      responses:
        '201':
          description: Закладка создана
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Pin'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404':
          description: Задача/проект не найдены
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: Элемент уже закреплён
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
      x-events:
        - name: pin:created
          payload: "{ pin }"

  /api/pins/reorder:
    put:
      operationId: reorderPins
      tags: [Pins]
      summary: Переставить закладки вызывающего пользователя
      description: Принимает список `{id, position}`; применяется по одной записи, без атомарности между ними.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id: {type: string, format: uuid}
                      position: {type: number}
      responses:
        '204': {description: Порядок обновлён}
        '400': {$ref: '#/components/responses/BadRequest'}
      x-events:
        - name: pin:reordered
          payload: "{ items }"

  /api/pins/{itemType}/{itemId}:
    delete:
      operationId: deletePin
      tags: [Pins]
      summary: Снять закрепление
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - {name: itemType, in: path, required: true, schema: {type: string, enum: [issue, project]}}
        - {name: itemId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Закладка снята}
      x-events:
        - name: pin:deleted
          payload: "{ item_type, item_id }"

  /api/attachments/{id}:
    get:
      operationId: getAttachment
      tags: [Attachments]
      summary: Метаданные вложения (со ссылкой на скачивание)
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member, agent]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Вложение (с временной подписанной ссылкой на скачивание, если применимо)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Attachment'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      operationId: deleteAttachment
      tags: [Attachments]
      summary: Удалить вложение (и файл в объектном хранилище)
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member, agent]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Удалено}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/attachments/{id}/content:
    get:
      operationId: getAttachmentContent
      tags: [Attachments]
      summary: Инлайн-превью текстового содержимого вложения
      description: >
        Только для текстоподобных файлов малого размера (лимит зависит от
        content-type/расширения); для остальных — 415. Требует настроенное
        объектное хранилище (иначе 503).
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member, agent]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Содержимое файла как текст
          content:
            text/plain: {schema: {type: string}}
        '404': {$ref: '#/components/responses/NotFound'}
        '413':
          description: Файл превышает лимит инлайн-превью для своего типа
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '415':
          description: Тип файла не поддерживает текстовое превью
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: Объектное хранилище не настроено
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/comments/{commentId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - {name: commentId, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: updateComment
      tags: [Comments]
      summary: Отредактировать комментарий
      description: >
        Только автор комментария или владелец/админ воркспейса. Если
        `content` реально меняется, сервер отменяет все ещё не выполненные
        задачи агентов, которые были поставлены в очередь именно этим
        комментарием как триггером, и заново прогоняет обновлённый текст
        через ту же логику определения целей, что при создании (см.
        «Правила запуска агентов из комментария» в C.md) — агентам, чьи
        задачи выжили после отмены (например, уже выполнялись), новый текст
        передаётся как обновление контекста, а не новый запуск.
        `attachment_ids`, если передан (даже пустой список), полностью
        заменяет набор вложений комментария.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: ["comment-author", owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateCommentRequest'}
      responses:
        '200':
          description: Обновлённый комментарий (с trigger_outcomes для повторного запуска)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IssueComment'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      x-events:
        - name: comment:updated
          payload: "{ comment }"
    delete:
      operationId: deleteComment
      tags: [Comments]
      summary: Удалить комментарий
      description: >
        Только автор или владелец/админ. Удаляет вложения комментария (файлы
        в хранилище — тоже) и отменяет ещё не выполненные задачи агентов,
        поставленные этим комментарием как триггером; для выживших задач
        (например, уже начавших выполнение) заново прогоняется логика запуска
        по следующему уцелевшему комментарию треда.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: ["comment-author", owner, admin]
      responses:
        '204': {description: Удалено}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      x-events:
        - name: comment:deleted
          payload: "{ comment_id, issue_id }"

  /api/comments/{commentId}/resolve:
    post:
      operationId: resolveComment
      tags: [Comments]
      summary: Отметить комментарий (и тем самым его тред) решённым
      description: >
        Разрешение треда единственно: если в этом же треде была резолюция на
        другом комментарии, она автоматически снимается (публикуя
        `comment:unresolved` для неё) в одной транзакции с установкой новой.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member, agent]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - {name: commentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Обновлённый комментарий
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IssueComment'}
        '404': {$ref: '#/components/responses/NotFound'}
      x-events:
        - name: comment:unresolved
          when: если в треде была другая резолюция — за каждую снятую
          payload: "{ comment }"
        - name: comment:resolved
          when: только если комментарий не был уже решён
          payload: "{ comment }"
    delete:
      operationId: unresolveComment
      tags: [Comments]
      summary: Снять пометку "решено" с комментария
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member, agent]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - {name: commentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Обновлённый комментарий
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IssueComment'}
        '404': {$ref: '#/components/responses/NotFound'}
      x-events:
        - name: comment:unresolved
          when: только если комментарий действительно был решён
          payload: "{ comment }"

  /api/comments/{commentId}/reactions:
    parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - {name: commentId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: addCommentReaction
      tags: [Comments]
      summary: Поставить эмодзи-реакцию на комментарий
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member, agent]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emoji]
              properties: {emoji: {type: string}}
      responses:
        '201':
          description: Реакция добавлена
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommentReaction'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
      x-events:
        - name: reaction:added
          payload: "{ reaction, issue_id, issue_title, issue_status, comment_id, comment_author_type, comment_author_id }"
    delete:
      operationId: removeCommentReaction
      tags: [Comments]
      summary: Снять свою эмодзи-реакцию с комментария
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member, agent]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emoji]
              properties: {emoji: {type: string}}
      responses:
        '204': {description: Реакция снята}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
      x-events:
        - name: reaction:removed
          payload: "{ comment_id, issue_id, emoji, actor_type, actor_id }"
  /api/agents:
    get:
      operationId: listAgents
      tags: [Agents]
      summary: Список агентов воркспейса, видимых вызывающему
      description: >
        Участнику-человеку без собственного «личного помощника» сервер может
        автоматически создать его (тихая инициализация); аналогично, если в
        воркспейсе ещё нет ни одного системного ролевого агента — он тоже
        может быть создан по факту этого запроса. Приватные агенты, к которым
        у вызывающего участника нет прав вызова, из списка исключаются.
        `mcp_config` и `composio_toolkit_allowlist` в каждом элементе
        маскируются/скрываются по тем же правилам видимости секретов, что и
        у getAgent.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - {name: include_archived, in: query, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: Список агентов, видимых вызывающему
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Agent'}
    post:
      operationId: createAgent
      tags: [Agents]
      summary: Создать агента
      description: >
        `runtime_id` обязателен и должен быть агент-рантаймом воркспейса,
        доступным вызывающему (приватный рантайм — только его владельцу или
        админу); провайдер рантайма должен быть разрешён политикой
        воркспейса. `visibility`/`permission_mode`+`invocation_targets` задают
        права вызова агента (см. C.md, «Модель прав вызова агента»);
        `visibility` — устаревший алиас над `permission_mode`. `mcp_config`,
        если передан, валидируется политикой MCP воркспейса и шифруется перед
        сохранением. `skill_ids` — сразу привязываемые навыки (должны
        принадлежать воркспейсу).
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAgentRequest'}
      responses:
        '201':
          description: Агент создан
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Agent'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403':
          description: Рантайм приватный и недоступен вызывающему, либо провайдер запрещён политикой воркспейса
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: Агент с таким именем уже существует в воркспейсе
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
      x-events:
        - name: agent:created
          payload: "{ agent }"

  /api/agents/from-template:
    post:
      operationId: createAgentFromTemplate
      tags: [Agents]
      summary: Создать агента из готового шаблона (с набором навыков)
      description: >
        Шаблон (`template_slug`) описывает предустановленный набор навыков —
        часть из них поставляется вместе с сервером (vendored), часть
        подгружается по URL источника при первом использовании и затем
        переиспользуется по имени в рамках воркспейса. Если хотя бы один
        внешний источник недоступен — вся операция отменяется (422 со списком
        неудачных URL) без создания агента. В остальном поведение и права —
        как у createAgent; `extra_skill_ids` добавляет навыки сверх тех, что
        несёт сам шаблон.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAgentFromTemplateRequest'}
      responses:
        '201':
          description: Агент создан из шаблона
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreateAgentFromTemplateResponse'}
        '400':
          description: Неизвестный template_slug либо не указан runtime_id/name
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: Один из навыков шаблона требует источник, не разрешённый политикой сервера
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: Один или несколько источников навыков шаблона недоступны
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: {type: string}
                  failed_urls: {type: array, items: {type: string}}
      x-events:
        - name: agent:created
          payload: "{ agent }"
  /api/agents/{id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getAgent
      tags: [Agents]
      summary: Получить агента целиком
      description: >
        Доступ к приватному агенту (не входящему в область видимости
        вызывающего) — 403. Секреты (`mcp_config`, значения окружения,
        `composio_toolkit_allowlist`) видны в открытом виде только владельцу
        агента (или воркспейсу с настройкой "всегда раскрывать секреты" —
        тогда и владельцу/админу); иначе — маскируются или скрываются.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member]
      responses:
        '200':
          description: Агент
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Agent'}
        '403':
          description: Нет доступа к этому приватному агенту
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: updateAgent
      tags: [Agents]
      summary: Изменить агента
      description: >
        Многие поля доступны любому, кто может управлять агентом
        (владелец агента, либо владелец/админ воркспейса), но часть полей —
        `instructions`, `custom_args`, `runtime_config` (несёт учётные данные
        шлюза), выбор `runtime_id`, права вызова (`permission_mode`/
        `invocation_targets`/`visibility`) и `composio_toolkit_allowlist` —
        изменяет только владелец агента; попытка не-владельца реально
        изменить такое поле — 403 (запрос с тем же значением, что уже
        сохранено, молча игнорируется, а не отклоняется). `custom_env` через
        этот эндпоинт не принимается — только через
        `PUT /api/agents/{id}/env`. Секретные значения `mcp_config`,
        показанные ранее в маскированном виде, распознаются по спец-маркеру и
        не перезаписывают реальное значение той же строки, если она не менялась.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: ["agent-owner", owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateAgentRequest'}
      responses:
        '200':
          description: Обновлённый агент
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Agent'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403':
          description: Попытка не-владельца изменить поле, доступное только владельцу
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: Агент с таким именем уже существует
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
      x-events:
        - name: agent:status
          payload: "{ agent }"

  /api/agents/{id}/archive:
    post:
      operationId: archiveAgent
      tags: [Agents]
      summary: Архивировать агента
      description: Отменяет все активные задачи агента. Повторная архивация уже архивированного агента — 409.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: ["agent-owner", owner, admin]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Архивированный агент
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Agent'}
        '409':
          description: Агент уже архивирован
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
      x-events:
        - name: agent:archived
          payload: "{ agent }"

  /api/agents/{id}/restore:
    post:
      operationId: restoreAgent
      tags: [Agents]
      summary: Восстановить архивированного агента
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: ["agent-owner", owner, admin]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Восстановленный агент
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Agent'}
        '409':
          description: Агент не архивирован
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
      x-events:
        - name: agent:restored
          payload: "{ agent }"

  /api/agents/{id}/cancel-tasks:
    post:
      operationId: cancelAgentTasks
      tags: [Agents]
      summary: Отменить все активные запуски агента
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: ["agent-owner", owner, admin]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Число отменённых задач
          content:
            application/json:
              schema:
                type: object
                properties: {cancelled: {type: integer}}
      x-events:
