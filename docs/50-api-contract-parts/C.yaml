          description: Обойти проверку на активный дубликат по похожему заголовку
      description: >
        status по умолчанию todo, priority — none. assignee_type/assignee_id
        должны быть переданы вместе или не переданы вовсе.

    UpdateIssueRequest:
      type: object
      properties:
        title: {type: string}
        description: {type: string, nullable: true}
        status: {$ref: '#/components/schemas/IssueStatus'}
        priority: {$ref: '#/components/schemas/IssuePriority'}
        assignee_type: {allOf: [{$ref: '#/components/schemas/IssueActorType'}], nullable: true}
        assignee_id: {type: string, format: uuid, nullable: true}
        position: {type: number, format: double}
        start_date: {type: string, format: date, nullable: true}
        due_date: {type: string, format: date, nullable: true}
        parent_issue_id: {type: string, format: uuid, nullable: true}
        project_id: {type: string, format: uuid, nullable: true}
        stage: {type: integer, minimum: 1, nullable: true}
        attachment_ids: {type: array, items: {type: string, format: uuid}, description: "Присутствие ключа с непустым списком добавляет вложения; полностью не заменяет список"}
        suppress_run:
          type: boolean
          default: false
          description: Не запускать агента, даже если сработало правило автозапуска
        handoff_note:
          type: string
          description: Дополнительный контекст, передаваемый агенту, если постановка в очередь всё же происходит

