  /api/issues/{id}/tasks/{taskId}/cancel:
    post:
      operationId: cancelIssueTask
      tags: [IssueTasks]
      summary: Отменить конкретный запуск агента на задаче
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member, agent]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
