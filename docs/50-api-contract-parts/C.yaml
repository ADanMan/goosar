      description: >
        `leader_id` — существующий агент воркспейса, к которому у вызывающего
        участника есть право обращения (owner/admin — всегда; иначе как у
        обычного вызова агента). Лидер автоматически добавляется первым
        участником отряда с ролью `leader`.
