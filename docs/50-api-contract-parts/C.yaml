  /api/agents/{id}/runtime-skills/enabled:
    put:
      operationId: setAgentRuntimeSkillEnabled
      tags: [AgentSkills]
      summary: Включить/выключить встроенный навык рантайма (не пользовательский Skill) для агента
      description: >
        Отдельный механизм от AgentSkills: относится к навыкам, которые
        поставляются самим исполняемым рантаймом агента (провайдеры
        `runtime-c`/`runtime-e`, режим `local`), а не к сущностям Skill
        воркспейса. Список выключенных навыков рантайма хранится прямо на
        агенте (`disabled_runtime_skills`) и обнуляется/переоценивается, если
        агент перепривязан на другой рантайм.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: ["agent-owner", owner, admin]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runtime_id, root, key, enabled]
              properties:
                runtime_id: {type: string, format: uuid}
                root: {type: string, enum: [provider, universal, plugin]}
                key: {type: string, maxLength: 512}
                name: {type: string}
                plugin: {type: string, description: Обязателен при root=plugin, только для провайдера runtime-c}
                enabled: {type: boolean}
      responses:
        '204': {description: Настройка сохранена}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404':
          description: Указанный runtime не найден в воркспейсе
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: Агент больше не привязан к указанному runtime_id
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
      x-events:
        - name: agent:status
          payload: "{ agent }"

