  /api/issues/{id}/metadata:
    get:
      operationId: listIssueMetadata
      tags: [IssueMetadata]
      summary: Получить произвольные метаданные задачи (плоский словарь key→примитив)
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member, agent]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Словарь метаданных
          content:
            application/json:
              schema:
                type: object
                properties: {metadata: {type: object, additionalProperties: {type: [string, number, boolean]}}}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/issues/{id}/metadata/{key}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: key, in: path, required: true, schema: {type: string, pattern: '^[a-zA-Z_][a-zA-Z0-9_.-]{0,63}$'}}
    put:
      operationId: setIssueMetadataKey
      tags: [IssueMetadata]
      summary: Установить одно значение метаданных задачи
      description: >
        Значение — только примитив (строка/число/булево), не объект и не
        массив, не null (для удаления — DELETE на этот же путь). Ключ должен
        соответствовать `^[a-zA-Z_][a-zA-Z0-9_.-]{0,63}$`. Задача не может
        иметь больше 50 ключей метаданных одновременно, а весь блок metadata —
        не больше 8 КБ в сериализованном виде (иначе 400).
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member, agent]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: {description: Примитив — строка, число или булево}
      responses:
        '200':
          description: Полный обновлённый словарь метаданных
          content:
            application/json:
              schema:
                type: object
                properties: {metadata: {type: object, additionalProperties: {type: [string, number, boolean]}}}
        '400':
          description: Неверный ключ/значение, превышен лимит в 50 ключей или 8 КБ
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
      x-events:
        - name: issue_metadata:changed
          payload: "{ issue_id, metadata }"
    delete:
      operationId: deleteIssueMetadataKey
      tags: [IssueMetadata]
      summary: Удалить один ключ метаданных задачи
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member, agent]
      responses:
        '200':
          description: Полный обновлённый словарь метаданных
          content:
            application/json:
              schema:
                type: object
                properties: {metadata: {type: object, additionalProperties: {type: [string, number, boolean]}}}
        '404': {$ref: '#/components/responses/NotFound'}
      x-events:
        - name: issue_metadata:changed
          payload: "{ issue_id, metadata }"

  /api/issues/{id}/properties/{propertyId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: propertyId, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: setIssuePropertyValue
      tags: [IssueProperties]
      summary: Установить значение кастомного свойства для задачи
      description: >
        Формат `value` зависит от типа определения свойства: `text`/`url` —
        непустая строка (в пределах лимита длины), `number` — число,
        `checkbox` — булево, `date` — строка `YYYY-MM-DD`, `select` — ID
        одного из вариантов конфигурации свойства, `multi_select` — непустой
        массив ID вариантов (дубликаты схлопываются, порядок нормализуется по
        порядку вариантов в определении). Архивированному определению
        свойства нельзя присвоить новое значение (400). Итоговый JSON-блок
        `properties` задачи ограничен 16 КБ.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member, agent]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties: {value: {}}
      responses:
        '200':
          description: Полный обновлённый словарь свойств задачи
          content:
            application/json:
              schema:
                type: object
                properties: {properties: {$ref: '#/components/schemas/IssuePropertyValues'}}
        '400':
          description: Значение не подходит под тип свойства, свойство архивировано, либо превышен лимит 16 КБ
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: Определение свойства не найдено в воркспейсе
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
      x-events:
        - name: issue_properties:changed
          payload: "{ issue_id, properties }"
    delete:
      operationId: deleteIssuePropertyValue
      tags: [IssueProperties]
      summary: Снять значение кастомного свойства с задачи
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member, agent]
      responses:
        '200':
          description: Полный обновлённый словарь свойств задачи
          content:
            application/json:
              schema:
                type: object
                properties: {properties: {$ref: '#/components/schemas/IssuePropertyValues'}}
        '404':
          description: Определение свойства не найдено в воркспейсе
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
      x-events:
        - name: issue_properties:changed
          payload: "{ issue_id, properties }"

  /api/issues/{id}/pull-requests:
    get:
      operationId: listIssuePullRequests
      tags: [Issues]
      summary: Список pull request'ов, связанных с задачей
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member, agent]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Список связанных pull request'ов
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/IssuePullRequestLink'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/issues/{id}/squad-evaluated:
    post:
      operationId: recordSquadLeaderEvaluation
      tags: [Squads]
      summary: Записать решение лидера отряда по задаче (взял в работу / не взял / ошибка)
      description: >
        Вызывается только самим агентом-лидером отряда, на который назначена
        задача, и только в рамках его собственного активного запуска
        (заголовок `X-Task-ID` обязателен и должен принадлежать этой задаче
        и этому лидеру); человек или другой агент получит 403. Записывает
        запись активности `squad_leader_evaluated` с исходом
        (`action`/`no_action`/`failed`) и произвольной причиной.
      security: [{bearerAuth: []}]
      x-roles: [agent]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: X-Task-ID, in: header, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: {type: string, enum: [action, no_action, failed]}
                reason: {type: string}
      responses:
        '201':
          description: Запись активности создана
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
                  action: {type: string, enum: [squad_leader_evaluated]}
                  created_at: {type: string, format: date-time}
        '400':
          description: Неверный outcome, либо задача не назначена на отряд
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: Вызывающий — не тот лидер отряда, на который назначена задача
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: Отряд не найден, либо задача агента не привязана к этой задаче
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
      x-events:
        - name: activity:created
          payload: "{ issue_id, entry: { type: activity, id, actor_type: agent, actor_id, action: squad_leader_evaluated, details, created_at } }"

  /api/tasks/{taskId}/messages:
    get:
      operationId: listTaskMessages
      tags: [IssueTasks]
      summary: Лог сообщений (стенограмма) одного запуска агента
      description: >
        Задача должна принадлежать текущему воркспейсу запроса — иначе 404,
        даже если она существует в другом воркспейсе. `since` — вернуть
        только сообщения с номером последовательности (seq) больше указанного,
        для инкрементального опроса.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member, agent]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - {name: taskId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: since, in: query, schema: {type: integer}, description: "seq, с которого выдавать сообщения (эксклюзивно)"}
      responses:
        '200':
          description: Список сообщений запуска
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/TaskMessage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/properties:
    get:
      operationId: listProperties
      tags: [Properties]
      summary: Список определений кастомных свойств задач воркспейса
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member, agent]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - {name: include_archived, in: query, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: Список определений свойств
          content:
            application/json:
              schema:
                type: object
                properties:
                  properties: {type: array, items: {$ref: '#/components/schemas/Property'}}
                  total: {type: integer}
    post:
      operationId: createProperty
      tags: [Properties]
      summary: Создать определение кастомного свойства задач
      description: >
        Только владелец/админ воркспейса (не агент). Имя — до 32 символов,
        без управляющих символов, не совпадает с зарезервированными
        встроенными именами полей задачи (status, priority, assignee, project,
        parent, stage, label(s), start_date, due_date, title, description,
        creator, created_at, updated_at, metadata, properties). Тип — один из
        `text, number, select, multi_select, date, checkbox, url`; для
        `select`/`multi_select` обязателен непустой `config.options` (до 50
        вариантов, уникальные имена и ID, ID — UUID, генерируется автоматически
        если не передан). Воркспейс не может иметь больше 20 неархивированных
        свойств одновременно (защищено advisory-локом на всё время операции).
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreatePropertyRequest'}
      responses:
        '201':
          description: Определение свойства создано
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Property'}
        '400':
          description: Невалидное имя/тип/конфигурация опций либо превышен лимит 20 активных свойств
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: Вызывающий не владелец/админ, либо является агентом
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: Свойство с таким именем уже существует
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
      x-events:
        - name: property:created
          payload: "{ property }"

  /api/properties/{id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getProperty
      tags: [Properties]
      summary: Получить одно определение свойства
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member, agent]
      responses:
        '200':
          description: Определение свойства
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Property'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
