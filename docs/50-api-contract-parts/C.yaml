        status: {$ref: '#/components/schemas/IssueStatus'}
        assignee_type: {allOf: [{$ref: '#/components/schemas/IssueActorType'}], nullable: true}
        assignee_id: {type: string, format: uuid, nullable: true}
        parent_issue_id: {type: string, format: uuid, nullable: true}
        project_id: {type: string, format: uuid, nullable: true}
        before_id: {type: string, format: uuid, nullable: true, description: "ID соседа сверху, либо null"}
        after_id: {type: string, format: uuid, nullable: true, description: "ID соседа снизу, либо null"}

    BatchUpdateIssuesRequest:
      type: object
      required: [issue_ids, updates]
      properties:
        issue_ids: {type: array, items: {type: string, format: uuid}}
        updates: {$ref: '#/components/schemas/UpdateIssueRequest'}

    QuickCreateIssueRequest:
      type: object
      required: [prompt]
      properties:
        agent_id: {type: string, format: uuid, description: "Ровно одно из agent_id/squad_id обязательно"}
        squad_id: {type: string, format: uuid}
        prompt: {type: string}
        priority: {type: string, enum: [urgent, high, medium, low]}
        due_date: {type: string, format: date}
        project_id: {type: string, format: uuid}
        parent_issue_id: {type: string, format: uuid}
        attachment_ids: {type: array, items: {type: string, format: uuid}}

    IssueTriggerPreviewRequest:
      type: object
      properties:
        issue_ids: {type: array, items: {type: string, format: uuid}, maxItems: 500}
        is_create: {type: boolean, default: false}
        assignee_type: {allOf: [{$ref: '#/components/schemas/IssueActorType'}], nullable: true}
        assignee_id: {type: string, format: uuid, nullable: true}
        status: {$ref: '#/components/schemas/IssueStatus'}

    IssueTriggerPreviewResponse:
      type: object
      properties:
        triggers:
          type: array
          items:
            type: object
            properties:
              issue_id: {type: string, format: uuid}
              agent_id: {type: string, format: uuid}
              source: {type: string, enum: [assign, status]}
              handoff_supported: {type: boolean}
        total_count: {type: integer}

    IssueReaction:
      type: object
      properties:
        id: {type: string, format: uuid}
        issue_id: {type: string, format: uuid}
        actor_type: {type: string, enum: [member, agent]}
        actor_id: {type: string, format: uuid}
        emoji: {type: string}
        created_at: {type: string, format: date-time}

    IssueSubscriber:
      type: object
      properties:
        issue_id: {type: string, format: uuid}
        user_type: {type: string, enum: [member, agent]}
        user_id: {type: string, format: uuid}
        reason: {type: string, enum: [creator, assignee, commenter, mentioned, manual, autopilot]}
        created_at: {type: string, format: date-time}

    IssueTimelineEntry:
      type: object
      description: Единица ленты активности задачи — комментарий, изменение поля или системная запись
      properties:
        type: {type: string}
        id: {type: string, format: uuid}
        actor_type: {type: string, enum: [member, agent, system]}
        actor_id: {type: string, format: uuid, nullable: true}
        action: {type: string}
        details: {type: object, additionalProperties: true}
        created_at: {type: string, format: date-time}

    IssuePullRequestLink:
      type: object
      properties:
        issue_id: {type: string, format: uuid}
        provider: {type: string}
        url: {type: string}
        number: {type: integer}
        title: {type: string, nullable: true}
        state: {type: string, nullable: true}
        created_at: {type: string, format: date-time}

    IssueUsageSummary:
      type: object
      properties:
        total_input_tokens: {type: integer}
        total_output_tokens: {type: integer}
        total_cache_read_tokens: {type: integer}
        total_cache_write_tokens: {type: integer}
        cost_usd_ticks: {type: integer, description: Стоимость в минимальных единицах (тиках), см. общий раздел биллинга}
        uncosted_input_tokens: {type: integer}
        uncosted_output_tokens: {type: integer}
        uncosted_cache_read_tokens: {type: integer}
        uncosted_cache_write_tokens: {type: integer}
        task_count: {type: integer}
    AgentTask:
      type: object
      description: >
        Один запуск агента на задаче (полная модель определена в разделе
