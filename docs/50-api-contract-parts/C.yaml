  /api/agents/{id}/mcp-servers/{serverId}:
    delete:
      operationId: removeAgentMcpServer
      tags: [AgentMcpServers]
      summary: Отвязать MCP-сервер от агента
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: serverId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Актуальный список привязанных MCP-серверов
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AgentMcpServer'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: Этот MCP-сервер не привязан к агенту
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
components:
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Не аутентифицирован
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Недостаточно прав
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    IssueStatus:
      type: string
      enum: [backlog, todo, in_progress, in_review, done, blocked, cancelled]
    IssuePriority:
      type: string
      enum: [urgent, high, medium, low, none]
    IssueActorType:
      type: string
      enum: [member, agent, squad]
      description: squad допустим только как assignee_type задачи, не как creator_type (создатель — всегда member или agent)

    Issue:
      type: object
      properties:
        id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        number: {type: integer, description: Монотонно возрастающий номер задачи в пределах воркспейса}
        identifier: {type: string, description: "Человекочитаемый ключ вида PREFIX-NUMBER, например ENG-42"}
        title: {type: string}
        description: {type: string, nullable: true}
        status: {$ref: '#/components/schemas/IssueStatus'}
        priority: {$ref: '#/components/schemas/IssuePriority'}
        assignee_type: {allOf: [{$ref: '#/components/schemas/IssueActorType'}], nullable: true}
        assignee_id: {type: string, format: uuid, nullable: true}
        creator_type: {type: string, enum: [member, agent]}
        creator_id: {type: string, format: uuid}
        parent_issue_id: {type: string, format: uuid, nullable: true}
        project_id: {type: string, format: uuid, nullable: true}
        position: {type: number, format: double, description: Порядковая позиция для ручной сортировки (дробное число, см. moveIssue)}
        stage: {type: integer, nullable: true, minimum: 1, description: "Необязательный номер под-этапа внутри статуса, для многошаговых воркфлоу"}
        start_date: {type: string, format: date, nullable: true}
        due_date: {type: string, format: date, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        metadata:
          type: object
          additionalProperties: {type: [string, number, boolean]}
        properties: {$ref: '#/components/schemas/IssuePropertyValues'}
        reactions:
          type: array
          items: {$ref: '#/components/schemas/IssueReaction'}
        attachments:
          type: array
          items: {$ref: '#/components/schemas/Attachment'}
        labels:
          type: array
          items: {$ref: '#/components/schemas/Label'}

    IssuePropertyValues:
      type: object
      description: "Словарь {property_definition_id (UUID): значение}, тип значения зависит от типа определения свойства"
      additionalProperties: {}

    IssueListResponse:
      type: object
      properties:
        issues: {type: array, items: {$ref: '#/components/schemas/Issue'}}
        total: {type: integer}

    SearchIssuesResponse:
      type: object
      properties:
        issues:
          type: array
          items:
            allOf:
              - {$ref: '#/components/schemas/Issue'}
              - type: object
                properties:
                  match_source: {type: string, enum: [title, description, comment]}
                  matched_snippet: {type: string, nullable: true}
                  matched_description_snippet: {type: string, nullable: true}
                  matched_comment_snippet: {type: string, nullable: true}
        total: {type: integer}

    ChildIssueProgressEntry:
      type: object
      properties:
        parent_issue_id: {type: string, format: uuid}
        total: {type: integer}
        done: {type: integer, description: "Число дочерних задач в терминальном статусе (done или cancelled)"}

    IssueAssigneeGroup:
      type: object
      properties:
        id: {type: string, description: "assignee:<type>:<id> либо assignee:unassigned"}
        assignee_type: {allOf: [{$ref: '#/components/schemas/IssueActorType'}], nullable: true}
        assignee_id: {type: string, format: uuid, nullable: true}
        issues: {type: array, items: {$ref: '#/components/schemas/Issue'}}
        total: {type: integer}

    GroupedIssuesResponse:
      type: object
      properties:
        groups: {type: array, items: {$ref: '#/components/schemas/IssueAssigneeGroup'}}

    CreateIssueRequest:
      type: object
      required: [title]
      properties:
        title: {type: string}
        description: {type: string, nullable: true}
        status: {$ref: '#/components/schemas/IssueStatus'}
        priority: {$ref: '#/components/schemas/IssuePriority'}
        assignee_type: {allOf: [{$ref: '#/components/schemas/IssueActorType'}], nullable: true}
