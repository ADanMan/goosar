        видимые через маршруты issues/agents этой части).
      properties:
        id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        issue_id: {type: string, format: uuid, nullable: true}
        agent_id: {type: string, format: uuid, nullable: true}
        status:
          type: string
          enum: [queued, dispatched, running, completed, failed, cancelled, waiting_local_directory, deferred]
        created_at: {type: string, format: date-time}
        dispatched_at: {type: string, format: date-time, nullable: true}
        started_at: {type: string, format: date-time, nullable: true}
        completed_at: {type: string, format: date-time, nullable: true}
      additionalProperties: true

    TaskMessage:
      type: object
      properties:
        task_id: {type: string, format: uuid}
        issue_id: {type: string, format: uuid, nullable: true}
        seq: {type: integer}
        role: {type: string}
        content: {type: object, additionalProperties: true}
        created_at: {type: string, format: date-time}
      additionalProperties: true

    IssueTableActorRef:
      type: object
      required: [type, id]
      properties:
        type: {$ref: '#/components/schemas/IssueActorType'}
        id: {type: string, format: uuid}

    IssueTableScope:
      type: object
      description: |
        `kind: workspace` — весь воркспейс; `project` — конкретный проект
        (`project_id`); `assignee`/`creator` — конкретный актор (`actor`);
        `my` — обзор "моё" с `relation`: `assigned` (назначено), `created`
        (создано мной), `involved` (я как исполнитель через агента/отряд,
        которым владею), `any` (любое из перечисленного).
      required: [kind]
      properties:
        kind: {type: string, enum: [workspace, project, assignee, creator, my]}
        assignee_types: {type: array, items: {$ref: '#/components/schemas/IssueActorType'}}
        project_id: {type: string, format: uuid}
        actor: {$ref: '#/components/schemas/IssueTableActorRef'}
        relation: {type: string, enum: [assigned, created, involved, any]}

    IssueTableDateFilter:
      type: object
      required: [field, start, end]
      properties:
        field: {type: string, enum: [created_at, updated_at]}
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}

    IssueTableFilters:
      type: object
      properties:
        statuses: {type: array, items: {$ref: '#/components/schemas/IssueStatus'}}
        priorities: {type: array, items: {$ref: '#/components/schemas/IssuePriority'}}
        assignees: {type: array, items: {$ref: '#/components/schemas/IssueTableActorRef'}}
        include_no_assignee: {type: boolean}
        creators: {type: array, items: {$ref: '#/components/schemas/IssueTableActorRef'}}
        project_ids: {type: array, items: {type: string, format: uuid}}
        include_no_project: {type: boolean}
        label_ids: {type: array, items: {type: string, format: uuid}}
        properties:
          type: object
          description: "{property_definition_id: [значения]}"
          additionalProperties: {type: array, items: {type: string}}
        date: {$ref: '#/components/schemas/IssueTableDateFilter'}
        working_only: {type: boolean, description: Только задачи, над которыми сейчас реально идёт запуск агента}
        working_issue_ids: {type: array, items: {type: string, format: uuid}}
        include_sub_issues: {type: boolean}

    IssueTableSort:
      type: object
      properties:
        field: {type: string}
        direction: {type: string, enum: [asc, desc]}

    IssueTableQuery:
      type: object
      properties:
        scope: {$ref: '#/components/schemas/IssueTableScope'}
        filters: {$ref: '#/components/schemas/IssueTableFilters'}
        search: {type: string}
        sort: {$ref: '#/components/schemas/IssueTableSort'}

    IssueTableGroupSpec:
      type: object
      description: "kind: none|status|assignee|project|parent|compound|property (compound комбинирует primary+secondary, property требует property_id)"
      properties:
        kind: {type: string, enum: [none, status, assignee, project, parent, compound, property]}
        property_id: {type: string, format: uuid}
        include_empty: {type: boolean}
        primary: {type: string}
        secondary: {type: string}
        secondary_values: {type: array, items: {type: string}}

    IssueTablePage:
      type: object
      properties:
        limit: {type: integer, default: 50, maximum: 100}
        cursor: {type: string, nullable: true, description: Непрозрачный курсор из предыдущего ответа}

    IssueTableGroupsRequest:
      type: object
      properties:
        query: {$ref: '#/components/schemas/IssueTableQuery'}
        group: {$ref: '#/components/schemas/IssueTableGroupSpec'}
        page: {$ref: '#/components/schemas/IssueTablePage'}

    IssueTableGroupsResponse:
      type: object
      properties:
        groups:
          type: array
          items:
            type: object
            properties:
              group_key: {type: string, nullable: true}
              label: {type: string}
              total: {type: integer}
        next_cursor: {type: string, nullable: true}

    IssueTableRowsRequest:
      type: object
      properties:
        query: {$ref: '#/components/schemas/IssueTableQuery'}
        group: {$ref: '#/components/schemas/IssueTableGroupSpec'}
        group_key: {type: string, nullable: true}
        hierarchy:
          type: object
          properties: {enabled: {type: boolean}}
        parent_id: {type: string, format: uuid, nullable: true}
        page: {$ref: '#/components/schemas/IssueTablePage'}

    IssueTableRowsResponse:
      type: object
      properties:
        query_fingerprint: {type: string, description: Хэш параметров запроса; курсор действителен только с тем же fingerprint}
        group_key: {type: string, nullable: true}
        parent_id: {type: string, nullable: true}
        total: {type: integer}
        branch_total: {type: integer, description: Число задач в текущей ветке иерархии (при hierarchy.enabled)}
        rows:
          type: array
          items:
            type: object
            properties:
              issue: {$ref: '#/components/schemas/Issue'}
              direct_child_count: {type: integer}
        next_cursor: {type: string, nullable: true}

    IssueTableFacetSpec:
      type: object
      properties:
        kind: {type: string, enum: [status, priority, assignee, creator, project, label, property]}
        property_id: {type: string, format: uuid}

    IssueTableFacetsRequest:
      type: object
      properties:
        query: {$ref: '#/components/schemas/IssueTableQuery'}
        facets: {type: array, items: {$ref: '#/components/schemas/IssueTableFacetSpec'}}
        include_total: {type: boolean}

    IssueTableFacetsResponse:
      type: object
      properties:
        facets:
          type: array
          items:
            type: object
            properties:
              kind: {type: string}
              property_id: {type: string, format: uuid, nullable: true}
              values:
                type: array
                items:
                  type: object
                  properties:
                    value: {type: string, nullable: true}
                    label: {type: string}
                    count: {type: integer}
        total: {type: integer, nullable: true}
    DispatchStatus:
      type: string
      enum: [queued, deferred, coalesced, blocked]
      description: >
        Итог попытки поставить агента в очередь по триггеру комментария:
        queued — новая задача поставлена; deferred — отложено (например,
        агент уже занят той же задачей); coalesced — объединено с уже
        существующим ожидающим запуском того же агента на той же задаче;
        blocked — отклонено (см. reason_code).

    DispatchReasonCode:
      type: string
      enum:
        - queued
        - deferred
        - coalesced
        - already_active
        - self_trigger_suppressed
        - invocation_not_allowed
        - attribution_blocked
        - internal_error

    CommentTriggerOutcome:
      type: object
      properties:
        target_type: {type: string, enum: [agent, squad]}
        target_id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/DispatchStatus'}
        reason_code: {$ref: '#/components/schemas/DispatchReasonCode'}

    CommentReaction:
      type: object
      properties:
