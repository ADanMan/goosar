  # ---------------------------------------------------------------------
  # Runtimes
  # ---------------------------------------------------------------------
  /api/runtimes:
    get:
      operationId: listRuntimes
      summary: Список runtime-сред (daemon-окружений), зарегистрированных в воркспейсе
      description: >
        Runtime — это подключённое к воркспейсу daemon-окружение (десктопное
        приложение или облачный воркер), способное исполнять задачи агентов.
        `?owner=me` сужает список до runtime, которыми владеет вызывающий
        пользователь.
      tags: [Runtimes]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - name: owner
          in: query
          schema: { type: string, enum: [me] }
      x-roles: [owner, admin, member]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Runtime' } } } }

  /api/runtimes/{runtimeId}:
    patch:
      operationId: updateRuntime
      summary: Изменить видимость и/или отображаемое имя runtime
      description: >
        Изменять runtime может его владелец либо owner/admin воркспейса.
        `custom_name` — человекочитаемое имя, максимум 100 символов;
        пустая строка сбрасывает имя на значение по умолчанию (name).
        Если `apply_to_machine=true` и у runtime есть daemon_id, имя
        применяется сразу ко всем runtime, зарегистрированным тем же
        daemon-процессом (той же физической машиной), в рамках воркспейса;
        для не-owner/admin пользователя это ограничивается только теми
        экземплярами daemon, которыми он сам владеет.
      tags: [Runtimes]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - { name: runtimeId, in: path, required: true, schema: { type: string, format: uuid } }
      x-roles: [owner, admin, "member (только владелец runtime)"]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                visibility: { type: string, enum: [private, public] }
                custom_name: { type: string, maxLength: 100 }
                apply_to_machine: { type: boolean, default: false }
      x-events:
        - event: "daemon:register"
          payload: "{ action: \"update\" } — сигнал всем клиентам workspace перечитать список runtime"
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Runtime' } } }
        '400':
          description: "visibility не private/public, либо custom_name длиннее 100 символов, либо тело не JSON"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: "вызывающий не владелец runtime и не owner/admin"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: "runtime не найден"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    delete:
      operationId: deleteRuntime
      summary: Удалить runtime
      description: >
        Удаление напрямую запрещено (409, код `runtime_profile_instance_delete_unsupported`),
        если runtime порождён живым runtime-профилем — профиль удаляется
        отдельно. Также запрещено (409, код `runtime_has_active_agents`),
        если на runtime есть неархивные агенты — тело ответа перечисляет их
        (см. `runtime_has_active_agents`), а также если есть активные отряды
        (squads), у которых лидер — архивный агент этого runtime (обычная
        текстовая ошибка без кода). При отсутствии препятствий удаление
        каскадно останавливает автопилоты, чьи агенты-исполнители архивны
        на этом runtime, удаляет привязанные к архивным агентам squads,
        invocation targets, интеграции каналов, закреплённые в чате агенты,
        назначения меток, черновики чата, MCP-подключения, сами архивные
        и системные агенты runtime, и затем сам runtime.
      tags: [Runtimes]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - { name: runtimeId, in: path, required: true, schema: { type: string, format: uuid } }
      x-roles: [owner, admin, "member (только владелец runtime)"]
      x-events:
        - event: "daemon:register"
          payload: "{ action: \"delete\" }"
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, properties: { status: { type: string, enum: [ok] } } } } }
        '403':
          description: "вызывающий не владелец runtime и не owner/admin"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: "runtime не найден"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: "runtime порождён профилем, либо есть активные агенты/отряды"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  code: { type: string, enum: [runtime_profile_instance_delete_unsupported, runtime_has_active_agents] }
                  active_agents:
                    type: array
                    description: "заполняется только при code=runtime_has_active_agents; элементы схемы Agent (см. часть C)"
                    items: { type: object }

  /api/runtimes/{runtimeId}/mcp-verified:
    post:
      operationId: reportRuntimeMcpVerified
      summary: Зафиксировать результат проверки MCP-прокси runtime
      description: >
        Принимает от клиента (обычно от самого daemon-приложения, через
        обычную сессию пользователя, а не через daemonAuth) результат
        самопроверки доступности MCP-серверов на runtime и держит его
        в памяти процесса сервера (не персистится в БД, не переживает
        рестарт). `status` — либо `ok`, либо `proxy_unreachable`, либо
        `mcp_failed(<причина>)`.
      tags: [Runtimes]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - { name: runtimeId, in: path, required: true, schema: { type: string, format: uuid } }
      x-roles: [owner, admin, member]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [server, status]
              properties:
                server: { type: string }
                status: { type: string, description: "ok | proxy_unreachable | mcp_failed(<reason>)" }
      responses:
        '204':
          description: Принято
        '400':
          description: "server/status пустые, либо status не соответствует допустимому формату"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: "runtime не найден"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/runtimes/{runtimeId}/usage:
    get:
      operationId: getRuntimeUsage
      summary: Дневная статистика токенов/стоимости конкретного runtime
      tags: [Runtimes]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - { name: runtimeId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/DashboardDays'
        - $ref: '#/components/parameters/DashboardTz'
      x-roles: [owner, admin, member]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RuntimeUsage' } } } }
        '404':
          description: "runtime не найден"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/runtimes/{runtimeId}/usage/by-agent:
    get:
      operationId: getRuntimeUsageByAgent
      summary: Статистика токенов/стоимости runtime по агенту
      tags: [Runtimes]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - { name: runtimeId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/DashboardDays'
      x-roles: [owner, admin, member]
      responses:
