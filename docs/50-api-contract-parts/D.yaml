  /api/runtimes/{runtimeId}/activity:
    get:
      operationId: getRuntimeTaskActivity
      summary: Почасовая активность задач runtime (тепловая карта)
      tags: [Runtimes]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - { name: runtimeId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/DashboardTz'
      x-roles: [owner, admin, member]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    hour: { type: integer, minimum: 0, maximum: 23 }
                    count: { type: integer }
        '404':
          description: "runtime не найден"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/runtimes/{runtimeId}/update:
    post:
      operationId: initiateRuntimeUpdate
      summary: Запросить самообновление daemon-приложения на runtime
      description: >
        Ставит асинхронный запрос на обновление в очередь daemon-а (polling
        через отдельный daemon-канал вне этой части спецификации). Отключено
        (403) на деплоях с периметровым (perimeter) профилем поставки —
        там обновления доставляются оператором. Только владелец runtime
        или owner/admin воркспейса может инициировать обновление. Одновременно
        на один runtime может быть только один необработанный запрос — иначе
        409. Запрос считается протухшим и переходит в timeout, если daemon
        не откликнулся за 120 секунд (pending) либо не завершил обновление
        за 150 секунд после начала выполнения (running); истёкшие записи
        хранятся в памяти сервера ещё 5 минут для чтения через getRuntimeUpdate.
      tags: [Runtimes]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - { name: runtimeId, in: path, required: true, schema: { type: string, format: uuid } }
      x-roles: [owner, admin, "member (только владелец runtime)"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_version]
              properties: { target_version: { type: string } }
      responses:
        '200':
          description: Запрос поставлен в очередь
          content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeUpdateRequest' } } }
        '400':
          description: "target_version отсутствует"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: "недостаточно прав, либо self-update отключён (perimeter delivery profile)"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: "runtime не найден"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: "для этого runtime уже есть необработанный запрос на обновление"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/runtimes/{runtimeId}/update/{updateId}:
    get:
      operationId: getRuntimeUpdate
      summary: Статус запроса на самообновление
      description: >
        Просматривать статус может владелец runtime, owner/admin воркспейса,
        либо сам инициатор запроса.
      tags: [Runtimes]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - { name: runtimeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: updateId, in: path, required: true, schema: { type: string } }
      x-roles: [owner, admin, "member (владелец runtime либо инициатор запроса)"]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeUpdateRequest' } } }
        '403':
          description: "вызывающий не владелец/admin и не инициатор запроса"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: "runtime или запрос не найден"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/runtimes/{runtimeId}/models:
    post:
      operationId: initiateRuntimeModelList
      summary: Запросить у runtime актуальный список поддерживаемых моделей
      description: >
        Асинхронный запрос: сервер создаёт заявку со статусом pending,
        daemon runtime (через отдельный не входящий в эту часть канал)
        забирает её и публикует результат. Требует runtime в статусе online.
        Заявка считается протухшей через 30 секунд без ответа (pending)
        или через 60 секунд выполнения без завершения (running).
      tags: [Runtimes]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - { name: runtimeId, in: path, required: true, schema: { type: string, format: uuid } }
      x-roles: [owner, admin, member]
      responses:
        '200':
          description: Запрос поставлен в очередь
          content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeModelListRequest' } } }
        '404':
          description: "runtime не найден"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503':
          description: "runtime не online"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/runtimes/{runtimeId}/models/{requestId}:
    get:
      operationId: getRuntimeModelListRequest
      summary: Статус запроса списка моделей
      tags: [Runtimes]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - { name: runtimeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: requestId, in: path, required: true, schema: { type: string } }
      x-roles: [owner, admin, member]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeModelListRequest' } } }
        '404':
          description: "заявка не найдена (в т.ч. если requestId принадлежит другому runtime)"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/runtimes/{runtimeId}/local-skills:
    post:
      operationId: initiateRuntimeLocalSkillList
      summary: Запросить у runtime список локально установленных навыков и MCP-серверов
      description: >
        Аналогичный асинхронный паттерн: заявка pending → daemon её забирает
        и отчитывается результатом (список навыков с ключом, путём к
        исходнику, провайдером; список MCP-серверов с транспортом и флагом
        enabled). Доступно любому участнику воркспейса с доступом на чтение
        к runtime; требует runtime online. Протухает через 3 минуты без
        ответа или 60 секунд выполнения.
      tags: [Runtimes]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - { name: runtimeId, in: path, required: true, schema: { type: string, format: uuid } }
      x-roles: [owner, admin, member]
      responses:
        '200':
          description: Запрос поставлен в очередь
          content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeLocalSkillListRequest' } } }
        '404':
          description: "runtime не найден"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503':
          description: "runtime не online"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/runtimes/{runtimeId}/local-skills/{requestId}:
    get:
      operationId: getRuntimeLocalSkillListRequest
      summary: Статус запроса списка локальных навыков
      tags: [Runtimes]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - { name: runtimeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: requestId, in: path, required: true, schema: { type: string } }
      x-roles: [owner, admin, member]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeLocalSkillListRequest' } } }
        '404':
          description: "заявка не найдена"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/runtimes/{runtimeId}/local-skills/import:
    post:
      operationId: initiateRuntimeLocalSkillImport
      summary: Запросить импорт одного локально найденного навыка в воркспейс
      description: >
        В отличие от простого просмотра списка, инициировать импорт может
        только владелец runtime (не любой участник воркспейса), поскольку
        импорт читает содержимое файлов с машины владельца. `action=""`
        (create, значение по умолчанию) создаёт новый Skill; `action=overwrite`
        требует `target_skill_id` — существующий навык, которым владеет тот
        же пользователь, и подставляет `supports_conflict=true`
        автоматически.
      tags: [Runtimes]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - { name: runtimeId, in: path, required: true, schema: { type: string, format: uuid } }
      x-roles: ["member (только владелец runtime)", owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skill_key]
              properties:
                skill_key: { type: string, description: "ключ локального навыка из ответа initiateRuntimeLocalSkillList" }
                name: { type: string }
                description: { type: string }
                action: { type: string, enum: ["", overwrite], default: "" }
                target_skill_id: { type: string, format: uuid, description: "обязателен при action=overwrite" }
                supports_conflict: { type: boolean, default: false }
      responses:
        '200':
          description: Запрос поставлен в очередь
          content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeLocalSkillImportRequest' } } }
        '400':
          description: "skill_key пуст, action некорректен, либо target_skill_id не UUID при action=overwrite"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: "вызывающий не владелец runtime"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: "runtime не найден"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503':
          description: "runtime не online"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/runtimes/{runtimeId}/local-skills/import/{requestId}:
    get:
      operationId: getRuntimeLocalSkillImportRequest
      summary: Статус запроса импорта локального навыка
      description: >
        При завершении со статусом `conflict` тело содержит объект `conflict`
        с данными существующего навыка того же имени и флагом,
        может ли вызывающий его перезаписать.
      tags: [Runtimes]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - { name: runtimeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: requestId, in: path, required: true, schema: { type: string } }
      x-roles: ["member (только владелец runtime)", owner, admin]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeLocalSkillImportRequest' } } }
        '403':
          description: "вызывающий не владелец runtime"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: "заявка не найдена"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/runtimes/{runtimeId}/archive-agents-and-delete:
    post:
      operationId: archiveAgentsAndDeleteRuntime
      summary: Массово архивировать активных агентов runtime и удалить его одной операцией
      description: >
        Двухфазное подтверждение: клиент сначала получает 409 от
        deleteRuntime со списком активных агентов, показывает его
        пользователю и повторяет вызов сюда, передав список ожидаемых id
        активных агентов (`expected_active_agent_ids`). Если фактический
        набор активных агентов runtime изменился с момента показа списка
        (гонка), запрос отклоняется 409 с кодом `runtime_delete_plan_changed`
        и обновлённым списком — повторное подтверждение обязательно.
        При успехе: архивирует все совпавшие активные агенты, отменяет их
        задачи и задачи на runtime, останавливает автопилоты с архивными
        исполнителями, зачищает связанные ресурсы (как в deleteRuntime),
        и удаляет runtime в одной транзакции.
      tags: [Runtimes]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - { name: runtimeId, in: path, required: true, schema: { type: string, format: uuid } }
      x-roles: [owner, admin, "member (только владелец runtime)"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_active_agent_ids]
              properties:
                expected_active_agent_ids: { type: array, items: { type: string, format: uuid } }
      x-events:
        - event: "agent:archived"
          payload: "{ agent: Agent } — по одному событию на каждого архивированный агент"
        - event: "daemon:register"
          payload: "{ action: \"delete\" }"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  agents_archived: { type: integer }
                  tasks_cancelled: { type: integer }
        '400':
          description: "expected_active_agent_ids отсутствует или содержит не-UUID"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: "недостаточно прав"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: "runtime не найден"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: "runtime порождён профилем, либо фактический набор активных агентов не совпал с ожидаемым (code=runtime_delete_plan_changed)"
          content: { application/json: { schema: { type: object } } }

  # ---------------------------------------------------------------------
  # Cloud Runtime (прокси в облачный fleet-сервис)
  # ---------------------------------------------------------------------
  /api/cloud-runtime:
    get:
      operationId: getCloudRuntimeService
      summary: Информация об облачном runtime-сервисе (fleet)
      description: >
        Все `/api/cloud-runtime/**` — прозрачный HTTP-прокси в отдельный
        облачный fleet-сервис управления виртуальными runtime-нодами.
        Сервер goosar добавляет только X-User-ID и (где нужно) прокидывает
        query/body без изменений; если сервис не настроен на деплое —
        503. Формат ответа определяется fleet-сервисом; здесь он описан
        по фактическому использованию из клиента.
      tags: [CloudRuntime]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/WorkspaceSlugHeader' } ]
      x-roles: [owner, admin, member]
      responses:
        '200':
          description: "ответ fleet-сервиса, проксируется как есть"
          content: { application/json: { schema: { type: object } } }
        '502':
          description: "fleet-сервис вернул ошибку/недоступен"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503':
          description: "cloud runtime не сконфигурирован на этом деплое"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '504':
          description: "тайм-аут запроса к fleet-сервису"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/cloud-runtime/healthz:
    get:
      operationId: getCloudRuntimeHealth
      summary: Проверка живости fleet-сервиса (проксируется без авторизации пользователя)
      tags: [CloudRuntime]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/WorkspaceSlugHeader' } ]
      x-roles: [owner, admin, member]
      responses:
        '200': { description: "ответ проксируется как есть" }
        '503': { description: "cloud runtime не сконфигурирован" }

  /api/cloud-runtime/readyz:
    get:
      operationId: getCloudRuntimeReady
      summary: Проверка готовности fleet-сервиса
      tags: [CloudRuntime]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/WorkspaceSlugHeader' } ]
      x-roles: [owner, admin, member]
      responses:
        '200': { description: "ответ проксируется как есть" }
        '503': { description: "cloud runtime не сконфигурирован" }

  /api/cloud-runtime/nodes:
    get:
      operationId: listCloudRuntimeNodes
      summary: Список облачных runtime-нод пользователя
      tags: [CloudRuntime]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - name: limit
          in: query
          schema: { type: integer }
        - name: offset
          in: query
          schema: { type: integer }
      x-roles: [owner, admin, member]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CloudRuntimeNode' } } } }
        '503':
          description: "cloud runtime не сконфигурирован"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    post:
      operationId: createCloudRuntimeNode
      summary: Заказать новую облачную runtime-ноду
      tags: [CloudRuntime]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/WorkspaceSlugHeader' } ]
      x-roles: [owner, admin, member]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCloudRuntimeNodeRequest' }
      responses:
        '200':
          description: Нода создана (или поставлена в очередь на запуск)
          content: { application/json: { schema: { $ref: '#/components/schemas/CloudRuntimeNode' } } }
        '400':
          description: "тело запроса пустое или не JSON"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '502':
          description: "fleet-сервис отклонил запрос"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503':
          description: "cloud runtime не сконфигурирован"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    delete:
      operationId: deleteCloudRuntimeNode
      summary: Удалить/остановить навсегда облачную runtime-ноду
      description: "Идентификатор ноды передаётся в теле запроса, а не в пути (ограничение fleet-протокола)."
      tags: [CloudRuntime]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/WorkspaceSlugHeader' } ]
      x-roles: [owner, admin, member]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instance_id]
              properties: { instance_id: { type: string } }
      responses:
        '200': { description: "ответ проксируется как есть" }
        '400':
          description: "тело запроса пустое или не JSON"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503':
          description: "cloud runtime не сконфигурирован"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/cloud-runtime/nodes/start:
    post:
      operationId: startCloudRuntimeNode
      summary: Запустить остановленную облачную runtime-ноду
      tags: [CloudRuntime]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/WorkspaceSlugHeader' } ]
      x-roles: [owner, admin, member]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [instance_id], properties: { instance_id: { type: string } } }
      responses:
        '200': { description: "ответ проксируется как есть" }
        '503': { description: "cloud runtime не сконфигурирован" }

  /api/cloud-runtime/nodes/stop:
    post:
      operationId: stopCloudRuntimeNode
      summary: Остановить облачную runtime-ноду
      tags: [CloudRuntime]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/WorkspaceSlugHeader' } ]
      x-roles: [owner, admin, member]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [instance_id], properties: { instance_id: { type: string } } }
      responses:
        '200': { description: "ответ проксируется как есть" }
        '503': { description: "cloud runtime не сконфигурирован" }

  /api/cloud-runtime/nodes/reboot:
    post:
      operationId: rebootCloudRuntimeNode
      summary: Перезагрузить облачную runtime-ноду
      tags: [CloudRuntime]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/WorkspaceSlugHeader' } ]
      x-roles: [owner, admin, member]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [instance_id], properties: { instance_id: { type: string } } }
      responses:
        '200': { description: "ответ проксируется как есть" }
        '503': { description: "cloud runtime не сконфигурирован" }

  /api/cloud-runtime/nodes/status:
    post:
      operationId: getCloudRuntimeNodeStatus
      summary: Опросить актуальный статус облачной runtime-ноды
      description: "Реализован как POST (не GET), так как принимает тело с instance_id."
      tags: [CloudRuntime]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/WorkspaceSlugHeader' } ]
      x-roles: [owner, admin, member]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [instance_id], properties: { instance_id: { type: string } } }
      responses:
