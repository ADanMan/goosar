openapi: 3.1.0
info:
  title: Goosar API — Part D (Agent Templates, Agent Builder, Skills, Dashboard, Runtimes, Cloud Runtime, Chat, Inbox, Notification Preferences)
  version: 1.0.0
  description: >
    Спецификация покрывает маршруты router.go со строки 1061 до конца файла.
    Общие компоненты (Error, User, Workspace, Member, схемы авторизации,
    заголовок workspace) и схемы Agent/Issue/Squad/Project определены в
    других частях контракта и здесь только referenced.

paths:
  # ---------------------------------------------------------------------
  # Agent Templates
  # ---------------------------------------------------------------------
  /api/agent-templates:
    get:
      operationId: listAgentTemplates
      summary: Список встроенных шаблонов агентов
      description: >
        Возвращает каталог шаблонов агентов, зашитых в поставку сервера
        (не хранятся в БД воркспейса). Каждый шаблон описывает набор
        предустановленных навыков (skills), которые будут импортированы или
        переиспользованы при создании агента из шаблона.
      tags: [AgentTemplates]
      security:
        - cookieAuth: [ ]
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
      x-roles: [owner, admin, member]
      responses:
        '200':
          description: Список шаблонов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentTemplateSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/agent-templates/{slug}:
    get:
      operationId: getAgentTemplate
      summary: Детали шаблона агента по slug
      description: >
        Возвращает полное описание шаблона, включая системную инструкцию
        (instructions), которая не входит в сводный список.
      tags: [AgentTemplates]
      security:
        - cookieAuth: [ ]
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - name: slug
          in: path
          required: true
          schema: { type: string }
      x-roles: [owner, admin, member]
      responses:
        '200':
          description: Шаблон найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTemplate'
        '404':
          description: Шаблон с таким slug не зарегистрирован
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------
  # Agent Builder
  # ---------------------------------------------------------------------
  /api/agent-builder/sessions:
    post:
      operationId: createAgentBuilderSession
      summary: Начать диалоговую сессию конструктора агента
      description: >
        Создаёт служебного системного агента "Agent Builder" (kind=system,
        system_key вида agent_builder:<flowId>) и обычную чат-сессию, привязанную
        к нему. Пользователь далее ведёт диалог через обычные чат-эндпоинты
        (POST /api/chat/sessions/{sessionId}/messages); Agent Builder отвечает
        черновиком конфигурации агента (JSON-блок в тексте ответа), но сам
        никаких агентов не создаёт — это делает клиент отдельным вызовом после
        подтверждения черновика пользователем.
        Runtime, на котором будет исполняться диалог, должен быть в статусе
        online и быть публичным либо принадлежать вызывающему пользователю
        (или тот должен быть owner/admin воркспейса).
      tags: [AgentBuilder]
      security:
        - cookieAuth: [ ]
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
      x-roles: [owner, admin, member]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runtime_id]
              properties:
                runtime_id: { type: string, format: uuid }
                model: { type: string, description: "Необязательный id модели для стартовой конфигурации диалога" }
      responses:
        '201':
          description: Сессия конструктора создана
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: { type: string, format: uuid }
                  builder_agent_id: { type: string, format: uuid }
                  runtime_id: { type: string, format: uuid }
        '400':
          description: "runtime_id отсутствует или не UUID / тело запроса некорректно"
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '403':
          description: "runtime приватный и не принадлежит пользователю"
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '404':
          description: "воркспейс не найден (гонка удаления во время блокировки)"
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '409':
          description: "runtime не в статусе online"
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }

  /api/agent-builder/sessions/{sessionId}/runtime:
    patch:
      operationId: switchAgentBuilderRuntime
      summary: Переключить runtime активной сессии конструктора агента
      description: >
        Меняет runtime у системного агента, обслуживающего конкретную сессию
        Agent Builder. Разрешено только пока сессия active и у неё нет
        незавершённой (pending) задачи — иначе нужно сперва остановить текущий
        ответ. Целевой сессией должен владеть вызывающий пользователь, а её
        агент обязан быть распознан как carrier конструктора
        (kind=system и system_key с префиксом agent_builder:).
      tags: [AgentBuilder]
      security:
        - cookieAuth: [ ]
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      x-roles: [owner, admin, member]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runtime_id]
              properties:
                runtime_id: { type: string, format: uuid }
      responses:
        '200':
          description: Runtime переключён
          content:
            application/json:
              schema:
                type: object
                properties:
                  runtime_id: { type: string, format: uuid }
        '400':
          description: "runtime_id отсутствует, либо сессия архивная (status != active)"
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '404':
          description: "сессия не найдена / не принадлежит пользователю / не является сессией конструктора"
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '409':
          description: "у сессии есть незавершённая задача, либо runtime offline"
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }

  # ---------------------------------------------------------------------
  # Skills
  # ---------------------------------------------------------------------
  /api/skills:
    get:
      operationId: listSkills
      summary: Список навыков (skills) воркспейса
      description: Краткие сведения без содержимого SKILL.md (без поля content).
      tags: [Skills]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/WorkspaceSlugHeader' } ]
      x-roles: [owner, admin, member]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SkillSummary' } }
    post:
      operationId: createSkill
      summary: Создать навык вручную
      description: >
        Создаёт новый Skill вместе с опциональным набором вспомогательных
        файлов. Путь каждого файла проверяется на отсутствие абсолютных
        путей и выхода за пределы каталога навыка (`..`). Имя навыка уникально
        в пределах воркспейса.
      tags: [Skills]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/WorkspaceSlugHeader' } ]
      x-roles: [owner, admin, member]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                content: { type: string, description: "Содержимое SKILL.md" }
                config: { type: object }
                files:
                  type: array
                  items: { $ref: '#/components/schemas/SkillFileInput' }
      x-events:
        - event: "skill:created"
          payload: "{ skill: SkillWithFiles }"
      responses:
        '201':
          description: Навык создан
          content:
            application/json: { schema: { $ref: '#/components/schemas/SkillWithFiles' } }
        '400':
          description: "имя пустое или путь файла некорректен"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: "навык с таким именем уже существует в воркспейсе"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/skills/search:
    get:
      operationId: searchSkills
      summary: Поиск навыков во внешнем каталоге сообщества
      description: >
        Проксирует поисковый запрос во внешний публичный каталог навыков
        (по домену clawhub.ai). Источник может быть отключён администратором
        деплоя (403 source_disabled). Для первых 10 найденных кандидатов
        дополнительно подтягивается счётчик установок.
      tags: [Skills]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - name: q
          in: query
          required: true
          schema: { type: string }
      x-roles: [owner, admin, member]
      responses:
        '200':
          description: Найденные кандидаты
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SkillSearchCandidate' } }
        '400':
          description: "параметр q отсутствует"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: "источник поиска отключён на этом деплое"
          content:
            application/json:
              schema:
                type: object
                properties: { code: { type: string, enum: [source_disabled] }, error: { type: string } }
        '502':
          description: "внешний каталог недоступен"
          content:
            application/json:
              schema:
                type: object
                properties: { code: { type: string, enum: [upstream_unavailable] }, error: { type: string } }

  /api/skills/import:
    post:
      operationId: importSkill
      summary: Импортировать навык из внешнего источника или архива
      description: >
        Два режима запроса:
        1) `application/json` с полем `url` — навык подтягивается по сети
        из одного из разрешённых источников (домены clawhub.ai, skills.sh,
        github.com; администратор деплоя может отключить любой источник
        по отдельности — тогда 403). SKILL.md обязателен и не должен быть
        пустым, иначе импорт отклоняется.
        2) `multipart/form-data` с полем `file` — навык распаковывается
        из ZIP/.skill архива, загруженного пользователем (до 16 МБ), также
        обязателен SKILL.md внутри архива.
        В обоих случаях бинарные файлы (по расширению) и LICENSE-файлы
        пропускаются; импорт ограничен 256 файлами и 8 МБ суммарно,
        отдельный файл — не более 1 МБ.
        Поведение при конфликте имени задаётся `on_conflict`
        (`fail` по умолчанию, `overwrite`, `rename`, `skip`); если это поле
        передано явно (даже пустой строкой не считается), ответ
        оборачивается в структурированный `SkillImportResult` вместо голого
        Skill.
      tags: [Skills]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/WorkspaceSlugHeader' } ]
      x-roles: [owner, admin, member]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, description: "Ссылка на навык (clawhub.ai, skills.sh или github.com)" }
                on_conflict:
                  type: string
                  enum: [fail, overwrite, rename, skip]
                  default: fail
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "ZIP/.skill архив с SKILL.md" }
                on_conflict: { type: string, enum: [fail, overwrite, rename, skip] }
      x-events:
        - event: "skill:created"
          payload: "{ skill: SkillWithFiles } — при status=created"
        - event: "skill:updated"
          payload: "{ skill: SkillWithFiles } — при status=updated (overwrite)"
      responses:
        '201':
          description: "Навык создан (status=created либо тело — голый Skill, если on_conflict не передавался)"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SkillWithFiles'
                  - $ref: '#/components/schemas/SkillImportResult'
        '200':
          description: "Импорт завершился без создания новой записи: updated / skipped / conflict"
          content:
            application/json: { schema: { $ref: '#/components/schemas/SkillImportResult' } }
        '400':
          description: "невалидный url/архив, недопустимый on_conflict, отсутствует SKILL.md"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: "источник импорта отключён администратором деплоя"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: "конфликт имени при on_conflict=fail (или не передан) без структурированного ответа"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  existing_skill: { $ref: '#/components/schemas/ExistingSkillIdentity' }
        '413':
          description: "превышен лимит размера/количества файлов импорта"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '502':
          description: "источник вернул ошибку"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503':
          description: "источник временно недоступен (например, недоступен GitHub API)"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '504':
          description: "тайм-аут получения файлов источника (45 секунд)"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/skills/{id}:
    get:
      operationId: getSkill
      summary: Получить навык вместе с файлами
      tags: [Skills]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      x-roles: [owner, admin, member]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/SkillWithFiles' } } }
        '404':
          description: "навык не найден в воркспейсе"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    put:
      operationId: updateSkill
      summary: Обновить навык
      description: >
        Обновляет только переданные поля (частичное обновление). Если поле
        `files` передано (даже пустым списком), все существующие файлы
        навыка удаляются и заменяются переданными; файл с зарезервированным
        путём (SKILL.md) в списке файлов игнорируется — основное содержимое
        меняется только через поле `content`. Если `files` не передано,
        текущие файлы возвращаются в ответе без изменений.
        Управлять навыком может только его создатель либо owner/admin
        воркспейса.
      tags: [Skills]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      x-roles: [owner, admin, "member (только создатель навыка)"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                content: { type: string }
                config: { type: object }
                files:
                  type: array
                  items: { $ref: '#/components/schemas/SkillFileInput' }
      x-events:
        - event: "skill:updated"
          payload: "{ skill: SkillWithFiles }"
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/SkillWithFiles' } } }
        '400':
          description: "путь файла некорректен"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: "вызывающий не создатель навыка и не owner/admin"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: "навык не найден"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: "конфликт имени с другим навыком"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    delete:
      operationId: deleteSkill
      summary: Удалить навык
      description: >
        Удаляет навык вместе с присвоенными ему метками (label assignments).
        Не отвязывает навык от агентов заранее — это должно обеспечиваться
        каскадом на уровне БД (вне зоны ответственности этой спецификации).
      tags: [Skills]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      x-roles: [owner, admin, "member (только создатель навыка)"]
      x-events:
        - event: "skill:deleted"
          payload: "{ skill_id: string }"
      responses:
        '204':
          description: Удалено
        '403':
          description: "вызывающий не создатель навыка и не owner/admin"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: "навык не найден"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/skills/{id}/labels:
    get:
      operationId: listSkillLabels
      summary: Список меток, привязанных к навыку
      description: >
        Доступно только если в воркспейсе включена фича resource labels,
        иначе 404 (фича считается несуществующим ресурсом).
      tags: [Skills]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      x-roles: [owner, admin, member]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  labels: { type: array, items: { $ref: '#/components/schemas/SkillLabel' } }
        '404':
          description: "фича labels отключена, либо навык не найден"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    post:
      operationId: attachSkillLabel
      summary: Привязать метку ресурса типа skill к навыку
      description: >
        Метка должна существовать в воркспейсе и иметь resource_type=skill.
        В ответ на успех возвращается тот же список, что и listSkillLabels.
      tags: [Skills]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      x-roles: [owner, admin, "member (только создатель навыка)"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label_id]
              properties: { label_id: { type: string, format: uuid } }
      x-events:
        - event: "label:updated"
          payload: "{ label: SkillLabel }"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { labels: { type: array, items: { $ref: '#/components/schemas/SkillLabel' } } }
        '400':
          description: "label_id отсутствует"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: "недостаточно прав на управление навыком"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: "фича отключена, метка или навык не найдены, либо метка не resource_type=skill"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/skills/{id}/labels/{labelId}:
    delete:
      operationId: detachSkillLabel
      summary: Отвязать метку от навыка
      tags: [Skills]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: labelId, in: path, required: true, schema: { type: string, format: uuid } }
