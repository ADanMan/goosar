  /api/runtimes/{runtimeId}/usage/by-hour:
    get:
      operationId: getRuntimeUsageByHour
      summary: Статистика токенов/стоимости runtime по часу суток
      tags: [Runtimes]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - { name: runtimeId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/DashboardDays'
        - $ref: '#/components/parameters/DashboardTz'
      x-roles: [owner, admin, member]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RuntimeUsageByHour' } } } }
        '404':
