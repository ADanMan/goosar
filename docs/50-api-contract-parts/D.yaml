  /api/chat/sessions/{sessionId}/draft-restores:
    get:
      operationId: listChatDraftRestores
      summary: Список отложенных черновиков сообщений сессии (после отмены задачи)
      description: >
        Черновик восстановления создаётся, когда пользовательское сообщение
        было "потеряно" при отмене задачи (см. `cancelled_chat_message` в
