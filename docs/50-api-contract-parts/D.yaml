        '200': { description: "ответ проксируется как есть" }
        '400':
          description: "тело запроса пустое или не JSON"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503': { description: "cloud runtime не сконфигурирован" }

  # ---------------------------------------------------------------------
  # Задачи и агентская активность воркспейса
  # ---------------------------------------------------------------------
  /api/tasks/{taskId}/cancel:
    post:
      operationId: cancelTaskByUser
      summary: Отменить задачу агента по инициативе пользователя
      description: >
        Если задача привязана к чат-сессии — отменять может только создатель
        сессии; если задача не чатовая — нужен доступ к приватному агенту.
        Если у клиента заявлена поддержка возможности `chat_draft_restore_v1`
        (через заголовок клиентских capability), отменённое пользовательское
        сообщение чата может быть возвращено в ответе как черновик для
        восстановления в поле ввода.
      tags: [Tasks]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
      x-roles: [owner, admin, member]
      x-events:
        - event: "task:cancelled"
          payload: "{ task_id, agent_id, issue_id?, status, chat_session_id? }"
        - event: "chat:cancel_finalized"
          payload: "ChatCancelFinalizedPayload { outcome: stopped|restored, chat_session_id, task_id, message_id?, content?, message_kind?, elapsed_ms? } — только для чатовых задач"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelled_chat_message:
                    type: object
                    nullable: true
                    properties:
                      chat_session_id: { type: string, format: uuid }
                      message_id: { type: string, format: uuid }
                      content: { type: string }
                      restore_to_input: { type: boolean }
                      attachments: { type: array, items: { $ref: '#/components/schemas/ChatAttachment' } }
        '400':
          description: "задачу нельзя отменить в её текущем статусе"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: "недостаточно прав на задачу"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: "задача не найдена в воркспейсе"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/agent-task-snapshot:
    get:
      operationId: listWorkspaceAgentTaskSnapshot
      summary: Снимок текущих задач агентов воркспейса
      tags: [WorkspaceActivity]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/WorkspaceSlugHeader' } ]
      x-roles: [owner, admin, member]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { type: object } } } }

  /api/working-agents:
    get:
      operationId: listWorkspaceWorkingAgents
      summary: Список агентов воркспейса, у которых прямо сейчас есть выполняемая задача
      tags: [WorkspaceActivity]
