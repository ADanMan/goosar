            application/json:
              schema: { type: object, properties: { has_pending: { type: boolean } } }

  /api/chat/pinned-agents:
    get:
      operationId: listChatPinnedAgents
      summary: Список закреплённых в чате агентов пользователя
      tags: [Chat]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/WorkspaceSlugHeader' } ]
      x-roles: [owner, admin, member]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ChatPinnedAgent' } } } }
    post:
      operationId: pinChatAgent
      summary: Закрепить агента в списке быстрого доступа чата
      description: >
        Лимит — 5 закреплённых агентов на пользователя в воркспейсе (400
        при превышении). Агент должен быть в списке доступных вызывающему.
        Позиция нового закрепления — максимум существующих плюс один.
      tags: [Chat]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/WorkspaceSlugHeader' } ]
      x-roles: [owner, admin, member]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [agent_id], properties: { agent_id: { type: string, format: uuid } } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/ChatPinnedAgent' } } }
        '400':
          description: "agent_id некорректен, либо достигнут лимит в 5 закреплений"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: "агент недоступен вызывающему"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/chat/pinned-agents/{agentId}:
    delete:
      operationId: unpinChatAgent
      summary: Открепить агента
      tags: [Chat]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - { name: agentId, in: path, required: true, schema: { type: string, format: uuid } }
      x-roles: [owner, admin, member]
      responses:
        '204':
          description: "OK (идемпотентно — успех и если агент не был закреплён)"

  /api/chat/history:
    get:
      operationId: getChatChannelHistory
      summary: История внешнего чат-канала (например, Slack) для сессии, вызываемая из задачи агента
      description: >
        Специальный маршрут, вызываемый не человеком из браузера, а самим
        агентом во время выполнения задачи через инструмент чтения истории
        канала: требует заголовок `X-Actor-Source: task_token` и
        `X-Task-ID` с id текущей задачи; задача обязана быть чатовой.
        Если у сессии нет привязанного внешнего канала (например, обычный
        внутренний чат, не Slack-тред) — возвращает пустой список с полем
        `note`, а не ошибку.
      tags: [Chat]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - { name: X-Actor-Source, in: header, required: true, schema: { type: string, enum: [task_token] } }
        - { name: X-Task-ID, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: before, in: query, schema: { type: string } }
      x-roles: ["agent (только вызов из контекста задачи, не человек)"]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/ChatChannelHistoryResponse' } } }
        '400':
          description: "отсутствует/некорректен X-Task-ID, либо задача не чатовая"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: "запрос не помечен как X-Actor-Source: task_token"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: "задача или чат-сессия не найдены"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '502':
          description: "внешний канал вернул ошибку"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/chat/thread:
    get:
      operationId: getChatThread
      summary: Конкретный тред внешнего чат-канала, вызываемый из задачи агента
      description: "Тот же контракт доступа, что и getChatChannelHistory; `id` — идентификатор треда во внешнем канале."
      tags: [Chat]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - { name: X-Actor-Source, in: header, required: true, schema: { type: string, enum: [task_token] } }
        - { name: X-Task-ID, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: before, in: query, schema: { type: string } }
      x-roles: ["agent (только вызов из контекста задачи, не человек)"]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/ChatChannelHistoryResponse' } } }
        '400':
          description: "отсутствует/некорректен X-Task-ID, либо задача не чатовая"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: "запрос не помечен как X-Actor-Source: task_token"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: "задача или чат-сессия не найдены"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  # ---------------------------------------------------------------------
  # Inbox
  # ---------------------------------------------------------------------
  /api/inbox:
    get:
      operationId: listInbox
      summary: Активные (неархивные) элементы инбокса пользователя
      tags: [Inbox]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/WorkspaceSlugHeader' } ]
      x-roles: [owner, admin, member]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/InboxItem' } } } }

  /api/inbox/archived:
    get:
      operationId: listArchivedInbox
      summary: Архивные элементы инбокса пользователя
      tags: [Inbox]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/WorkspaceSlugHeader' } ]
      x-roles: [owner, admin, member]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/InboxItem' } } } }

  /api/inbox/unread-count:
    get:
      operationId: countUnreadInbox
      summary: Число непрочитанных элементов инбокса в текущем воркспейсе
      tags: [Inbox]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/WorkspaceSlugHeader' } ]
      x-roles: [owner, admin, member]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, properties: { count: { type: integer } } } } }

  /api/inbox/unread-summary:
    get:
      operationId: getUnreadInboxSummary
      summary: Число непрочитанных элементов инбокса по всем воркспейсам пользователя
      description: "Единственный инбокс-эндпоинт, не ограниченный текущим воркспейсом — агрегирует по всем воркспейсам, где состоит пользователь."
      tags: [Inbox]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      x-roles: [owner, admin, member]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    workspace_id: { type: string, format: uuid }
                    count: { type: integer }

  /api/inbox/mark-all-read:
    post:
      operationId: markAllInboxRead
      summary: Отметить все элементы инбокса воркспейса прочитанными
      tags: [Inbox]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/WorkspaceSlugHeader' } ]
      x-roles: [owner, admin, member]
      x-events:
        - event: "inbox:batch-read"
          payload: "{ recipient_id, count }"
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, properties: { count: { type: integer } } } } }

  /api/inbox/archive-all:
    post:
      operationId: archiveAllInbox
      summary: Архивировать все элементы инбокса воркспейса
      tags: [Inbox]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/WorkspaceSlugHeader' } ]
      x-roles: [owner, admin, member]
      x-events:
        - event: "inbox:batch-archived"
          payload: "{ recipient_id, count }"
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, properties: { count: { type: integer } } } } }

  /api/inbox/archive-all-read:
    post:
      operationId: archiveAllReadInbox
      summary: Архивировать все прочитанные элементы инбокса воркспейса
      tags: [Inbox]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/WorkspaceSlugHeader' } ]
      x-roles: [owner, admin, member]
      x-events:
        - event: "inbox:batch-archived"
          payload: "{ recipient_id, count }"
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, properties: { count: { type: integer } } } } }

  /api/inbox/archive-completed:
    post:
      operationId: archiveCompletedInbox
      summary: Архивировать элементы инбокса, чьи связанные задачи/тикеты завершены
      tags: [Inbox]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/WorkspaceSlugHeader' } ]
      x-roles: [owner, admin, member]
      x-events:
        - event: "inbox:batch-archived"
          payload: "{ recipient_id, count }"
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, properties: { count: { type: integer } } } } }

  /api/inbox/{id}/read:
    post:
      operationId: markInboxItemRead
      summary: Отметить один элемент инбокса прочитанным
      description: "Элемент должен принадлежать вызывающему пользователю как получателю (recipient_type=member, recipient_id=текущий пользователь)."
      tags: [Inbox]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      x-roles: [owner, admin, member]
      x-events:
        - event: "inbox:read"
          payload: "{ item_id, recipient_id }"
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/InboxItem' } } }
        '404':
          description: "элемент не найден или не принадлежит пользователю"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/inbox/{id}/archive:
    post:
      operationId: archiveInboxItem
      summary: Архивировать один элемент инбокса
      description: >
        Если элемент связан с тикетом (issue_id заполнен), заодно
        архивируются все прочие элементы инбокса того же получателя,
        привязанные к тому же тикету (сворачивает "цепочку" уведомлений
        по одному тикету).
      tags: [Inbox]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      x-roles: [owner, admin, member]
      x-events:
        - event: "inbox:archived"
          payload: "{ item_id, issue_id?, recipient_id }"
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/InboxItem' } } }
        '404':
          description: "элемент не найден или не принадлежит пользователю"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/inbox/{id}/unarchive:
    post:
      operationId: unarchiveInboxItem
      summary: Вернуть один элемент инбокса из архива
      description: "Симметрично archiveInboxItem: также возвращает из архива связанные по тому же тикету элементы того же получателя."
      tags: [Inbox]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      x-roles: [owner, admin, member]
      x-events:
        - event: "inbox:unarchived"
          payload: "{ item_id, issue_id?, recipient_id }"
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/InboxItem' } } }
        '404':
          description: "элемент не найден или не принадлежит пользователю"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  # ---------------------------------------------------------------------
  # Notification preferences
  # ---------------------------------------------------------------------
  /api/notification-preferences:
    get:
      operationId: getNotificationPreferences
      summary: Настройки уведомлений пользователя в воркспейсе
      description: "Если запись ещё не создавалась, возвращает пустой объект preferences (не 404)."
      tags: [NotificationPreferences]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/WorkspaceSlugHeader' } ]
      x-roles: [owner, admin, member]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferences' } } }
    patch:
      operationId: patchNotificationPreferences
      summary: Частично обновить настройки уведомлений (слить с существующими)
      tags: [NotificationPreferences]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/WorkspaceSlugHeader' } ]
      x-roles: [owner, admin, member]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferencesInput' }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferences' } } }
        '400':
          description: "preferences отсутствует, либо содержит неизвестную группу или недопустимое значение"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    put:
      operationId: updateNotificationPreferences
      summary: Полностью заменить настройки уведомлений
      description: "В отличие от PATCH, заменяет весь объект preferences целиком (группы, не перечисленные в запросе, теряют сохранённое значение)."
      tags: [NotificationPreferences]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/WorkspaceSlugHeader' } ]
      x-roles: [owner, admin, member]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferencesInput' }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferences' } } }
        '400':
          description: "preferences отсутствует, либо содержит неизвестную группу или недопустимое значение"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

components:
  parameters:
    DashboardDays:
      name: days
      in: query
      description: "Ширина окна в днях (1..365). По умолчанию 30 (90 для usage runtime)."
      schema: { type: integer, minimum: 1, maximum: 365 }
    DashboardTz:
      name: tz
      in: query
      description: "IANA-таймзона для группировки по дням/часам. При отсутствии — таймзона профиля пользователя, иначе UTC."
      schema: { type: string }
    DashboardProjectId:
      name: project_id
      in: query
      description: "Фильтр по проекту (см. схему Project в части C)."
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: "Не аутентифицирован"
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: "Нет доступа"
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    # Error, User, Workspace, Member — определены в общей части контракта
    # (докс части "общие компоненты"), здесь только referenced по имени.

    # --- Agent Templates ---
    AgentTemplateSkillRef:
      type: object
      properties:
        source_url: { type: string }
        cached_name: { type: string }
        cached_description: { type: string }
    AgentTemplateSummary:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        icon: { type: string }
        accent: { type: string }
        skills: { type: array, items: { $ref: '#/components/schemas/AgentTemplateSkillRef' } }
    AgentTemplate:
      allOf:
        - $ref: '#/components/schemas/AgentTemplateSummary'
        - type: object
          properties:
            instructions: { type: string, description: "Системная инструкция, которую получит созданный из шаблона агент" }

    # --- Skills ---
    SkillFileInput:
      type: object
      required: [path, content]
      properties:
        path: { type: string, description: "Относительный путь без .. и без абсолютных путей" }
        content: { type: string }
    SkillFile:
      type: object
      properties:
        id: { type: string, format: uuid }
        skill_id: { type: string, format: uuid }
        path: { type: string }
        content: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SkillSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        config: { type: object }
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        enabled: { type: boolean, description: "заполняется только в контексте конкретного агента (не в listSkills)" }
    Skill:
      allOf:
        - $ref: '#/components/schemas/SkillSummary'
        - type: object
          properties:
            content: { type: string, description: "Содержимое SKILL.md" }
    SkillWithFiles:
      allOf:
        - $ref: '#/components/schemas/Skill'
        - type: object
          properties:
            files: { type: array, items: { $ref: '#/components/schemas/SkillFile' } }
    SkillSearchCandidate:
      type: object
      properties:
        name: { type: string }
        url: { type: string }
        source: { type: string, enum: [clawhub.ai] }
        repo: { type: string, nullable: true }
        install_count: { type: integer, nullable: true }
        github_stars: { type: integer, nullable: true }
        description: { type: string }
    ExistingSkillIdentity:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        created_by: { type: string, format: uuid }
        can_overwrite: { type: boolean, description: "true, если вызывающий — создатель существующего навыка" }
    SkillImportResult:
      type: object
      properties:
        status: { type: string, enum: [created, updated, skipped, conflict, failed] }
        reason: { type: string }
        skill: { $ref: '#/components/schemas/SkillWithFiles' }
        existing_skill: { $ref: '#/components/schemas/ExistingSkillIdentity' }
    SkillLabel:
      type: object
      description: "Метка (label) с resource_type=skill; каталог меток воркспейса ведётся вне этой части спецификации."
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        resource_type: { type: string, enum: [skill] }
        name: { type: string }
        description: { type: string }
        color: { type: string }
        usage_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # --- Dashboard (общие поля usage-статистики повторяются для runtime и workspace) ---
    UsageTokenFields:
      type: object
      properties:
        provider: { type: string }
        model: { type: string }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        cache_read_tokens: { type: integer }
        cache_write_tokens: { type: integer }
        cost_usd_ticks: { type: integer, description: "Стоимость в целых тиках USD (1 тик = 1e-6 USD)" }
        uncosted_input_tokens: { type: integer }
        uncosted_output_tokens: { type: integer }
        uncosted_cache_read_tokens: { type: integer }
        uncosted_cache_write_tokens: { type: integer }
    DashboardUsageDaily:
      allOf:
        - $ref: '#/components/schemas/UsageTokenFields'
        - type: object
          properties:
            date: { type: string, format: date }
            task_count: { type: integer }
    DashboardUsageByAgent:
      allOf:
        - $ref: '#/components/schemas/UsageTokenFields'
        - type: object
          properties:
            agent_id: { type: string, format: uuid }
            task_count: { type: integer }
    DashboardAgentRunTime:
      type: object
      properties:
        agent_id: { type: string, format: uuid }
        total_seconds: { type: integer }
        task_count: { type: integer }
        failed_count: { type: integer }
    DashboardRunTimeDaily:
      type: object
      properties:
        date: { type: string, format: date }
        total_seconds: { type: integer }
        task_count: { type: integer }
        failed_count: { type: integer }
    DashboardFailureDaily:
      type: object
      properties:
        date: { type: string, format: date }
        failure_reason: { type: string }
        task_count: { type: integer }
    DashboardFailureByAgent:
      type: object
      properties:
        agent_id: { type: string, format: uuid }
        failure_reason: { type: string }
        task_count: { type: integer }

    # --- Runtimes ---
    Runtime:
      type: object
      description: >
        Daemon-среда (десктопное приложение или облачный воркер),
        подключённая к воркспейсу и способная исполнять задачи агентов.
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        daemon_id: { type: string, nullable: true, description: "Идентификатор физического daemon-процесса; несколько Runtime могут делить один daemon_id (одна машина, несколько провайдеров)" }
        name: { type: string, description: "Имя по умолчанию, присвоенное daemon-ом" }
        custom_name: { type: string, nullable: true, description: "Имя, заданное пользователем через updateRuntime" }
        runtime_mode: { type: string, description: "Например local/cloud — режим исполнения задач" }
        provider: { type: string, description: "Провайдер агентского движка на этом runtime" }
        launch_header: { type: string, description: "Служебный заголовок для запуска, выводится из provider" }
        status: { type: string, enum: [online, offline], description: "online — daemon недавно присылал heartbeat; offline — таймаут heartbeat истёк" }
        device_info: { type: string }
        metadata: { type: object }
        owner_id: { type: string, format: uuid, nullable: true }
        visibility: { type: string, enum: [private, public] }
        profile_id: { type: string, format: uuid, nullable: true, description: "Если задан — runtime порождён живым runtime-профилем (управляется отдельным набором маршрутов /api/workspaces/{id}/runtime-profiles, вне этой части)" }
        last_seen_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RuntimeUsage:
      allOf:
        - $ref: '#/components/schemas/UsageTokenFields'
        - type: object
          properties:
            runtime_id: { type: string, format: uuid }
            date: { type: string, format: date }
    RuntimeUsageByAgent:
      allOf:
        - $ref: '#/components/schemas/UsageTokenFields'
        - type: object
          properties:
            agent_id: { type: string, format: uuid }
            task_count: { type: integer }
    RuntimeUsageByHour:
      allOf:
        - $ref: '#/components/schemas/UsageTokenFields'
        - type: object
          properties:
            hour: { type: integer, minimum: 0, maximum: 23 }
            task_count: { type: integer }
    RuntimeUpdateRequest:
      type: object
      properties:
        id: { type: string }
        runtime_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, running, completed, failed, timeout] }
        target_version: { type: string }
        output: { type: string }
        error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ModelThinkingLevel:
      type: object
      properties:
        value: { type: string }
        label: { type: string }
        description: { type: string }
    ModelThinking:
      type: object
      properties:
        supported_levels: { type: array, items: { $ref: '#/components/schemas/ModelThinkingLevel' } }
        default_level: { type: string }
    ModelServiceTier:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
    RuntimeModelEntry:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        default: { type: boolean }
        thinking: { $ref: '#/components/schemas/ModelThinking' }
        service_tiers: { type: array, items: { $ref: '#/components/schemas/ModelServiceTier' } }
    RuntimeModelListRequest:
      type: object
      properties:
        id: { type: string }
        runtime_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, running, completed, failed, timeout] }
        models: { type: array, items: { $ref: '#/components/schemas/RuntimeModelEntry' } }
        supported: { type: boolean, description: "false — runtime сообщил, что не поддерживает перечисление моделей" }
        error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RuntimeLocalSkillEntry:
      type: object
      properties:
        key: { type: string, description: "Стабильный ключ, используемый затем в initiateRuntimeLocalSkillImport" }
        name: { type: string }
        description: { type: string }
        source_path: { type: string }
        provider: { type: string }
        root: { type: string }
        plugin: { type: string }
        can_disable: { type: boolean }
        file_count: { type: integer }
    RuntimeLocalMcpServerSummary:
      type: object
      properties:
        name: { type: string }
        transport: { type: string }
        source: { type: string }
        enabled: { type: boolean }
    RuntimeLocalSkillListRequest:
      type: object
      properties:
        id: { type: string }
        runtime_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, running, completed, failed, timeout] }
        skills: { type: array, items: { $ref: '#/components/schemas/RuntimeLocalSkillEntry' } }
        supported: { type: boolean }
        mcp_servers: { type: array, items: { $ref: '#/components/schemas/RuntimeLocalMcpServerSummary' } }
        mcp_supported: { type: boolean }
        error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    LocalSkillImportConflict:
      type: object
      properties:
        existing_skill_id: { type: string, format: uuid }
        existing_created_by: { type: string, format: uuid }
        can_overwrite: { type: boolean }
    RuntimeLocalSkillImportRequest:
      type: object
      properties:
        id: { type: string }
        runtime_id: { type: string, format: uuid }
        skill_key: { type: string }
        name: { type: string, nullable: true }
        description: { type: string, nullable: true }
        action: { type: string, enum: ["", overwrite] }
        target_skill_id: { type: string, format: uuid }
        supports_conflict: { type: boolean }
        status: { type: string, enum: [pending, running, completed, failed, timeout, conflict] }
        skill: { $ref: '#/components/schemas/SkillWithFiles' }
        conflict: { $ref: '#/components/schemas/LocalSkillImportConflict' }
        error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # --- Cloud Runtime ---
    CloudRuntimeNode:
      type: object
      properties:
        id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        instance_id: { type: string }
        region: { type: string }
        instance_type: { type: string }
        image_id: { type: string }
        subnet_id: { type: string }
        name: { type: string }
        status: { type: string, description: "Например: launching, pending, running, starting, stopping, stopped, rebooting, terminating, terminated, failed" }
        tags: { type: object, additionalProperties: { type: string } }
        metadata: { type: object }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateCloudRuntimeNodeRequest:
      type: object
      required: [instance_type]
      properties:
        instance_type: { type: string }
        name: { type: string }
        region: { type: string }
        image_id: { type: string }
        subnet_id: { type: string }
        key_name: { type: string }
        iam_instance_profile: { type: string }
        disk_size_gb: { type: integer }
        tags: { type: object, additionalProperties: { type: string } }

    # --- Chat ---
    ChatLastMessage:
      type: object
      properties:
        content: { type: string }
        role: { type: string, enum: [user, assistant, system] }
        created_at: { type: string, format: date-time }
        failure_reason: { type: string, nullable: true }
        message_kind: { type: string, enum: [message, no_response] }
    ChatSession:
      type: object
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid }
        creator_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid, nullable: true }
        title: { type: string }
        status: { type: string, enum: [active, archived] }
        has_unread: { type: boolean, description: "присутствует только в элементах списка сессий, не в getChatSession" }
        unread_count: { type: integer }
        last_message: { $ref: '#/components/schemas/ChatLastMessage' }
        pinned: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ChatAttachment:
      type: object
      description: "Минимальное представление вложения, встраиваемое в чат-ответы. Полный жизненный цикл вложений (/api/attachments/**) описан в другой части контракта."
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        filename: { type: string }
        url: { type: string }
        download_url: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer }
        created_at: { type: string, format: date-time }
    ChatMessage:
      type: object
      properties:
        id: { type: string, format: uuid }
        chat_session_id: { type: string, format: uuid }
        role: { type: string, enum: [user, assistant, system] }
        content: { type: string }
        task_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        failure_reason: { type: string, nullable: true }
        elapsed_ms: { type: integer, nullable: true }
        message_kind: { type: string, enum: [message, no_response], description: "no_response — агент осознанно не дал текстового ответа" }
        attachments: { type: array, items: { $ref: '#/components/schemas/ChatAttachment' } }
    ChatMessagesPage:
      type: object
      properties:
        messages: { type: array, items: { $ref: '#/components/schemas/ChatMessage' } }
        limit: { type: integer }
        has_more: { type: boolean }
        next_cursor:
          type: object
          nullable: true
          properties:
            created_at: { type: string, format: date-time }
            id: { type: string, format: uuid }
    PendingChatTask:
      type: object
      description: "Пустой объект ({}), если незавершённой задачи нет."
      properties:
        task_id: { type: string, format: uuid }
        status: { type: string }
        created_at: { type: string, format: date-time }
    ChatDraftRestore:
      type: object
      properties:
        id: { type: string, format: uuid }
        chat_session_id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        content: { type: string }
        attachments: { type: array, items: { $ref: '#/components/schemas/ChatAttachment' } }
        created_at: { type: string, format: date-time }
    ChatPinnedAgent:
      type: object
      properties:
        agent_id: { type: string, format: uuid }
        position: { type: number }
    ChatHistoryMessage:
      type: object
      description: "Формат зависит от внешнего канала (Slack и т.п.); приводится в нормализованном виде."
      properties:
        id: { type: string }
        author: { type: string }
        text: { type: string }
        created_at: { type: string, format: date-time }
    ChatChannelHistoryResponse:
      type: object
      properties:
        channel_type: { type: string, description: "Например slack; пусто, если канал не настроен" }
        thread_id: { type: string }
        messages: { type: array, items: { $ref: '#/components/schemas/ChatHistoryMessage' } }
        next_cursor: { type: string }
        note: { type: string, description: "Заполняется вместо ошибки, когда у сессии нет канальной интеграции" }

    # --- Inbox ---
    InboxItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        recipient_type: { type: string, enum: [member, agent], description: "Через человеческий /api/inbox виден только recipient_type=member" }
        recipient_id: { type: string, format: uuid }
        type:
          type: string
          description: >
            Тип уведомления. Известные значения (список открыт, новые типы
            могут появляться по мере развития продукта):
            issue_assigned, unassigned, assignee_changed, status_changed,
            priority_changed, start_date_changed, due_date_changed,
            new_comment, mentioned, reaction_added, task_failed,
            quick_create_done, quick_create_failed, quick_create_unconfirmed,
            issue_subscribed, autopilot_paused.
          example: task_failed
        severity:
          type: string
          enum: [info, action_required, attention]
        issue_id: { type: string, format: uuid, nullable: true }
        title: { type: string }
        body: { type: string, nullable: true }
        read: { type: boolean }
        archived: { type: boolean }
        created_at: { type: string, format: date-time }
        issue_status: { type: string, nullable: true, description: "заполняется только в списковых выдачах (ListInbox/ListArchivedInbox), денормализовано из связанного тикета" }
        actor_type: { type: string, nullable: true, enum: [member, agent, system] }
        actor_id: { type: string, format: uuid, nullable: true }
        details: { type: object, description: "Произвольные структурированные детали, зависят от type (например {from, to} для status_changed)" }

    # --- Notification Preferences ---
    NotificationGroupValue:
      type: string
      enum: [all, muted]
    NotificationPreferencesInput:
      type: object
      required: [preferences]
      properties:
        preferences:
          type: object
          description: "Ключи — из enum групп ниже; значения all|muted. Неизвестный ключ или значение — 400."
          additionalProperties: { $ref: '#/components/schemas/NotificationGroupValue' }
          properties:
            assignments: { $ref: '#/components/schemas/NotificationGroupValue' }
            status_changes: { $ref: '#/components/schemas/NotificationGroupValue' }
            comments: { $ref: '#/components/schemas/NotificationGroupValue' }
            updates: { $ref: '#/components/schemas/NotificationGroupValue' }
            agent_activity: { $ref: '#/components/schemas/NotificationGroupValue' }
            system_notifications: { $ref: '#/components/schemas/NotificationGroupValue' }
    NotificationPreferences:
      type: object
      properties:
        workspace_id: { type: string, format: uuid }
        preferences:
          type: object
          additionalProperties: { $ref: '#/components/schemas/NotificationGroupValue' }
