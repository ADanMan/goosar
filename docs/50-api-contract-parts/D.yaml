  # ---------------------------------------------------------------------
  # Chat
  # ---------------------------------------------------------------------
  /api/chat/sessions:
    post:
      operationId: createChatSession
      summary: Создать чат-сессию с агентом
      description: >
        Требует доступа на вызов агента (`invoke`) — публичного или
        принадлежащего пользователю/доступного его роли агента; агент не
        должен быть архивным. Опционально привязывает сессию к проекту
        (project_id).
      tags: [Chat]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/WorkspaceSlugHeader' } ]
      x-roles: [owner, admin, member]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id: { type: string, format: uuid }
                title: { type: string }
                project_id: { type: string, format: uuid, nullable: true }
      responses:
        '201':
          description: Сессия создана
          content: { application/json: { schema: { $ref: '#/components/schemas/ChatSession' } } }
        '400':
          description: "agent_id отсутствует или некорректен"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: "нет доступа к вызову этого агента"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: "агент, воркспейс или проект не найдены"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

    get:
      operationId: listChatSessions
      summary: Список чат-сессий, созданных текущим пользователем
      description: >
        По умолчанию — только сессии с активным статусом; `?status=all`
        включает и архивные. Список отфильтрован по агентам, доступным
        вызывающему (учитывает приватность агентов и роль пользователя).
      tags: [Chat]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - name: status
          in: query
          schema: { type: string, enum: [active, all] }
      x-roles: [owner, admin, member]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ChatSession' } } } }

  /api/chat/sessions/{sessionId}:
    get:
      operationId: getChatSession
      summary: Получить чат-сессию
      description: "Доступна только создателю сессии, при доступе к агенту сессии (не архивированному приватно)."
      tags: [Chat]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      x-roles: [owner, admin, "member (только создатель сессии)"]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/ChatSession' } } }
        '403':
          description: "сессия не принадлежит пользователю, либо нет доступа к агенту"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: "сессия не найдена"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    patch:
      operationId: updateChatSession
      summary: Переименовать сессию либо перепривязать к другому проекту
      description: >
        Ровно одно из полей `title`/`project_id` должно быть передано за
        раз (иначе 400). `project_id: null` отвязывает сессию от проекта.
      tags: [Chat]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      x-roles: [owner, admin, "member (только создатель сессии)"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 200 }
                project_id: { type: string, format: uuid, nullable: true }
      x-events:
        - event: "chat:session_updated"
          payload: "ChatSessionUpdatedPayload { chat_session_id, title, project_id?, updated_at }"
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/ChatSession' } } }
        '400':
          description: "передано не ровно одно поле, либо title пустой/длиннее 200 символов, либо project_id некорректен"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: "сессия или проект не найдены"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    delete:
      operationId: deleteChatSession
      summary: Удалить чат-сессию
      description: >
        Отменяет все незавершённые задачи сессии, снимает привязку к
        каналам (Slack и т.п.) и исходящим карточкам, удаляет черновики
        восстановления, саму сессию и — если агент сессии системный
        (например, Agent Builder) — удаляет и этого служебного агента.
      tags: [Chat]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      x-roles: [owner, admin, "member (только создатель сессии)"]
      x-events:
        - event: "task:cancelled"
          payload: "по каждой отменённой задаче сессии"
        - event: "chat:session_deleted"
          payload: "ChatSessionDeletedPayload { chat_session_id }"
      responses:
        '204':
          description: "Удалено (в т.ч. идемпотентно, если сессия уже удалена параллельно)"
        '403':
          description: "сессия не принадлежит пользователю"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: "сессия не найдена"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/chat/sessions/{sessionId}/pin:
    patch:
      operationId: setChatSessionPinned
      summary: Закрепить/открепить чат-сессию
      tags: [Chat]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      x-roles: [owner, admin, "member (только создатель сессии)"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [pinned], properties: { pinned: { type: boolean } } }
      x-events:
        - event: "chat:session_updated"
          payload: "ChatSessionUpdatedPayload { chat_session_id, title, pinned, updated_at }"
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/ChatSession' } } }
        '403':
          description: "сессия не принадлежит пользователю"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: "сессия не найдена"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/chat/sessions/{sessionId}/archive:
    patch:
      operationId: setChatSessionArchived
      summary: Архивировать/восстановить чат-сессию
      description: "При архивировании (archived=true) снимается привязка сессии к внешнему каналу (например, Slack-треду)."
      tags: [Chat]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      x-roles: [owner, admin, "member (только создатель сессии)"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [archived], properties: { archived: { type: boolean } } }
      x-events:
        - event: "chat:session_updated"
          payload: "ChatSessionUpdatedPayload { chat_session_id, title, status, updated_at }"
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/ChatSession' } } }
        '403':
          description: "сессия не принадлежит пользователю"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: "сессия не найдена"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/chat/sessions/{sessionId}/messages:
    post:
      operationId: sendChatMessage
      summary: Отправить сообщение в чат-сессию (запускает задачу агента)
      description: >
        Ключевой сценарий: сообщение пользователя создаёт задачу агента
        (`agent task`) с приоритетом чата, привязанную к сессии и к
        runtime агента; задача ставится в очередь runtime. Требования:
        сессия активна (не архивирована), агент не архивирован, у агента
        назначен runtime, у вызывающего есть право вызывать агента именно
        в контексте этой сессии. К сообщению можно приложить ранее
        загруженные вложения (`attachment_ids`); в ответ возвращаются
        только реально привязанные id (то есть без дублей/уже занятых).
        Если это первое пользовательское сообщение в сессии — асинхронно
        запускается генерация заголовка сессии по содержимому сообщения.

        Дальнейший обмен не синхронный: ответ агента приходит позже через
        realtime-события на ту же сессию — по мере выполнения задачи
        публикуются `task:queued` → `task:dispatch`/`task:running` →
        (опционально) серии `task:progress`/`task:message` с промежуточными
        шагами инструмента → и в конце либо `task:completed`, либо
        `task:failed`. Одновременно с завершением сервис создаёт
        ассистентское сообщение чата и публикует `chat:message`
        (role=assistant) и затем `chat:done`. Если пользователь отменяет
        задачу до ответа — публикуется `chat:cancel_finalized`.
      tags: [Chat]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      x-roles: [owner, admin, "member (только создатель сессии)"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1 }
                attachment_ids: { type: array, items: { type: string, format: uuid } }
      x-events:
        - event: "chat:message"
          payload: "ChatMessagePayload { chat_session_id, message_id, role: \"user\", content, task_id, created_at } — публикуется немедленно"
        - event: "task:queued / task:dispatch / task:running / task:progress / task:message / task:completed / task:failed / task:cancelled"
          payload: "публикуются асинхронно сервисом задач по ходу исполнения (не этим хендлером напрямую)"
        - event: "chat:message"
          payload: "ChatMessagePayload { role: \"assistant\", ... } — при получении ответа агента"
        - event: "chat:done"
          payload: "ChatDonePayload { chat_session_id, task_id, message_id?, content?, elapsed_ms?, message_kind? } — сигнал конца ответа"
      responses:
        '201':
          description: Сообщение принято, задача поставлена в очередь
          content:
            application/json:
              schema:
                type: object
                properties:
                  message_id: { type: string, format: uuid }
                  task_id: { type: string, format: uuid }
                  attachment_ids: { type: array, items: { type: string, format: uuid } }
                  created_at: { type: string, format: date-time }
        '400':
          description: "content пуст, либо attachment_ids содержит не-UUID, либо сессия архивна"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: "нет прав вызывать агента в этой сессии"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: "агент архивирован или у него нет назначенного runtime"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    get:
      operationId: listChatMessages
      summary: Полная история сообщений сессии (без пагинации)
      tags: [Chat]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      x-roles: [owner, admin, "member (только создатель сессии)"]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ChatMessage' } } } }
        '403':
          description: "нет доступа к сессии/агенту"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: "сессия не найдена"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/chat/sessions/{sessionId}/messages/page:
    get:
      operationId: listChatMessagesPage
      summary: История сообщений сессии постранично (курсор по времени и id)
      description: >
        Курсорная пагинация назад по времени: `before_created_at` +
        `before_id` должны передаваться вместе. `limit` — от 1 до 100,
        по умолчанию 50. В ответе сообщения идут в хронологическом
        порядке (от старых к новым внутри страницы).
      tags: [Chat]
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlugHeader'
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: before_created_at, in: query, schema: { type: string, format: date-time } }
        - { name: before_id, in: query, schema: { type: string, format: uuid } }
      x-roles: [owner, admin, "member (только создатель сессии)"]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/ChatMessagesPage' } } }
        '400':
          description: "limit вне диапазона, либо передан только один из курсорных параметров"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: "сессия не найдена"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/chat/sessions/{sessionId}/pending-task:
