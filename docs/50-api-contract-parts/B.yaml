        summary: {$ref: '#/components/schemas/DeploymentFleetSummary'}
        total: {type: integer}
        truncated: {type: boolean, description: "true, если список машин обрезан до лимита в 200 записей"}
        min_client_version: {type: string}

    # ------------------------------------------------------------------
    # Workspace / user config layers
    # ------------------------------------------------------------------
    WorkspaceConfigLayer:
      type: object
      properties:
        llm_base_url: {type: string}
        llm_model: {type: string}
        has_llm_api_key: {type: boolean}
        mcp_defaults:
          type: object
          description: "маскированная форма: {имя_сервера: {enabled?, env?: {ключ: true}}}"
        updated_at: {type: string, format: date-time, nullable: true}
        updated_by: {type: string, format: uuid}
    PutWorkspaceConfigRequest:
      type: object
      properties:
        llm_base_url: {type: string, description: "абсолютный http(s) URL, ≤2048 символов; пустая строка очищает"}
        llm_model: {type: string, maxLength: 256}
        llm_api_key: {type: string, maxLength: 4096, description: "write-only, запечатывается перед сохранением"}
        mcp_defaults:
          type: object
          description: >
            {имя_сервера: {enabled?: boolean, env?: {ключ: строка|null}} | null},
            null на верхнем уровне полностью очищает слой MCP; null у значения
            env удаляет переменную; документ ограничен 64 КБ
    WorkspaceUserConfigOverride:
      type: object
      properties:
        user_id: {type: string, format: uuid}
        llm_base_url: {type: string}
        llm_model: {type: string}
        has_llm_api_key: {type: boolean}
        mcp_overrides: {type: object, description: "та же маскированная форма, что mcp_defaults"}
        updated_at: {type: string, format: date-time, nullable: true}
        updated_by: {type: string, format: uuid}
    PutWorkspaceUserConfigOverrideRequest:
      allOf:
        - {$ref: '#/components/schemas/PutWorkspaceConfigRequest'}
      description: то же тело, что PutWorkspaceConfigRequest, но поле называется mcp_overrides.

    WorkspaceMcpServer:
      type: object
      properties:
        id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        name: {type: string}
        transport: {type: string, enum: [stdio, http, unknown]}
        source: {type: string, enum: [workspace, deployment]}
        enabled: {type: boolean, description: "присутствует только для серверов, включаемых пространством из библиотеки деплоя"}
        credential_schema: {type: array, items: {$ref: '#/components/schemas/McpCredentialField'}}
        provided_credentials: {type: array, items: {type: string}, description: "ключи, значения которых вызывающий уже сохранил"}
        missing_credentials: {type: array, items: {type: string}, description: "обязательные ключи схемы, ещё не заполненные вызывающим"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    WorkspaceMcpServerRequest:
      type: object
      properties:
        name: {type: string, description: "буквы/цифры/дефис/подчёркивание"}
        config:
          type: object
          description: то же ограничение, что у DeploymentMcpServerRequest.config
        credential_schema: {type: array, items: {$ref: '#/components/schemas/McpCredentialField'}}
