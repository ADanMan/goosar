          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/BillingPriceTier'}
        "503": {$ref: '#/components/responses/CloudRuntimeUnavailable'}

  /api/cloud-billing/checkout-sessions:
