        - {name: page_size, in: query, schema: {type: integer}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingTopupsPage'}
        "503": {$ref: '#/components/responses/CloudRuntimeUnavailable'}

  /api/cloud-billing/price-tiers:
    get:
      operationId: listCloudBillingPriceTiers
      tags: [CloudBilling]
