              schema: {$ref: '#/components/schemas/CreateBillingPortalSessionResponse'}
        "503": {$ref: '#/components/responses/CloudRuntimeUnavailable'}

  # ===========================================================================
  # /api/deployment/**
  # ===========================================================================
  /api/deployment/admins:
    get:
      operationId: listDeploymentAdmins
      tags: [DeploymentAdmin]
      summary: Список держателей роли deployment-admin
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [deployment-admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/DeploymentAdmin'}
        "403":
          description: вызывающий не deployment-admin
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    post:
      operationId: requestDeploymentAdminGrant
      tags: [DeploymentAdmin]
      summary: Заявить о выдаче роли deployment-admin пользователю по email
      description: >
        Изменение состава роли — двухканальное: этот вызов лишь заявляет
        запрос (пишет строку в admin-аудит) и отвечает 202 со ссылкой на
        pending-заявку; применяет её оператор отдельной серверной командой вне
        HTTP API. Если целевой пользователь уже деplоymент-admin — отвечает
        200 с его текущей записью без создания заявки. Повторная заявка на ту
        же пару (действие, пользователь) не дублируется — возвращается уже
        существующая.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [deployment-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
      responses:
        "200":
          description: пользователь уже deployment-admin
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeploymentAdmin'}
        "202":
          description: заявка на выдачу роли создана (или уже существовала)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeploymentAdminPendingRequest'}
        "400":
          description: email пуст
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "404":
          description: с этим email нет пользователя (роль выдаётся только существующему)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/deployment/admins/{userId}:
    parameters:
      - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
    delete:
      operationId: requestDeploymentAdminRevoke
      tags: [DeploymentAdmin]
      summary: Заявить об отзыве роли deployment-admin
      description: >
        Так же двухканально, как выдача — отвечает 202 с заявкой; применяет
        оператор отдельно. Отказывает 409, если это последний
        deployment-admin (нельзя остаться совсем без администраторов деплоя).
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [deployment-admin]
      responses:
        "202":
          description: заявка на отзыв создана (или уже существовала)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeploymentAdminPendingRequest'}
        "404":
          description: пользователь не является deployment-admin
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "409":
          description: нельзя отозвать последнего deployment-admin
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/deployment/admins/pending:
    get:
      operationId: listDeploymentAdminPendingRequests
      tags: [DeploymentAdmin]
      summary: Список заявок на выдачу/отзыв роли deployment-admin, ждущих подтверждения оператором
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [deployment-admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/DeploymentAdminPendingRequest'}

  /api/deployment/audit:
    get:
      operationId: listDeploymentAudit
      tags: [DeploymentAdmin]
      summary: Журнал аудита деплоя (admin-действия и auth-события), объединённый и отсортированный
      description: >
        Объединяет две ленты — административный журнал (изменения политики,
        конфигурации, состава ролей) и журнал аутентификации (успехи/отказы
        входа, отзывы сессий) — сортирует по времени и курсору. Параметр
        cursor переключает выдачу в режим "вперёд от курсора" (для live-tail),
        его отсутствие — режим "последние N назад от now/until".
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [deployment-admin]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: action, in: query, schema: {type: string}}
        - {name: actor, in: query, schema: {type: string}, description: "UUID актора или произвольная строка (для auth-событий с нечеловеческим актором)"}
        - {name: since, in: query, schema: {type: string, format: date-time}}
        - {name: until, in: query, schema: {type: string, format: date-time}}
        - {name: cursor, in: query, schema: {type: string}, description: "курсор постраничности, из поля cursor предыдущей записи"}
        - {name: source, in: query, schema: {type: string, enum: [admin, auth, all], default: all}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/DeploymentAuditEntry'}
        "400":
          description: limit/since/until/cursor/source не проходят валидацию формата
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/deployment/users/{userId}/deactivate:
    parameters:
      - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: deactivateDeploymentUser
      tags: [DeploymentAdmin]
      summary: Деактивировать учётную запись пользователя на уровне деплоя
      description: >
        Отзывает все личные токены доступа, все токены даемона/раннера,
        принудительно переводит рантаймы пользователя в offline, закрывает его
        реалтайм-подключения. Нельзя деактивировать себя (409). Пишет
        admin-аудит user.deactivate.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [deployment-admin]
      responses:
        "200":
          description: OK — сводка с числом отозванных токенов/подключений
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeploymentUser'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409":
          description: нельзя деактивировать собственную учётную запись
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/deployment/users/{userId}/reactivate:
    parameters:
      - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: reactivateDeploymentUser
      tags: [DeploymentAdmin]
      summary: Восстановить деактивированную учётную запись
      description: Пишет admin-аудит user.reactivate.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [deployment-admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeploymentUser'}
        "404": {$ref: '#/components/responses/NotFound'}

  /api/deployment/users/{userId}/revoke-sessions:
    parameters:
      - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: revokeDeploymentUserSessions
      tags: [DeploymentAdmin]
      summary: Принудительно отозвать все веб-сессии пользователя
      description: >
        Инкрементирует версию токена пользователя (мгновенно обесценивает уже
        выданные сессионные JWT) и удаляет хранимые сессии. Не трогает PAT и
        токены раннера — для этого есть deactivate.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [deployment-admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: {type: integer}
                  token_version: {type: integer}
        "404": {$ref: '#/components/responses/NotFound'}

  /api/deployment/users/{userId}:
    parameters:
      - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
    delete:
      operationId: deleteDeploymentUser
      tags: [DeploymentAdmin]
      summary: Удалить (анонимизировать) учётную запись пользователя на уровне деплоя
      description: >
        Необратимая анонимизация персональных данных (имя заменяется на
        фиксированную метку-заглушку, email/сторонние идентичности/MCP-креды/
        уведомления/фидбек стираются), членства во всех пространствах
        удаляются. Затем отзываются все живые токены/подключения — как при
        деактивации. Нельзя удалить себя (409) и нельзя удалить учётную
        запись, пока она сама deployment-admin — сначала отозвать роль
        (409 с подсказкой). Пишет admin-аудит user.delete.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [deployment-admin]
      responses:
        "200":
          description: OK — сводка удаления
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeleteDeploymentUserResponse'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409":
          description: попытка удалить себя, либо действующего deployment-admin
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/deployment/mcp-servers:
    get:
      operationId: listDeploymentMcpServers
      tags: [DeploymentMcp]
      summary: Библиотека MCP-серверов уровня деплоя
      description: >
        Конфигурация каждого сервера (адрес/команда/секреты) запечатана и
        никогда не отдаётся в ответе целиком — только имя, транспорт, схема
        запрашиваемых у пользователя credential-полей и число пространств,
        включивших сервер.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [deployment-admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/DeploymentMcpServer'}
    post:
      operationId: createDeploymentMcpServer
      tags: [DeploymentMcp]
      summary: Добавить MCP-сервер в библиотеку деплоя
      description: >
        config не может содержать ключи enabled/disabled (включение —
        прерогатива пространства через отдельную ручку) и не может содержать
        служебный маркер маски. Если объявлена credential_schema (поля,
        которые сервер просит у каждого пользователя), транспорт сервера
        должен поддерживать переменные окружения — http/sse отклоняются
        (400), т.к. у них нет env-канала для подстановки. Требует
        GOOSAR_MCP_SECRET_KEY на сервере (иначе 503). Пишет admin-аудит
        deployment_mcp_server.create с хэшем содержимого (само содержимое в
        аудит не попадает).
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [deployment-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeploymentMcpServerRequest'}
      responses:
        "201":
          description: Создан
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeploymentMcpServer'}
        "400": {$ref: '#/components/responses/BadRequest'}
        "409":
          description: имя уже занято
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "503":
          description: ключ шифрования конфигурации не настроен
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/deployment/mcp-servers/{serverId}:
    parameters:
      - {name: serverId, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: updateDeploymentMcpServer
      tags: [DeploymentMcp]
      summary: Обновить MCP-сервер библиотеки деплоя
      description: Частичное обновление — поля, не переданные, не меняются. Валидация та же, что при создании. Пишет deployment_mcp_server.update.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [deployment-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeploymentMcpServerRequest'}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeploymentMcpServer'}
        "400": {$ref: '#/components/responses/BadRequest'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409":
          description: имя уже занято другим сервером
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    delete:
      operationId: deleteDeploymentMcpServer
      tags: [DeploymentMcp]
      summary: Удалить MCP-сервер из библиотеки деплоя
      description: >
        Каскадно снимает включения у всех пространств, отвязывает от всех
        агентов и стирает пользовательские credential-значения для него.
        Пишет deployment_mcp_server.delete.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [deployment-admin]
      responses:
        "204": {description: Удалён}
        "404": {$ref: '#/components/responses/NotFound'}

  /api/deployment/policy:
    get:
      operationId: getDeploymentPolicyAsAdmin
      tags: [DeploymentAdmin]
      summary: Прочитать документ политики деплоя (административный вход)
      description: >
        Пустая политика (`{}`), если ничего не сохранено. Тот же документ, что
        отдаёт публичная только-для-чтения ручка /api/deployment-policy, но
        без обязательного членства в конкретном пространстве.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [deployment-admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeploymentPolicyDocument'}
    put:
      operationId: putDeploymentPolicy
      tags: [DeploymentAdmin]
      summary: Заменить документ политики деплоя целиком
      description: >
        Документ — не более 64 КБ, только объект с полями llm/mcp/session (без
        произвольных дополнительных ключей), без полей, похожих на секреты по
        имени (key/token/secret/password — такие отклоняются 400, секреты
        живут в слоях конфигурации пространства/пользователя, а не в
        политике). Запись "*" в mcp поддерживает только форму
        `{"enabled": false, "locked": true}` — общий выключатель MCP на весь
        деплой. Пустой объект `{}` допустим и очищает политику. Каждое
        изменение пишет в admin-аудит хэши документа до/после и инвалидирует
        закэшированные политики сессий.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [deployment-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy]
              properties:
                policy: {$ref: '#/components/schemas/DeploymentPolicyBody'}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeploymentPolicyDocument'}
        "400":
          description: policy пуст/невалиден, превышает лимит, содержит
            запрещённые/похожие-на-секрет поля, либо запись "*" не в
            канонической форме
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/deployment/workspaces:
    get:
      operationId: listDeploymentWorkspaces
      tags: [DeploymentAdmin]
      summary: Список всех пространств деплоя с числом участников
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [deployment-admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/DeploymentWorkspace'}

  /api/deployment/join-targets:
    get:
      operationId: listJoinTargets
      tags: [DeploymentAdmin]
      summary: Список ролевых пространств, открытых для самостоятельного вступления
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [any-authenticated]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/JoinTarget'}

  /api/deployment/join-targets/{workspaceId}/join:
    parameters:
      - {name: workspaceId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: joinTargetWorkspace
      tags: [DeploymentAdmin]
      summary: Самостоятельно вступить в открытое ролевое пространство участником
      description: >
        404, если пространство не помечено открытым для вступления. Если
        вызывающий уже участник — идемпотентно отвечает 200 с
        already_member:true, без ошибки. Отмечает пользователя онбордингнутым
        при первом вступлении, публикует member.added, уведомляет
        десктоп-раннеры. Обычный аудит запроса (не admin-аудит) — это
        самообслуживание, а не административное действие.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [any-authenticated]
      x-rate-limit: "20 запросов/час на пользователя или IP"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JoinTargetResult'}
        "404":
          description: пространство не открыто для вступления
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/deployment/fleet:
    get:
      operationId: listDeploymentFleet
      tags: [DeploymentAdmin]
      summary: Обзорная сводка по всем машинам (десктоп-раннерам) деплоя
      description: >
        Строится на лету из уже накопленных heartbeat'ов, очереди задач и
        реестра агентов — ничего не сохраняет. Список машин обрезается до 200
        записей (truncated:true при обрезке), сортировка — сначала машины с
        зависшими задачами, затем офлайн, затем устаревшая версия клиента.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [deployment-admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeploymentFleet'}

  /api/deployment/workspaces/{workspaceId}:
    parameters:
      - {name: workspaceId, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      operationId: setDeploymentWorkspaceOpenJoin
      tags: [DeploymentAdmin]
      summary: Включить/выключить открытое самостоятельное вступление в ролевое пространство
      description: >
        Применимо только к пространствам, созданным из шаблона роли
        (provisioned; иначе 400). Пишет admin-аудит workspace.open_join.set.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [deployment-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [open_join]
              properties:
                open_join: {type: boolean}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
                  name: {type: string}
                  slug: {type: string}
                  open_join: {type: boolean}
        "400":
          description: пространство не создано из шаблона роли
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "404": {$ref: '#/components/responses/NotFound'}

  /api/deployment/workspaces/{workspaceId}/members:
    parameters:
      - {name: workspaceId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: listDeploymentWorkspaceMembers
      tags: [DeploymentAdmin]
      summary: Состав участников произвольного пространства (административный обзор)
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [deployment-admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/DeploymentWorkspaceMember'}
        "404": {$ref: '#/components/responses/NotFound'}

  /api/deployment/workspaces/{workspaceId}/config:
    parameters:
      - {name: workspaceId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getDeploymentWorkspaceConfig
      tags: [DeploymentAdmin, WorkspaceConfig]
      summary: Прочитать конфиг-слой пространства по его id (административный вход)
      description: >
        Тот же обработчик и та же форма ответа, что у /api/workspace-config
        (см. описание ниже) — здесь id пространства берётся из пути, а не из
        заголовка/query. Каждое чтение через этот административный вход
        (когда вызывающий — deployment-admin, а не owner/admin самого
        пространства) пишет запись в admin-аудит (config.read) с хэшем
        прочитанного документа.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin, deployment-admin]
      responses:
        "200":
          description: OK (пустой объект, если конфиг ещё не задавался)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceConfigLayer'}
        "403":
          description: вызывающий не участник пространства и не deployment-admin
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "503":
          description: хранимый документ запечатан, а ключ расшифровки не настроен на сервере
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    put:
      operationId: putDeploymentWorkspaceConfig
      tags: [DeploymentAdmin, WorkspaceConfig]
      summary: Записать конфиг-слой пространства по его id (административный вход)
      description: См. валидацию PUT /api/workspace-config ниже. Административная запись дополнительно пишет workspace_config.set в admin-аудит с хэшами до/после.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin, deployment-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutWorkspaceConfigRequest'}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceConfigLayer'}
        "400": {$ref: '#/components/responses/BadRequest'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "503":
          description: GOOSAR_MCP_SECRET_KEY не настроен, а запись требует шифрования
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/deployment/workspaces/{workspaceId}/config/overrides:
    parameters:
      - {name: workspaceId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: listDeploymentWorkspaceConfigOverrides
      tags: [DeploymentAdmin, WorkspaceConfig]
      summary: Список персональных override'ов конфигурации всех участников пространства
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin, deployment-admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/WorkspaceUserConfigOverride'}
        "404": {$ref: '#/components/responses/NotFound'}

  /api/deployment/workspaces/{workspaceId}/config/overrides/{userId}:
    parameters:
      - {name: workspaceId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getDeploymentWorkspaceUserConfigOverride
      tags: [DeploymentAdmin, WorkspaceConfig]
      summary: Прочитать персональный override конфигурации участника (административный вход)
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin, deployment-admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceUserConfigOverride'}
        "404":
          description: override для этого пользователя не задан, либо пользователь не участник пространства
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    put:
      operationId: putDeploymentWorkspaceUserConfigOverride
      tags: [DeploymentAdmin, WorkspaceConfig]
      summary: Записать персональный override конфигурации участника (административный вход)
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin, deployment-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutWorkspaceUserConfigOverrideRequest'}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceUserConfigOverride'}
        "400": {$ref: '#/components/responses/BadRequest'}
        "404":
          description: целевой пользователь не участник пространства
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    delete:
      operationId: deleteDeploymentWorkspaceUserConfigOverride
      tags: [DeploymentAdmin, WorkspaceConfig]
      summary: Удалить персональный override конфигурации участника (административный вход)
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin, deployment-admin]
      responses:
        "204": {description: Удалён}
        "404":
          description: целевой пользователь не участник пространства
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  # ===========================================================================
  # /api/assignee-frequency, /api/status — требуют членства в пространстве
  # (заголовок/query workspace_id или slug), см. WorkspaceSlugHeader
  # ===========================================================================
  /api/assignee-frequency:
    get:
      operationId: getAssigneeFrequency
      tags: [Workspaces]
      summary: Частота назначений исполнителей вызывающим пользователем в пространстве
      description: >
        Используется для сортировки подсказок "часто назначаю". Считает и
        изменения исполнителя в активностях, и назначения при создании
        задачи, суммируя по паре (тип исполнителя, id исполнителя).
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceSlugHeader'}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AssigneeFrequencyEntry'}

  /api/status:
    get:
      operationId: getWorkspaceStatus
      tags: [Workspaces]
      summary: Единая диагностическая сводка по пространству для вызывающего (кто я, рантаймы, provisioning, MCP, периметр, LLM)
      description: >
        Собирает состояние из нескольких подсистем на лету специально для
        экрана диагностики/статус-бара клиента; ничего не сохраняет.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceSlugHeader'}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceStatus'}
        "400":
          description: workspace_id/slug не переданы или невалидны
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  # ===========================================================================
  # /api/provisioning/**
  # ===========================================================================
  /api/provisioning/manifest:
    get:
      operationId: getProvisioningManifest
      tags: [Provisioning]
      summary: Разрешённый манифест пакетов (skill/mcp-server/runtime) для пространства и платформы
      description: >
        Если у пространства заданы pin'ы (закреплённые версии) — манифест
        строится из них плюс их транзитивные зависимости (requires); иначе —
        из полного каталога деплоя. Фильтруется по платформе (обязательный
        query platform). Каждая отдача манифеста фиксируется как "доставленный
        пакет" для последующей диагностики (used by /api/status). Пакеты,
        отозванные политикой деплоя, перечисляются отдельно в
        revokedPackages, не исключаясь молча.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceSlugHeader'}
        - {name: platform, in: query, required: true, schema: {type: string, enum: ["*", darwin-arm64, darwin-x64, win-x64, linux-x64, linux-arm64]}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProvisioningManifest'}
        "400":
          description: workspace_id не передан/невалиден, либо platform отсутствует/невалиден
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "502":
          description: не удалось разрешить манифест (сбой хранилища пакетов)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "503":
          description: provisioning не настроен на деплое
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/provisioning/blob/{name}/{version}:
    parameters:
      - {name: name, in: path, required: true, schema: {type: string}}
      - {name: version, in: path, required: true, schema: {type: string}}
    get:
      operationId: getProvisioningBlob
      tags: [Provisioning]
      summary: Скачать бинарный блоб пакета (zstd-архив)
      description: >
        Пакет должен присутствовать в манифесте, разрешённом для пространства
        и платформы — иначе 404, даже если блоб физически существует в
        хранилище. Ответ несёт X-Package-Sha256 для проверки целостности на
        стороне клиента.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceSlugHeader'}
        - {name: platform, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: application/zstd, X-Package-Sha256, Cache-Control no-store
          content:
            application/zstd:
              schema: {type: string, format: binary}
        "400":
          description: platform отсутствует/невалиден
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "404":
          description: пакет не входит в разрешённый для пространства/платформы манифест, либо блоб отсутствует в хранилище
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "503":
          description: provisioning не настроен
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/provisioning/catalog:
    get:
      operationId: getProvisioningCatalog
      tags: [Provisioning]
      summary: Полный каталог доступных пакетов деплоя (без учёта pin'ов пространства)
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProvisioningCatalog'}
        "503":
          description: provisioning не настроен
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/provisioning/pins:
    get:
      operationId: getProvisioningPins
      tags: [Provisioning]
      summary: Список закреплённых версий пакетов пространства
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceSlugHeader'}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProvisioningPinsList'}
    put:
      operationId: putProvisioningPins
      tags: [Provisioning]
      summary: Заменить набор закреплений пространства целиком
      description: >
        Полная замена — существующие pin'ы пространства удаляются, затем
        вставляются переданные, одной транзакцией. package_type/package_name/
        version должны пройти формат-валидацию; для одной пары
        (package_type, package_name) допустима только одна запись (иначе 400
        duplicate).
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceSlugHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutProvisioningPinsRequest'}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProvisioningPinsList'}
        "400":
          description: package_type/package_name/version невалидны, либо дублирующаяся пара
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  # ===========================================================================
  # /api/workspace-config/**
  # ===========================================================================
  /api/workspace-config:
    get:
      operationId: getWorkspaceConfig
      tags: [WorkspaceConfig]
      summary: Прочитать конфиг-слой пространства (LLM base_url/model/api_key, MCP-умолчания)
      description: >
        Пространство определяется заголовком/query (см. WorkspaceSlugHeader),
        не путём URL. Доступ — owner/admin пространства, либо
        deployment-admin (в этом случае чтение дополнительно пишется в
        admin-аудит config.read с хэшем документа). has_llm_api_key — булев
        признак наличия ключа, сам ключ никогда не возвращается. mcp_defaults
        возвращается маскированным: значения env заменены на true/false
        (есть/нет), сами значения не отдаются.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin, deployment-admin]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceSlugHeader'}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceConfigLayer'}
        "400":
          description: workspace_id/slug не переданы
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "403":
          description: вызывающий не owner/admin пространства и не deployment-admin
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "503":
          description: документ запечатан, ключ расшифровки не настроен
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    put:
      operationId: putWorkspaceConfig
      tags: [WorkspaceConfig]
      summary: Записать конфиг-слой пространства
      description: >
        Частичный патч по слою: переданные поля заменяют текущие, отсутствующие
        не трогаются. llm_base_url — обязательно абсолютный http(s) URL (или
        пустая строка, чтобы очистить), ограничен по длине; llm_model
        ограничен по длине; llm_api_key запечатывается перед сохранением и
        никогда не возвращается открытым текстом. mcp_defaults — JSON-объект
        {имя_сервера: {enabled?, env?}}, где env — карта строка→строка|null
        (null удаляет переменную); документ целиком ограничен по размеру.
        Запись llm_api_key или непустого mcp_defaults требует настроенного
        ключа шифрования (иначе 503). Запись через deployment-admin вход
        дополнительно пишет workspace_config.set в admin-аудит с хэшами
        до/после.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin, deployment-admin]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceSlugHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutWorkspaceConfigRequest'}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceConfigLayer'}
        "400":
          description: llm_base_url не абсолютный http(s), поле превышает лимит
            длины, либо mcp_defaults превышает лимит размера/не является
            объектом с полями enabled/env
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "503":
          description: требуется ключ шифрования, который не настроен
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/workspace-config/overrides/{userId}:
    parameters:
      - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getWorkspaceUserConfigOverride
      tags: [WorkspaceConfig]
      summary: Прочитать персональный override конфигурации участника
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin, deployment-admin]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceSlugHeader'}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceUserConfigOverride'}
        "404":
          description: override не задан, либо userId не участник пространства
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    put:
      operationId: putWorkspaceUserConfigOverride
      tags: [WorkspaceConfig]
      summary: Записать персональный override конфигурации участника
      description: Та же валидация полей, что у PUT /api/workspace-config, но применяется к слою конкретного участника (mcp_overrides вместо mcp_defaults).
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin, deployment-admin]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceSlugHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutWorkspaceUserConfigOverrideRequest'}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceUserConfigOverride'}
        "400": {$ref: '#/components/responses/BadRequest'}
        "404":
          description: userId не участник пространства
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    delete:
      operationId: deleteWorkspaceUserConfigOverride
      tags: [WorkspaceConfig]
      summary: Удалить персональный override конфигурации участника
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin, deployment-admin]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceSlugHeader'}
      responses:
        "204": {description: Удалён}
        "404":
          description: userId не участник пространства
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  # ===========================================================================
  # /api/workspace-mcp-servers/**
  # ===========================================================================
  /api/workspace-mcp-servers:
    get:
      operationId: listWorkspaceMcpServers
      tags: [WorkspaceMcp]
      summary: Список MCP-серверов, видимых пространству (свои плюс включённые из библиотеки деплоя)
      description: >
        Объединяет собственные MCP-серверы пространства (source=workspace) и
        включённые пространством серверы библиотеки деплоя (source=deployment,
        только те, что реально включены). Для каждого сервера показывает
        credential_schema, какие поля вызывающий уже заполнил
        (provided_credentials) и какие обязательные ещё не заполнены
        (missing_credentials).
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceSlugHeader'}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/WorkspaceMcpServer'}
        "400":
          description: workspace_id не передан
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    post:
      operationId: createWorkspaceMcpServer
      tags: [WorkspaceMcp]
      summary: Создать собственный MCP-сервер пространства
      description: >
        Недоступно агенту-актору (только человеку или сервисному вызову от
        имени владельца-человека). name — только буквы/цифры/дефис/подчёркивание,
        уникален в пространстве. config — как у серверов деплоя (без
        enabled/disabled и без маркера маски); при непустой credential_schema
        транспорт должен поддерживать env (не http/sse). Требует
        GOOSAR_MCP_SECRET_KEY.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceSlugHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkspaceMcpServerRequest'}
      responses:
        "201":
          description: Создан
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceMcpServer'}
        "400": {$ref: '#/components/responses/BadRequest'}
        "403":
          description: вызывающий — агент-актор, либо не owner/admin
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "404":
          description: пространство не найдено (гонка с удалением пространства)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "409":
          description: имя уже занято в пространстве
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "503":
          description: ключ шифрования не настроен
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/workspace-mcp-servers/{serverId}:
    parameters:
      - {name: serverId, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: updateWorkspaceMcpServer
      tags: [WorkspaceMcp]
      summary: Обновить собственный MCP-сервер пространства
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceSlugHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkspaceMcpServerRequest'}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceMcpServer'}
        "400": {$ref: '#/components/responses/BadRequest'}
        "403":
          description: вызывающий — агент-актор, либо не owner/admin
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409":
          description: имя уже занято другим сервером пространства
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    delete:
      operationId: deleteWorkspaceMcpServer
      tags: [WorkspaceMcp]
      summary: Удалить собственный MCP-сервер пространства
      description: Каскадно снимает назначения у всех агентов и стирает пользовательские credential-значения для него.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceSlugHeader'}
      responses:
        "204": {description: Удалён}
        "403":
          description: вызывающий — агент-актор, либо не owner/admin
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "404": {$ref: '#/components/responses/NotFound'}

  /api/workspace-mcp-servers/{serverId}/credentials:
    parameters:
      - {name: serverId, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: setWorkspaceMcpCredentials
      tags: [WorkspaceMcp]
      summary: Задать свои персональные значения credential-полей MCP-сервера (свой или включённый из деплоя)
      description: >
        Каждый участник хранит собственные значения отдельно (это не
        административная настройка сервера, а самообслуживание — доступно
        любому участнику пространства, не только owner/admin, но не
        агенту-актору). Значения объединяются с уже сохранёнными:
        пустая строка для ключа удаляет его, отсутствующий в запросе ключ —
        сохраняется как был. Отклоняется, если у сервера вообще нет
        credential_schema (400), если ключ не входит в схему, или если
        значение слишком длинное. Значения запечатываются перед сохранением.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceSlugHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetWorkspaceMcpCredentialsRequest'}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceMcpServer'}
        "400":
          description: сервер не запрашивает credential-поля, либо переданы
            неизвестные ключи/слишком длинные значения
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "403":
          description: вызывающий — агент-актор
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "404":
          description: сервер не найден в этом пространстве (ни свой, ни включённый из деплоя)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "503":
          description: ключ шифрования не настроен
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    delete:
      operationId: deleteWorkspaceMcpCredentials
      tags: [WorkspaceMcp]
      summary: Очистить свои персональные значения credential-полей MCP-сервера
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceSlugHeader'}
      responses:
        "200":
          description: OK — сервер с пустыми provided_credentials
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceMcpServer'}
        "403":
          description: вызывающий — агент-актор
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "404": {$ref: '#/components/responses/NotFound'}

  # ===========================================================================
  # /api/deployment-mcp-servers/**
  # ===========================================================================
  /api/deployment-mcp-servers:
    get:
      operationId: listWorkspaceDeploymentMcpServers
      tags: [WorkspaceMcp, DeploymentMcp]
      summary: Список серверов из библиотеки деплоя, доступных пространству, с флагом включения
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceSlugHeader'}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/DeploymentMcpServer'}
        "400":
          description: workspace_id не передан
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/deployment-mcp-servers/{serverId}/enabled:
    parameters:
      - {name: serverId, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: setWorkspaceDeploymentMcpServerEnabled
      tags: [WorkspaceMcp, DeploymentMcp]
      summary: Включить/выключить сервер из библиотеки деплоя для пространства
      description: >
        При выключении дополнительно снимает назначения этого сервера у всех
        агентов пространства (иначе они остались бы ссылаться на недоступный
        сервер). Недоступно агенту-актору.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceSlugHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses:
        "204": {description: Обновлено}
        "400":
          description: enabled не передан
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "403":
          description: вызывающий — агент-актор, либо не owner/admin
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "404":
          description: пространство или сервер не найдены
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  # ===========================================================================
  # Одиночные ручки эффективной конфигурации и здоровья LLM
  # ===========================================================================
  /api/deployment-policy:
    get:
      operationId: getDeploymentPolicy
      tags: [WorkspaceConfig]
      summary: Прочитать документ политики деплоя (только для чтения, вход через членство в пространстве)
      description: >
        Тот же документ, что у административной ручки GET /api/deployment/policy,
        но доступ определяется тем же правилом, что у /api/workspace-config —
        owner/admin пространства или deployment-admin.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin, deployment-admin]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceSlugHeader'}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeploymentPolicyDocument'}
        "403": {$ref: '#/components/responses/Forbidden'}

  /api/effective-config:
    get:
      operationId: getEffectiveConfigView
      tags: [WorkspaceConfig]
      summary: Итоговая (эффективная) конфигурация LLM/MCP для пары пространство+пользователь, с признаками происхождения и блокировки
      description: >
        Показывает результат наложения слоёв политика-деплоя →
        конфиг-пространства → персональный override, с указанием, из какого
        слоя взято каждое значение (origin) и заблокировано ли оно для
        переопределения ниже (locked). Секретные значения не отдаются —
        только has_api_key/has_env.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceSlugHeader'}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EffectiveConfigView'}
        "400":
          description: workspace_id не передан/невалиден
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "403":
          description: вызывающий не участник пространства
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/deployment/client-secrets:
    get:
      operationId: getDeploymentClientSecrets
      tags: [DeploymentAdmin]
      summary: Выдать управляемому десктоп-раннеру ключ LLM деплоя и адреса библиотеки MCP вне активной задачи
      description: >
        Единственный канал получения секретов деплоя раннером в простое
        (чат-помощник, самопроверка при установке); персональные MCP-креды
        сюда не попадают, только конфигурация уровня деплоя. Доступен только
        инсталляциям, запущенным самим приложением — определяется заголовком
        X-Goosar-Launched-By: desktop (иначе 403 с
        code=client_secrets_not_managed). Каждая выдача пишется в admin-аудит
        (deployment.client_secrets.issued) со списком выданных полей, но без
        самих значений.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [any-authenticated]
      parameters:
        - name: X-Goosar-Launched-By
          in: header
          required: true
          schema: {type: string, enum: [desktop]}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeploymentClientSecrets'}
        "403":
          description: код client_secrets_not_managed — вызов не от управляемой инсталляции
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/llm/health:
    get:
      operationId: getLlmHealth
      tags: [WorkspaceConfig]
      summary: Здоровье сконфигурированного на деплое LLM-эндпоинта (пингует /models)
      description: >
        Результат кэшируется на 60 секунд (общий кэш процесса, не привязан к
        пространству/пользователю). unconfigured, если на деплое не заданы
        base_url/api_key.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LlmHealth'}

components:
  responses:
    BadRequest:
      description: Невалидный запрос
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Не аутентифицирован
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Недостаточно прав
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    CloudRuntimeUnavailable:
      description: Облачный рантайм (биллинг) не подключён на этом деплое
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    CloudRuntimeBadGateway:
      description: Облачный рантайм ответил ошибкой или недоступен
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    CloudRuntimeTimeout:
      description: Превышено время ожидания ответа облачного рантайма
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}

  schemas:
    # ------------------------------------------------------------------
    # Workspaces
    # ------------------------------------------------------------------
    WorkspaceItem:
      description: >
        Форма ровно как #/components/schemas/Workspace в общем фрагменте
        контракта; продублирована здесь полями для сверки, а не как
        отдельная схема — реализатор должен использовать общий Workspace.
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        slug: {type: string}
        description: {type: string, nullable: true}
        context: {type: string, nullable: true}
        settings: {type: object}
        repos: {type: array, items: {type: object}}
        issue_prefix: {type: string}
        avatar_url: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
      required: [id, name, slug, issue_prefix, created_at, updated_at]

    CreateWorkspaceRequest:
      type: object
      required: [name, slug]
      properties:
        name: {type: string, description: "обрезается по пробелам, не может быть пустым после обрезки"}
        slug:
          type: string
          description: >
            приводится к нижнему регистру; после нормализации должен
            соответствовать `^[a-z0-9]+(?:-[a-z0-9]+)*$`; не должен входить в
            список зарезервированных слов (code=workspace_slug_reserved)
        description: {type: string, nullable: true}
        context: {type: string, nullable: true}
        issue_prefix: {type: string, nullable: true, description: "если не задан — выводится из первых букв имени, до 3 символов, в верхнем регистре"}
        template_key: {type: string, nullable: true, description: "ключ шаблона роли для предзаполнения пространства при создании"}

    UpdateWorkspaceRequest:
      type: object
      description: Частичный патч — присутствующие поля заменяют текущие значения.
      properties:
        name: {type: string, description: "непустая строка после обрезки пробелов"}
        description: {type: string, nullable: true}
        context: {type: string, nullable: true}
        settings: {type: object}
        repos:
          type: array
          description: >
            массив {url, description?}; url обязателен, должен быть валидным
            http(s) или ssh git URL; дубликаты по url молча схлопываются
          items:
            type: object
            required: [url]
            properties:
              url: {type: string}
              description: {type: string}
        issue_prefix: {type: string, description: "приводится к верхнему регистру; пустая строка игнорируется"}
        avatar_url: {type: string}

    WorkspaceCapabilities:
      type: object
      properties:
        template_key: {type: string}
        role_name: {type: string}
        role_summary: {type: string}
        capabilities:
          type: array
          items: {$ref: '#/components/schemas/WorkspaceCapability'}
        sample_tasks:
          type: array
          items: {$ref: '#/components/schemas/WorkspaceSampleTask'}
    WorkspaceCapability:
      type: object
      properties:
        key: {type: string}
        title: {type: string}
        body: {type: string}
    WorkspaceSampleTask:
      type: object
      properties:
        key: {type: string}
        title: {type: string}
        prompt: {type: string}
        requires: {type: array, items: {type: string}}

    WorkspaceMemberWithUser:
      description: >
        Расширение общего #/components/schemas/Member полями пользователя.
        Поля для сверки: id, workspace_id, user_id, role, created_at, name,
        email, avatar_url, perimeter_access.
      type: object
      properties:
        id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        role: {type: string, enum: [owner, admin, member]}
        created_at: {type: string, format: date-time}
        name: {type: string}
        email: {type: string}
        avatar_url: {type: string, nullable: true}
        perimeter_access: {type: boolean}
      required: [id, workspace_id, user_id, role, created_at, name, email, perimeter_access]

    InviteWorkspaceMemberRequest:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email}
        role: {type: string, enum: [member, admin], description: "owner запрещён для приглашения; пусто = member"}

    UpdateWorkspaceMemberRequest:
      type: object
      description: Должно быть передано хотя бы одно из role/perimeter_access.
      properties:
        role: {type: string, enum: [owner, admin, member]}
        perimeter_access: {type: boolean}

    WorkspaceInvitation:
      type: object
      properties:
        id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        inviter_id: {type: string, format: uuid}
        invitee_email: {type: string}
        invitee_user_id: {type: string, format: uuid, nullable: true}
        role: {type: string, enum: [owner, admin, member]}
        status: {type: string, enum: [pending, accepted, declined, revoked, expired]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        inviter_name: {type: string}
        inviter_email: {type: string}
        workspace_name: {type: string}
      required: [id, workspace_id, inviter_id, invitee_email, role, status, created_at, updated_at, expires_at]

    WorkspaceExportJob:
      type: object
      properties:
        id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        status: {type: string, enum: [pending, running, completed, failed]}
        error: {type: string, nullable: true}
        size_bytes: {type: integer}
        created_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time, nullable: true}
        manifest: {type: object, nullable: true}
        download_url: {type: string, nullable: true, description: "присутствует только когда status=completed"}
      required: [id, workspace_id, status, size_bytes, created_at]

    GitHubInstallation:
      type: object
      properties:
        id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        installation_id: {type: integer, nullable: true, description: "виден только owner/admin, иначе null"}
        account_login: {type: string}
        account_type: {type: string}
        account_avatar_url: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
    GitHubInstallationsResponse:
      type: object
      properties:
        installations:
          type: array
          items: {$ref: '#/components/schemas/GitHubInstallation'}
        configured: {type: boolean}
        repository_browse_configured: {type: boolean}
        can_manage: {type: boolean}
    GitHubConnectResponse:
      type: object
      properties:
        url: {type: string}
        configured: {type: boolean}
    GitHubRepository:
      type: object
      properties:
        id: {type: integer}
        full_name: {type: string}
        html_url: {type: string}
        clone_url: {type: string}
        description: {type: string, nullable: true}
        private: {type: boolean}
        archived: {type: boolean}
        default_branch: {type: string}
    GitHubRepositoriesResponse:
      type: object
      properties:
        repositories:
          type: array
          items: {$ref: '#/components/schemas/GitHubRepository'}
        total_count: {type: integer}
        next_page: {type: integer, nullable: true}

    VcsConnection:
      type: object
      properties:
        id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        provider: {type: string}
        instance_url: {type: string}
        account_login: {type: string}
        webhook_url: {type: string}
        webhook_path: {type: string}
        created_at: {type: string, format: date-time}
    VcsConnectionsResponse:
      type: object
      properties:
        connections:
          type: array
          items: {$ref: '#/components/schemas/VcsConnection'}
        available: {type: boolean}
        configured: {type: boolean}
        can_manage: {type: boolean}
    ConnectVcsRequest:
      type: object
      required: [provider, instance_url, access_token]
      properties:
        provider: {type: string}
        instance_url: {type: string}
        access_token: {type: string}
    VcsConnectResponse:
      allOf:
        - {$ref: '#/components/schemas/VcsConnection'}
        - type: object
          properties:
            webhook_secret: {type: string, description: "отдаётся только в ответ на подключение/ротацию, больше нигде не читается"}

    RuntimeProfile:
      type: object
      properties:
        id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        display_name: {type: string}
        protocol_family: {type: string}
        command_name: {type: string}
        description: {type: string, nullable: true}
        fixed_args: {type: array, items: {type: string}}
