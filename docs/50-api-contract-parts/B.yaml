  /api/cloud-billing/portal-sessions:
    post:
      operationId: createCloudBillingPortalSession
      tags: [CloudBilling]
      summary: Создать ссылку на Stripe billing portal для вызывающего
      security: [{cookieAuth: []}, {bearerAuth: []}]
