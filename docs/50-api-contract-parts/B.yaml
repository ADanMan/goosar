        name: {type: string, description: "фиксированная метка-заглушка, не исходное имя"}
        removed_memberships: {type: integer}
        revoked_tokens: {type: integer}
        closed_connections: {type: integer}

    McpCredentialField:
      type: object
      description: >
        Одно поле, которое MCP-сервер просит заполнить у каждого пользователя
        (например, персональный API-ключ стороннего сервиса).
      required: [key, required]
      properties:
        key:
          type: string
          description: "1-128 символов, буквы/цифры/подчёркивание, не начинается с цифры, уникален в пределах схемы"
        label: {type: string, maxLength: 500}
        hint: {type: string, maxLength: 500}
        required: {type: boolean}

    DeploymentMcpServer:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        transport: {type: string, enum: [stdio, http, unknown]}
        credential_schema:
          type: array
          items: {$ref: '#/components/schemas/McpCredentialField'}
        enabled_workspaces: {type: integer, description: "только в административном списке — сколько пространств включили сервер"}
        enabled: {type: boolean, description: "только когда сервер показан в контексте конкретного пространства — включён ли он там"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    DeploymentMcpServerRequest:
      type: object
      description: name обязателен при создании; при обновлении пустая строка = не менять.
      properties:
        name: {type: string, description: "буквы/цифры/дефис/подчёркивание"}
        config:
          type: object
          description: >
            JSON-объект подключения сервера (адрес/команда/секреты). Не может
            содержать ключи enabled/disabled и служебный маркер маски.
            Хранится запечатанным, никогда не отдаётся обратно.
        credential_schema:
          type: array
          items: {$ref: '#/components/schemas/McpCredentialField'}

    DeploymentPolicyBody:
      type: object
      description: >
        Не более 64 КБ, только объект; допускаются только ключи llm/mcp/session
        (любой другой ключ верхнего уровня отклоняется, как и любое поле,
        похожее на секрет по имени — key/token/secret/password).
      properties:
        llm:
          type: object
          properties:
            base_url: {type: string}
            model: {type: string}
            locked: {type: boolean}
        mcp:
          type: object
          description: >
            имя_сервера → {enabled?, locked?}; запись "*" — общий выключатель
            MCP на деплое и допускает только {"enabled": false, "locked": true}
          additionalProperties:
            type: object
            properties:
              enabled: {type: boolean}
              locked: {type: boolean}
        session:
          type: object
          description: "idle_timeout_hours/absolute_lifetime_days/max_concurrent_sessions/require_mfa"
    DeploymentPolicyDocument:
      type: object
      properties:
        policy: {$ref: '#/components/schemas/DeploymentPolicyBody'}
        updated_at: {type: string, format: date-time, nullable: true}

    DeploymentWorkspace:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        slug: {type: string}
        member_count: {type: integer}
    DeploymentWorkspaceMember:
      type: object
      properties:
        user_id: {type: string, format: uuid}
