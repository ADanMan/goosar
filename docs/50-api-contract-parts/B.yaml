            application/json:
              schema: {$ref: '#/components/schemas/BillingBatchesPage'}
        "503": {$ref: '#/components/responses/CloudRuntimeUnavailable'}

  /api/cloud-billing/topups:
    get:
      operationId: listCloudBillingTopups
