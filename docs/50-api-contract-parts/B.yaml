          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ComposioConnection'}
        "503": {description: интеграция не включена}

  /api/integrations/composio/connections/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    delete:
      operationId: deleteComposioConnection
      tags: [Integrations]
      summary: Отключить Composio-подключение
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [any-authenticated]
      responses:
        "204": {description: Отключено}
        "404": {$ref: '#/components/responses/NotFound'}
        "502": {description: сбой Composio}
        "503": {description: интеграция не включена}

  # ===========================================================================
  # /api/invitations/** (личные приглашения вызывающего пользователя)
  # ===========================================================================
  /api/invitations:
    get:
      operationId: listMyInvitations
      tags: [Invitations]
      summary: Мои ожидающие приглашения (по user_id и по email)
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [any-authenticated]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/WorkspaceInvitation'}

  /api/invitations/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getMyInvitation
      tags: [Invitations]
      summary: Получить приглашение по id
      description: 403, если приглашение адресовано не вызывающему (ни по user_id, ни по email).
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [any-authenticated]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceInvitation'}
        "403":
          description: code=invitation_not_yours
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "404":
          description: code=invitation_not_found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/invitations/{id}/accept:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: acceptInvitation
      tags: [Invitations]
      summary: Принять приглашение
      description: >
        Требует статус pending и непросроченный срок действия. Создаёт
        членство с ролью из приглашения, отмечает пользователя онбордингнутым
        при первом принятии (влияет на аналитику онбординга), публикует
        member.added и invitation.accepted, уведомляет десктоп-раннеры.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [any-authenticated]
      responses:
        "200":
          description: OK — возвращает членство приглашённого
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceMemberWithUser'}
        "400":
          description: code=invitation_not_pending
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "403":
          description: code=invitation_not_yours
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "404":
          description: code=invitation_not_found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "409":
          description: code=already_member_self
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "410":
          description: code=invitation_expired
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/invitations/{id}/decline:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: declineInvitation
      tags: [Invitations]
      summary: Отклонить приглашение
      description: Публикует invitation.declined.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [any-authenticated]
      responses:
        "204": {description: Отклонено}
        "400":
          description: code=invitation_not_pending
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "403":
          description: code=invitation_not_yours
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "404":
          description: code=invitation_not_found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  # ===========================================================================
  # /api/tokens/** (личные PAT вызывающего)
  # ===========================================================================
  /api/tokens:
    get:
      operationId: listPersonalAccessTokens
      tags: [Tokens]
      summary: Список личных токенов доступа (PAT) вызывающего
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [any-authenticated]
      x-rate-limit: "20 запросов/час на пользователя или IP (общий бюджет группы /api/tokens/**)"
      responses:
        "200":
          description: OK — значения токенов не возвращаются, только префикс
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PersonalAccessToken'}
    post:
      operationId: createPersonalAccessToken
      tags: [Tokens]
      summary: Создать личный токен доступа
      description: Токен в открытом виде возвращается один раз и не хранится.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [any-authenticated]
      x-rate-limit: "20 запросов/час на пользователя или IP"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreatePersonalAccessTokenRequest'}
      responses:
        "201":
          description: Создан
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreatePersonalAccessTokenResponse'}
        "400":
          description: name пуст
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/tokens/current/renew:
    post:
      operationId: renewCurrentPersonalAccessToken
      tags: [Tokens]
      summary: Продлить срок действия PAT, которым выполнен текущий запрос
      description: >
        Работает только если запрос аутентифицирован PAT-токеном в заголовке
        Authorization (не сессионной cookie). Продление происходит только если
        до истечения осталось ≤ 7 дней (иначе renewed:false и текущая дата
        истечения без изменений); продлевает ещё на 90 дней. Бессрочный токен
        всегда отвечает renewed:false, expires_at:"".
      security: [{bearerAuth: []}]
      x-roles: [any-authenticated]
      x-rate-limit: "20 запросов/час на пользователя или IP"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RenewPersonalAccessTokenResponse'}
        "400":
          description: запрос выполнен не PAT-токеном
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "401":
          description: токен более не действителен или принадлежит другому пользователю
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/tokens/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    delete:
      operationId: revokePersonalAccessToken
      tags: [Tokens]
      summary: Отозвать личный токен доступа
      description: Идемпотентно — 204 и в случае, если токен уже не существует/не принадлежит вызывающему.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [any-authenticated]
      x-rate-limit: "20 запросов/час на пользователя или IP"
      responses:
        "204": {description: Отозван (или уже не существовал)}

  # ===========================================================================
  # /api/cloud-billing/** — все ручки прозрачно проксируют облачный биллинг-сервис
  # ===========================================================================
  /api/cloud-billing/balance:
    get:
      operationId: getCloudBillingBalance
      tags: [CloudBilling]
      summary: Баланс вызывающего пользователя в облачном биллинге
      description: >
        Прокси к внешнему биллинговому сервису (cloud runtime); тело и код
        ответа ретранслируются как есть. 503, если облачный рантайм не
        подключён на этом деплое.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [any-authenticated]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingBalance'}
        "503": {$ref: '#/components/responses/CloudRuntimeUnavailable'}
        "502": {$ref: '#/components/responses/CloudRuntimeBadGateway'}
        "504": {$ref: '#/components/responses/CloudRuntimeTimeout'}

  /api/cloud-billing/transactions:
    get:
      operationId: listCloudBillingTransactions
      tags: [CloudBilling]
      summary: История транзакций баланса
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [any-authenticated]
      parameters:
        - {name: page, in: query, schema: {type: integer}}
        - {name: page_size, in: query, schema: {type: integer}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingTransactionsPage'}
        "503": {$ref: '#/components/responses/CloudRuntimeUnavailable'}

  /api/cloud-billing/batches:
    get:
      operationId: listCloudBillingBatches
      tags: [CloudBilling]
      summary: Список пакетов начислений (batches), из которых списывается баланс
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [any-authenticated]
      parameters:
