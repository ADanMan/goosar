openapi: 3.1.0
info:
  title: Goosar API — часть B (рабочие пространства, интеграции, деплой-администрирование)
  version: "1.0.0"
  description: >
    Фрагмент контракта. Покрывает /api/workspaces/**, /api/slack/binding/redeem,
    /api/integrations/composio/**, /api/invitations/** (личные), /api/tokens/**,
    /api/cloud-billing/**, /api/deployment/**, /api/assignee-frequency, /api/status,
    /api/provisioning/**, /api/workspace-config/**, /api/workspace-mcp-servers/**,
    /api/deployment-mcp-servers/**, /api/deployment-policy, /api/effective-config,
    /api/llm/health. Общие схемы (Error, User, Workspace, Member) и security schemes
    определяются в другом фрагменте контракта и здесь только referenced.

paths:
  # ===========================================================================
  # /api/workspaces/**
  # ===========================================================================
  /api/workspaces:
    get:
      operationId: listWorkspaces
      tags: [Workspaces]
      summary: Список рабочих пространств текущего пользователя
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [any-authenticated]
      responses:
        "200":
          description: Список пространств, где вызывающий состоит участником
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/WorkspaceItem'}
        "401": {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createWorkspace
      tags: [Workspaces]
      summary: Создать рабочее пространство
      description: >
        Требует человека-инициатора (не задача-агент и не облачный PAT), кроме случая,
        когда создание пространств для обычных пользователей отключено настройкой
        деплоя — тогда создать пространство в обход отключения может только
        deployment-admin (это действие пишется в admin-аудит отдельным событием
        обхода до валидации тела запроса).
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [any-authenticated]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateWorkspaceRequest'}
      responses:
        "201":
          description: Пространство создано, вызывающий стал его владельцем (owner)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceItem'}
        "400": {$ref: '#/components/responses/BadRequest'}
        "403":
          description: >
            Создание пространств отключено для обычных пользователей на этом
            деплое (code=workspace_creation_disabled), либо инициатор не человек
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "409":
          description: slug уже занят (code=workspace_slug_taken)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/workspaces/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getWorkspace
      tags: [Workspaces]
      summary: Получить рабочее пространство по id
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceItem'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
    put:
      operationId: replaceWorkspace
      tags: [Workspaces]
      summary: Заменить редактируемые поля пространства (полная форма)
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateWorkspaceRequest'}
      responses:
        "200":
          description: >
            Обновлено. Публикует realtime-событие workspace.updated в канал
            пространства; если менялось имя — дополнительно уведомляет фоновые
            десктоп-раннеры всех участников о смене списка пространств
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceItem'}
        "400": {$ref: '#/components/responses/BadRequest'}
        "403": {$ref: '#/components/responses/Forbidden'}
    patch:
      operationId: updateWorkspace
      tags: [Workspaces]
      summary: Частично обновить пространство (то же поведение, что PUT)
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateWorkspaceRequest'}
      responses:
        "200":
          description: Обновлено (см. побочные эффекты PUT)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceItem'}
        "400": {$ref: '#/components/responses/BadRequest'}
        "403": {$ref: '#/components/responses/Forbidden'}
    delete:
      operationId: deleteWorkspace
      tags: [Workspaces]
      summary: Удалить рабочее пространство целиком
      description: >
        Необратимо удаляет пространство и каскадно связанные записи (в т.ч.
        чат-сессии и закреплённых агентов чата) в одной транзакции с построчной
        блокировкой. Публикует workspace.deleted и уведомляет десктоп-раннеры
        всех бывших участников.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner]
      responses:
        "204": {description: Удалено}
        "403": {$ref: '#/components/responses/Forbidden'}

  /api/workspaces/{id}/capabilities:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getWorkspaceCapabilities
      tags: [Workspaces]
      summary: Витрина возможностей и примеров задач для шаблона роли пространства
      description: >
        Если у пространства нет привязанного шаблона роли (template_key) или он
        отключён — возвращает пустой набор с кодом 200, а не ошибку. Тексты
        локализуются по заголовку Accept-Language и языку пользователя.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceCapabilities'}

  /api/workspaces/{id}/members:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: listWorkspaceMembersWithUser
      tags: [Workspaces]
      summary: Список участников пространства с данными пользователя
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/WorkspaceMemberWithUser'}
    post:
      operationId: inviteWorkspaceMember
      tags: [Workspaces]
      summary: Пригласить пользователя по email в пространство
      description: >
        Роль owner в приглашении запрещена (только member/admin). Если у email
        уже есть неистёкшее pending-приглашение в это пространство — 409; если
        человек уже участник — 409. При наличии почтового сервиса отправляет
        письмо-приглашение асинхронно (ошибка отправки только логируется, ответ
        API не меняется). Публикует invitation.created в канал пространства.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InviteWorkspaceMemberRequest'}
      responses:
        "201":
          description: Приглашение создано (статус pending)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceInvitation'}
        "400": {$ref: '#/components/responses/BadRequest'}
        "409":
          description: >
            code=already_member — приглашаемый уже участник; либо
            code=invitation_already_pending — уже есть активное приглашение
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/workspaces/{id}/members/{memberId}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: memberId, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      operationId: updateWorkspaceMember
      tags: [Workspaces]
      summary: Изменить роль и/или доступ к периметру участника
      description: >
        Нужно передать хотя бы одно из полей role/perimeter_access. Понижение
        или назначение роли owner, а также любое изменение участника с ролью
        owner, разрешено только вызывающему с ролью owner. Нельзя понизить
        последнего owner (в пространстве должен остаться хотя бы один).
        Инвалидирует кэш членства и публикует member.updated.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateWorkspaceMemberRequest'}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceMemberWithUser'}
        "400":
          description: role/perimeter_access отсутствуют, роль невалидна, либо
            нарушено правило «минимум один owner»
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
    delete:
      operationId: removeWorkspaceMember
      tags: [Workspaces]
      summary: Удалить участника из пространства
      description: >
        Удаление участника с ролью owner разрешено только другому owner и
        только если после удаления останется хотя бы один owner. Отзывает все
        живые сессии/токены удаляемого в этом пространстве, закрывает его
        реалтайм-подключения, публикует member.removed и уведомляет десктоп-
        раннеры удалённого пользователя об изменении списка пространств.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin]
      responses:
        "204": {description: Удалено}
        "400":
          description: нарушено правило «минимум один owner»
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}

  /api/workspaces/{id}/leave:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: leaveWorkspace
      tags: [Workspaces]
      summary: Выйти из пространства самому
      description: >
        Owner не может выйти, если он последний owner. Побочные эффекты — как
        у удаления участника (отзыв доступа, member.removed, уведомление
        десктоп-раннеров).
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member]
      responses:
        "204": {description: Вышел из пространства}
        "400":
          description: вызывающий — последний owner
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/workspaces/{id}/invitations:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: listWorkspaceInvitations
      tags: [Workspaces]
      summary: Список ожидающих приглашений пространства
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/WorkspaceInvitation'}

  /api/workspaces/{id}/invitations/{invitationId}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: invitationId, in: path, required: true, schema: {type: string, format: uuid}}
    delete:
      operationId: revokeWorkspaceInvitation
      tags: [Workspaces]
      summary: Отозвать ожидающее приглашение
      description: Публикует invitation.revoked. 404, если приглашение не найдено,
        принадлежит другому пространству, или уже не в статусе pending.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin]
      responses:
        "204": {description: Отозвано}
        "404":
          description: code=invitation_not_found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/workspaces/{id}/github/installations:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: listWorkspaceGitHubInstallations
      tags: [Workspaces, Integrations]
      summary: Список установок GitHub App у пространства
      description: >
        Поле installation_id виден только owner/admin (для остальных участников
        маскируется в null). can_manage в ответе отражает это.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GitHubInstallationsResponse'}

  /api/workspaces/{id}/github/connect:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getGitHubConnectUrl
      tags: [Workspaces, Integrations]
      summary: Получить URL установки GitHub App для этого пространства
      description: >
        Если GitHub-интеграция не настроена на деплое (нет app slug/webhook
        secret) — возвращает configured:false и пустой url вместо ошибки.
        Параметр return_to (github|repositories) кодируется в подписанный
        state-токен, который сверяется при обратном редиректе.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin]
      parameters:
        - name: return_to
          in: query
          required: false
          schema: {type: string, enum: [github, repositories]}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GitHubConnectResponse'}
        "400":
          description: return_to не входит в допустимый список
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/workspaces/{id}/github/installations/{installationId}/repositories:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: installationId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: listGitHubInstallationRepositories
      tags: [Workspaces, Integrations]
      summary: Список репозиториев, видимых установке GitHub App (проксирует GitHub API)
      description: >
        Требует отдельно настроенных учётных данных GitHub App для просмотра
        репозиториев (иначе 503). Постранично, page/per_page.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin]
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 100000, default: 1}}
        - {name: per_page, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GitHubRepositoriesResponse'}
        "404":
          description: установка не найдена в этом пространстве
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "502":
          description: сбой при обращении к GitHub API
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "503":
          description: просмотр репозиториев не настроен на деплое
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    delete:
      operationId: deleteGitHubInstallation
      tags: [Workspaces, Integrations]
      summary: Отключить установку GitHub App от пространства
      description: Публикует github.installation.deleted.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin]
      responses:
        "204": {description: Удалено}

  /api/workspaces/{id}/vcs/connections:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: listWorkspaceVcsConnections
      tags: [Workspaces, Integrations]
      summary: Список подключений self-hosted VCS (GitLab/Bitbucket и т.п.)
      description: >
        Если интеграция VCS выключена на деплое — возвращает available:false и
        пустой список вместо ошибки.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VcsConnectionsResponse'}
    post:
      operationId: connectVcs
      tags: [Workspaces, Integrations]
      summary: Подключить self-hosted VCS-инстанс по персональному токену
      description: >
        Токен доступа проверяется у самого провайдера перед сохранением.
        instance_url нормализуется и должен быть абсолютным http(s) URL.
        Токен и вебхук-секрет хранятся запечатанными; вебхук-секрет
        возвращается в ответе один раз и больше не читается. Публикует
        vcs.connection.created.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConnectVcsRequest'}
      responses:
        "200":
          description: Подключено (или обновлено — upsert по паре provider+instance_url)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VcsConnectResponse'}
        "400":
          description: провайдер не поддерживается, обязательные поля пусты,
            instance_url не абсолютный http(s), либо провайдер отверг токен
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "502":
          description: инстанс провайдера недоступен
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "503":
          description: VCS-интеграция не настроена на деплое (нет ключа шифрования)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/workspaces/{id}/vcs/connections/{connectionId}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: connectionId, in: path, required: true, schema: {type: string, format: uuid}}
    delete:
      operationId: deleteVcsConnection
      tags: [Workspaces, Integrations]
      summary: Удалить подключение VCS
      description: Публикует vcs.connection.deleted.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin]
      responses:
        "204": {description: Удалено}

  /api/workspaces/{id}/vcs/connections/{connectionId}/rotate-webhook:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: connectionId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: rotateVcsConnectionWebhook
      tags: [Workspaces, Integrations]
      summary: Перевыпустить вебхук-секрет подключения
      description: >
        Старый секрет перестаёт приниматься сразу. Новый секрет возвращается в
        ответе один раз. Публикует vcs.connection.created (то же событие, что
        при первичном подключении).
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VcsConnectResponse'}
        "404":
          description: подключение не найдено в этом пространстве
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "503":
          description: VCS-интеграция не настроена
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/workspaces/{id}/runtime-profiles:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: listRuntimeProfiles
      tags: [Workspaces, RuntimeProfiles]
      summary: Список профилей рантайма пространства
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuntimeProfilesResponse'}
    post:
      operationId: createRuntimeProfile
      tags: [Workspaces, RuntimeProfiles]
      summary: Создать профиль рантайма
      description: >
        command_name — одиночный исполняемый токен без пробелов (аргументы —
        в fixed_args). protocol_family должен быть одним из поддерживаемых
        типов агентского протокола. display_name уникален в пределах
        пространства. Уведомляет привязанные десктоп-раннеры об изменении
        профилей и публикует daemon.register.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRuntimeProfileRequest'}
      responses:
        "201":
          description: Создан
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuntimeProfile'}
        "400": {$ref: '#/components/responses/BadRequest'}
        "409":
          description: display_name уже занят в пространстве
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/workspaces/{id}/runtime-profiles/{profileId}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: profileId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getRuntimeProfile
      tags: [Workspaces, RuntimeProfiles]
      summary: Получить профиль рантайма
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuntimeProfile'}
        "404": {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateRuntimeProfile
      tags: [Workspaces, RuntimeProfiles]
      summary: Частично обновить профиль рантайма
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateRuntimeProfileRequest'}
      responses:
        "200":
          description: Обновлено; уведомляет раннеры и публикует daemon.register
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuntimeProfile'}
        "400": {$ref: '#/components/responses/BadRequest'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409":
          description: display_name уже занят
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    put:
      operationId: replaceRuntimeProfile
      tags: [Workspaces, RuntimeProfiles]
      summary: То же самое, что PATCH (тот же обработчик, оба метода маршрутизированы на одну операцию)
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateRuntimeProfileRequest'}
      responses:
        "200":
          description: Обновлено
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuntimeProfile'}
        "400": {$ref: '#/components/responses/BadRequest'}
        "404": {$ref: '#/components/responses/NotFound'}
    delete:
      operationId: deleteRuntimeProfile
      tags: [Workspaces, RuntimeProfiles]
      summary: Удалить профиль рантайма
      description: >
        Отказывает 409, если на профиле ещё есть активные (неархивные) агенты.
        Если у профиля есть рантаймы с архивными агентами, задействованными
        как лидеры активных отрядов — тоже 409 с указанием переназначить
        лидера. При успехе каскадно подчищает связанные с архивными агентами
        отряды, назначения инструментов, каналы и черновики чата в одной
        транзакции, затем удаляет сами инстансы рантайма и профиль. Уведомляет
        раннеры и публикует daemon.register с deleted_runtime_profile_id.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin]
      responses:
        "204": {description: Удалено}
        "404": {$ref: '#/components/responses/NotFound'}
        "409":
          description: есть активные агенты на профиле, либо активные отряды с
            архивным лидером на одном из его рантаймов
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/workspaces/{id}/export:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: startWorkspaceExport
      tags: [Workspaces, Export]
      summary: Запустить полную выгрузку данных пространства
      description: >
        Асинхронно; создаёт job и сразу отвечает 202, сама сборка архива идёт
        в фоне (таймаут настраивается деплоем, по умолчанию 2 часа). Только
        один активный экспорт на пространство одновременно (409 при попытке
        запустить второй). Пишет запись в admin-аудит (workspace.export) сразу
        при запуске, до завершения сборки. Требует настроенного файлового
        хранилища для вложений — иначе 503.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner]
      responses:
        "202":
          description: Job создан, статус pending/running
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceExportJob'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "409":
          description: экспорт этого пространства уже выполняется
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "503":
          description: не настроено файловое хранилище
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/workspaces/{id}/export/{jobId}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: jobId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getWorkspaceExport
      tags: [Workspaces, Export]
      summary: Статус job'а экспорта
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceExportJob'}
        "404": {$ref: '#/components/responses/NotFound'}

  /api/workspaces/{id}/export/{jobId}/download:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: jobId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: downloadWorkspaceExport
      tags: [Workspaces, Export]
      summary: Скачать готовый архив экспорта (tar.gz)
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner]
      responses:
        "200":
          description: Поток application/gzip, Content-Disposition attachment
          content:
            application/gzip:
              schema: {type: string, format: binary}
        "404": {$ref: '#/components/responses/NotFound'}
        "409":
          description: job ещё не завершён успешно — архива нет
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "410":
          description: архив был на диске, но уже удалён (истекло хранение)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/workspaces/{id}/slack/installations:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: listSlackInstallations
      tags: [Workspaces, Integrations]
      summary: Список Slack-установок пространства
      description: Если Slack-интеграция не настроена на деплое — configured:false, install_supported:false, пустой список (не ошибка).
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [member]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SlackInstallationsResponse'}

  /api/workspaces/{id}/slack/installations/{installationId}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: installationId, in: path, required: true, schema: {type: string, format: uuid}}
    delete:
      operationId: revokeSlackInstallation
      tags: [Workspaces, Integrations]
      summary: Отозвать Slack-установку
      description: Публикует slack.installation.revoked.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin]
      responses:
        "204": {description: Отозвана}
        "404": {$ref: '#/components/responses/NotFound'}
        "503":
          description: Slack-интеграция не настроена
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/workspaces/{id}/slack/install/byo:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: registerSlackBotYourOwnApp
      tags: [Workspaces, Integrations]
      summary: Подключить собственное Slack-приложение (bring-your-own) к агенту
      description: >
        agent_id передаётся query-параметром, должен существовать в этом
        пространстве. Проверяет bot-токен и app-level токен у самого Slack.
        Один и тот же Slack team не может быть привязан дважды в разных местах
        (409 с уточнением — к другому агенту, к архивному агенту или к другому
        пространству). Публикует slack.installation.created.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [owner, admin]
      parameters:
        - {name: agent_id, in: query, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterSlackBotRequest'}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SlackInstallation'}
        "400":
          description: bot_token/app_token невалидны или не совпадают друг с
            другом
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "404":
          description: агент не найден в этом пространстве
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "409":
          description: эта Slack-команда уже привязана в другом месте
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "503":
          description: Slack-интеграция не настроена
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  # ===========================================================================
  # /api/slack/binding/redeem
  # ===========================================================================
  /api/slack/binding/redeem:
    post:
      operationId: redeemSlackBindingToken
      tags: [Integrations]
      summary: Привязать Slack-аккаунт вызывающего по одноразовому токену
      description: >
        Токен выдаётся Slack-ботом (slash-команда бота) и одноразовый.
        Привязка отказывает, если аккаунт Slack уже привязан к другому
        пользователю, или если вызывающий не участник соответствующего
        пространства.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      x-roles: [any-authenticated]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace_id: {type: string, format: uuid}
                  installation_id: {type: string, format: uuid}
                  slack_user_id: {type: string}
        "400": {$ref: '#/components/responses/BadRequest'}
        "403":
          description: вызывающий не участник пространства установки
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "409":
          description: этот Slack-аккаунт уже привязан к другому пользователю
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "410":
          description: токен недействителен или истёк
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  # ===========================================================================
