      summary: Создать агента
      description: '`runtime_id` обязателен и должен быть агент-рантаймом воркспейса, доступным вызывающему
        (приватный рантайм — только его владельцу или админу); провайдер рантайма должен быть разрешён
        политикой воркспейса. `visibility`/`permission_mode`+`invocation_targets` задают права вызова
        агента (см. C.md, «Модель прав вызова агента»); `visibility` — устаревший алиас над `permission_mode`.
        `mcp_config`, если передан, валидируется политикой MCP воркспейса и шифруется перед сохранением.
        `skill_ids` — сразу привязываемые навыки (должны принадлежать воркспейсу).

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - member
      parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
      responses:
        '201':
          description: Агент создан
          content:
