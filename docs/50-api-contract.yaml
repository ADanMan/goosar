        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/daemon/heartbeat:
    post:
      operationId: daemonSendHeartbeat
      tags:
      - Daemon
      summary: HTTP heartbeat for a single runtime (poll fallback for daemons not using /api/daemon/ws)
      description: 'Refreshes liveness/last-seen and returns any pending out-of-band work for the runtime:
        a CLI self-update, a model-list probe request, a local-skills probe request, or a local-skill
        import request.

