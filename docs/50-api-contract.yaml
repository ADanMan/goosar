      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentFromTemplateRequest'
      responses:
        '201':
          description: Агент создан из шаблона
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAgentFromTemplateResponse'
        '400':
          description: Неизвестный template_slug либо не указан runtime_id/name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Один из навыков шаблона требует источник, не разрешённый политикой сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Один или несколько источников навыков шаблона недоступны
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  failed_urls:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
