      description: 'Обновляет только переданные поля (частичное обновление). Если поле `files` передано
        (даже пустым списком), все существующие файлы навыка удаляются и заменяются переданными; файл
        с зарезервированным путём (SKILL.md) в списке файлов игнорируется — основное содержимое меняется
        только через поле `content`. Если `files` не передано, текущие файлы возвращаются в ответе без
        изменений. Управлять навыком может только его создатель либо owner/admin воркспейса.

