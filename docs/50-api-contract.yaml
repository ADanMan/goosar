              $ref: '#/components/schemas/UpdateRuntimeProfileRequest'
      responses:
        '200':
          description: Обновлено; уведомляет раннеры и публикует daemon.register
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: display_name уже занят
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: replaceRuntimeProfile
      tags:
      - Workspaces
      - RuntimeProfiles
      summary: То же самое, что PATCH (тот же обработчик, оба метода маршрутизированы на одну операцию)
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - owner
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRuntimeProfileRequest'
      responses:
        '200':
          description: Обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deleteRuntimeProfile
      tags:
      - Workspaces
      - RuntimeProfiles
      summary: Удалить профиль рантайма
      description: 'Отказывает 409, если на профиле ещё есть активные (неархивные) агенты. Если у профиля
        есть рантаймы с архивными агентами, задействованными как лидеры активных отрядов — тоже 409 с
        указанием переназначить лидера. При успехе каскадно подчищает связанные с архивными агентами отряды,
        назначения инструментов, каналы и черновики чата в одной транзакции, затем удаляет сами инстансы
        рантайма и профиль. Уведомляет раннеры и публикует daemon.register с deleted_runtime_profile_id.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - owner
      - admin
      responses:
        '204':
          description: Удалено
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: есть активные агенты на профиле, либо активные отряды с архивным лидером на одном
            из его рантаймов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/workspaces/{id}/export:
