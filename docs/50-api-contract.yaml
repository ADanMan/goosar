      summary: Повторно обработать ранее полученную вебхук-доставку
      description: 'Требует право записи на автопилот. Нельзя реплеить доставку, у которой подпись не
        прошла проверку (`signature_status=invalid` или `status=rejected`), у которой нет сохранённого
        тела, либо чей триггер сейчас отключён; автопилот должен быть `active`. Реплей создаёт новую запись
        WebhookDelivery со ссылкой `replayed_from_delivery_id` на исходную и снова прогоняет её через
