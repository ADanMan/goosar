        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-events:
      - name: comment:updated
        payload: '{ comment }'
    delete:
      operationId: deleteComment
      tags:
      - Comments
      summary: Удалить комментарий
      description: 'Только автор или владелец/админ. Удаляет вложения комментария (файлы в хранилище —
        тоже) и отменяет ещё не выполненные задачи агентов, поставленные этим комментарием как триггером;
        для выживших задач (например, уже начавших выполнение) заново прогоняется логика запуска по следующему
        уцелевшему комментарию треда.

        '
