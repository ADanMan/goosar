        '500':
          description: 'frozen legacy path: can fail on internal state this shim no longer accounts for
            (e.g. writing the built-in assistant agent)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/me/onboarding/no-runtime-bootstrap:
    post:
      operationId: meBootstrapOnboardingWithoutRuntime
      tags:
      - Me
      summary: 'Legacy: create a starter issue guiding the user to connect a runtime'
      description: Same legacy status as runtime-bootstrap above.
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles: workspace-member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - workspace_id
              properties:
                workspace_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: created/found starter issue
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace_id:
                    type: string
                    format: uuid
                  issue_id:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: not a workspace member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/cli-token:
    post:
      operationId: meIssueCliToken
      tags:
      - Me
      summary: Issue a fresh session JWT for CLI use (creates a new session row)
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles: any-authenticated-human
      x-rate-limit: 600/min per user (RATE_LIMIT_API); 20/hour per user (RATE_LIMIT_TOKEN)
      responses:
        '200':
          description: token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '403':
          $ref: '#/components/responses/HumanOnly'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/upload-file:
    post:
      operationId: meUploadFile
      tags:
      - Me
      summary: Upload a file (issue/comment/chat attachment, or a bare user upload)
      description: 'Stored under `workspaces/{workspace_id}/...` when a workspace can be resolved from
        `X-Workspace-Slug`/`X-Workspace-ID`/query params (and the caller is a member), otherwise under
        `users/{user_id}/...`. Content type is sniffed and normalized by extension.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles: any-authenticated (workspace-member if a workspace context is supplied)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                issue_id:
                  type: string
                  format: uuid
                comment_id:
                  type: string
                  format: uuid
                chat_session_id:
                  type: string
                  format: uuid
                chat_message_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: stored attachment metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '400':
          description: missing file field, or file too large/invalid multipart form (100 MiB cap)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: workspace context given but caller is not a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: no storage backend configured
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/feedback:
    post:
      operationId: meCreateFeedback
      tags:
      - Me
      summary: Submit free-text in-app feedback
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles: any-authenticated
      x-rate-limit: 600/min per user (RATE_LIMIT_API); 10/hour per user, server-side count check
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - message
              properties:
                message:
                  type: string
                  maxLength: 10000
                url:
                  type: string
                kind:
                  type: string
                  description: defaults to general
                workspace_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  created_at:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          description: too many feedback submissions this hour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/client-usage:
    post:
      operationId: meUpsertClientUsage
      tags:
      - Me
      summary: Record a daily client-usage heartbeat (web/desktop) and, for desktop, an optional local-runtime
        probe result
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles: any-authenticated-human
      x-rate-limit: 600/min per user (RATE_LIMIT_API)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - install_id
              properties:
                install_id:
                  type: string
                  format: uuid
                runtime:
                  type: object
                  description: desktop-only; rejected for web clients
                  required:
                  - probe_result
                  properties:
                    probe_result:
                      type: string
                      enum:
                      - success
                      - error
                    runtime_count:
                      type: integer
                      minimum: 0
                      maximum: 1000
                    provider_summary:
                      type: object
                      additionalProperties:
                        type: integer
                      maxProperties: 32
                    online_count:
                      type: integer
                      minimum: 0
                    offline_count:
                      type: integer
                      minimum: 0
      responses:
        '204':
          description: recorded
        '400':
          description: 'invalid body (unknown fields rejected), invalid client platform/version, runtime
            data sent by a non-desktop client, or inconsistent runtime counts

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: workspace context given but caller is not a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/workspace-templates:
    get:
      operationId: workspaceTemplatesList
      tags:
      - Me
      summary: List the workspace templates enabled on this server (used at workspace-creation time)
      description: Names/descriptions are localized to the caller's language (Accept-Language, falling
        back to the user's stored language, then en/ru).
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles: any-authenticated
      responses:
        '200':
          description: templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceTemplateSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/workspaces:
    get:
      operationId: listWorkspaces
      tags:
      - Workspaces
      summary: Список рабочих пространств текущего пользователя
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - any-authenticated
      responses:
        '200':
          description: Список пространств, где вызывающий состоит участником
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createWorkspace
      tags:
      - Workspaces
      summary: Создать рабочее пространство
      description: 'Требует человека-инициатора (не задача-агент и не облачный PAT), кроме случая, когда
        создание пространств для обычных пользователей отключено настройкой деплоя — тогда создать пространство
        в обход отключения может только deployment-admin (это действие пишется в admin-аудит отдельным
        событием обхода до валидации тела запроса).

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - any-authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '201':
          description: Пространство создано, вызывающий стал его владельцем (owner)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: 'Создание пространств отключено для обычных пользователей на этом деплое (code=workspace_creation_disabled),
            либо инициатор не человек

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: slug уже занят (code=workspace_slug_taken)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/workspaces/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getWorkspace
      tags:
      - Workspaces
      summary: Получить рабочее пространство по id
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - member
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceItem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: replaceWorkspace
      tags:
      - Workspaces
      summary: Заменить редактируемые поля пространства (полная форма)
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - owner
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceRequest'
      responses:
        '200':
          description: 'Обновлено. Публикует realtime-событие workspace.updated в канал пространства;
            если менялось имя — дополнительно уведомляет фоновые десктоп-раннеры всех участников о смене
            списка пространств

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: updateWorkspace
      tags:
      - Workspaces
      summary: Частично обновить пространство (то же поведение, что PUT)
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - owner
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceRequest'
      responses:
        '200':
          description: Обновлено (см. побочные эффекты PUT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deleteWorkspace
      tags:
      - Workspaces
      summary: Удалить рабочее пространство целиком
      description: 'Необратимо удаляет пространство и каскадно связанные записи (в т.ч. чат-сессии и закреплённых
        агентов чата) в одной транзакции с построчной блокировкой. Публикует workspace.deleted и уведомляет
        десктоп-раннеры всех бывших участников.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - owner
      responses:
        '204':
          description: Удалено
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/workspaces/{id}/capabilities:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getWorkspaceCapabilities
      tags:
      - Workspaces
      summary: Витрина возможностей и примеров задач для шаблона роли пространства
      description: 'Если у пространства нет привязанного шаблона роли (template_key) или он отключён —
        возвращает пустой набор с кодом 200, а не ошибку. Тексты локализуются по заголовку Accept-Language
        и языку пользователя.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - member
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceCapabilities'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/workspaces/{id}/members:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listWorkspaceMembersWithUser
      tags:
      - Workspaces
      summary: Список участников пространства с данными пользователя
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - member
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceMemberWithUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: inviteWorkspaceMember
      tags:
      - Workspaces
      summary: Пригласить пользователя по email в пространство
      description: 'Роль owner в приглашении запрещена (только member/admin). Если у email уже есть неистёкшее
        pending-приглашение в это пространство — 409; если человек уже участник — 409. При наличии почтового
        сервиса отправляет письмо-приглашение асинхронно (ошибка отправки только логируется, ответ API
        не меняется). Публикует invitation.created в канал пространства.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - owner
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteWorkspaceMemberRequest'
      responses:
        '201':
          description: Приглашение создано (статус pending)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceInvitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 'code=already_member — приглашаемый уже участник; либо code=invitation_already_pending
            — уже есть активное приглашение

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/workspaces/{id}/members/{memberId}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: memberId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    patch:
      operationId: updateWorkspaceMember
      tags:
      - Workspaces
      summary: Изменить роль и/или доступ к периметру участника
      description: 'Нужно передать хотя бы одно из полей role/perimeter_access. Понижение или назначение
        роли owner, а также любое изменение участника с ролью owner, разрешено только вызывающему с ролью
        owner. Нельзя понизить последнего owner (в пространстве должен остаться хотя бы один). Инвалидирует
        кэш членства и публикует member.updated.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - owner
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceMemberRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMemberWithUser'
        '400':
          description: role/perimeter_access отсутствуют, роль невалидна, либо нарушено правило «минимум
            один owner»
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: removeWorkspaceMember
      tags:
      - Workspaces
      summary: Удалить участника из пространства
      description: 'Удаление участника с ролью owner разрешено только другому owner и только если после
        удаления останется хотя бы один owner. Отзывает все живые сессии/токены удаляемого в этом пространстве,
        закрывает его реалтайм-подключения, публикует member.removed и уведомляет десктоп- раннеры удалённого
        пользователя об изменении списка пространств.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - owner
      - admin
      responses:
        '204':
          description: Удалено
        '400':
          description: нарушено правило «минимум один owner»
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/workspaces/{id}/leave:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: leaveWorkspace
      tags:
      - Workspaces
      summary: Выйти из пространства самому
      description: 'Owner не может выйти, если он последний owner. Побочные эффекты — как у удаления участника
        (отзыв доступа, member.removed, уведомление десктоп-раннеров).

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - member
      responses:
        '204':
          description: Вышел из пространства
        '400':
          description: вызывающий — последний owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/workspaces/{id}/invitations:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listWorkspaceInvitations
      tags:
      - Workspaces
      summary: Список ожидающих приглашений пространства
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - member
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceInvitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/workspaces/{id}/invitations/{invitationId}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    delete:
      operationId: revokeWorkspaceInvitation
      tags:
      - Workspaces
      summary: Отозвать ожидающее приглашение
      description: Публикует invitation.revoked. 404, если приглашение не найдено, принадлежит другому
        пространству, или уже не в статусе pending.
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - owner
      - admin
      responses:
        '204':
          description: Отозвано
        '404':
          description: code=invitation_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/workspaces/{id}/github/installations:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listWorkspaceGitHubInstallations
      tags:
      - Workspaces
      - Integrations
      summary: Список установок GitHub App у пространства
      description: 'Поле installation_id виден только owner/admin (для остальных участников маскируется
        в null). can_manage в ответе отражает это.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - member
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubInstallationsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/workspaces/{id}/github/connect:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getGitHubConnectUrl
      tags:
      - Workspaces
      - Integrations
      summary: Получить URL установки GitHub App для этого пространства
      description: 'Если GitHub-интеграция не настроена на деплое (нет app slug/webhook secret) — возвращает
        configured:false и пустой url вместо ошибки. Параметр return_to (github|repositories) кодируется
        в подписанный state-токен, который сверяется при обратном редиректе.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - owner
      - admin
      parameters:
      - name: return_to
        in: query
        required: false
        schema:
          type: string
          enum:
          - github
          - repositories
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubConnectResponse'
        '400':
          description: return_to не входит в допустимый список
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/workspaces/{id}/github/installations/{installationId}/repositories:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: installationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listGitHubInstallationRepositories
      tags:
