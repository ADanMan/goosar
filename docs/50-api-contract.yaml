  /api/runtimes/{runtimeId}/archive-agents-and-delete:
    post:
      operationId: archiveAgentsAndDeleteRuntime
      summary: Массово архивировать активных агентов runtime и удалить его одной операцией
      description: 'Двухфазное подтверждение: клиент сначала получает 409 от deleteRuntime со списком
        активных агентов, показывает его пользователю и повторяет вызов сюда, передав список ожидаемых
        id активных агентов (`expected_active_agent_ids`). Если фактический набор активных агентов runtime
        изменился с момента показа списка (гонка), запрос отклоняется 409 с кодом `runtime_delete_plan_changed`
        и обновлённым списком — повторное подтверждение обязательно. При успехе: архивирует все совпавшие
        активные агенты, отменяет их задачи и задачи на runtime, останавливает автопилоты с архивными
        исполнителями, зачищает связанные ресурсы (как в deleteRuntime), и удаляет runtime в одной транзакции.

        '
      tags:
      - Runtimes
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: runtimeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      x-roles:
      - owner
      - admin
      - member (только владелец runtime)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - expected_active_agent_ids
              properties:
                expected_active_agent_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      x-events:
      - event: agent:archived
        payload: '{ agent: Agent } — по одному событию на каждого архивированный агент'
      - event: daemon:register
        payload: '{ action: "delete" }'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                  agents_archived:
                    type: integer
                  tasks_cancelled:
                    type: integer
        '400':
          description: expected_active_agent_ids отсутствует или содержит не-UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: runtime не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: runtime порождён профилем, либо фактический набор активных агентов не совпал с
            ожидаемым (code=runtime_delete_plan_changed)
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
