        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferencesInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '400':
          description: preferences отсутствует, либо содержит неизвестную группу или недопустимое значение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
