    post:
      operationId: connectVcs
      tags:
      - Workspaces
      - Integrations
      summary: Подключить self-hosted VCS-инстанс по персональному токену
      description: 'Токен доступа проверяется у самого провайдера перед сохранением. instance_url нормализуется
        и должен быть абсолютным http(s) URL. Токен и вебхук-секрет хранятся запечатанными; вебхук-секрет
        возвращается в ответе один раз и больше не читается. Публикует vcs.connection.created.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - owner
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectVcsRequest'
      responses:
        '200':
          description: Подключено (или обновлено — upsert по паре provider+instance_url)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VcsConnectResponse'
        '400':
          description: провайдер не поддерживается, обязательные поля пусты, instance_url не абсолютный
            http(s), либо провайдер отверг токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: VCS-интеграция выключена на этом деплое (отдельно от отсутствия ключа шифрования
