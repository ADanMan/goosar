            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '403':
          description: Нет доступа к этому приватному агенту
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: updateAgent
      tags:
      - Agents
      summary: Изменить агента
      description: 'Многие поля доступны любому, кто может управлять агентом (владелец агента, либо владелец/админ
        воркспейса), но часть полей — `instructions`, `custom_args`, `runtime_config` (несёт учётные данные
        шлюза), выбор `runtime_id`, права вызова (`permission_mode`/ `invocation_targets`/`visibility`)
        и `composio_toolkit_allowlist` — изменяет только владелец агента; попытка не-владельца реально
        изменить такое поле — 403 (запрос с тем же значением, что уже сохранено, молча игнорируется, а
        не отклоняется). `custom_env` через этот эндпоинт не принимается — только через `PUT /api/agents/{id}/env`.
        Секретные значения `mcp_config`, показанные ранее в маскированном виде, распознаются по спец-маркеру
