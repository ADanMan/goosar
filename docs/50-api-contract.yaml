                $ref: '#/components/schemas/Error'
        '503':
          description: VCS-интеграция не настроена на деплое (нет ключа шифрования)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
