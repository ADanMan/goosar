      summary: Показать, каких агентов запустил бы этот комментарий, без публикации
      description: 'Симулирует определение целей упоминания/маршрутизации комментария (см. C.md, «Правила
        запуска агентов из комментария») для ещё не отправленного или редактируемого (`editing_comment_id`)
        комментария; не создаёт комментарий и не ставит задачи в очередь. Пустой `content` возвращает
        пустой список.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
