        cdn_domain:
          type: string
        cdn_signed:
          type: boolean
        allow_signup:
          type: boolean
        workspace_creation_disabled:
          type: boolean
        daemon_server_url:
          type: string
        daemon_app_url:
          type: string
        vcs_integration_available:
          type: boolean
        posthog_key:
          type: string
        posthog_host:
          type: string
        analytics_environment:
          type: string
        feature_flags:
          type: object
