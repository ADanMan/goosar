                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: updateNotificationPreferences
      summary: Полностью заменить настройки уведомлений
      description: В отличие от PATCH, заменяет весь объект preferences целиком (группы, не перечисленные
        в запросе, теряют сохранённое значение).
      tags:
