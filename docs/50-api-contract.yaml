              description: id of the pending import; pass it back in POST /api/daemon/runtimes/{runtimeId}/local-skills/import/{id}/result
            skill_key:
              type: string
              description: which local skill (by the daemon's own key) the server wants imported
        pending_local_skill_imports:
          type: array
          description: current, possibly-plural form of pending_local_skill_import
          items:
            type: object
            required:
            - id
            - skill_key
            properties:
              id:
                type: string
              skill_key:
                type: string
    ModelEntry:
