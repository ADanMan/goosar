      description: 'Не создаёт задачу синхронно: ставит в очередь фоновую задачу ("quick-create task"),
        которая интерпретирует `prompt` и сама создаёт Issue с нужными полями и запускает на ней агента.
        Требует ровно одно из `agent_id`/`squad_id` (при squad_id используется лидер отряда), агент должен
        быть привязан к runtime и runtime должен быть online; сервер также проверяет минимальную версию
        демона исполнения (иначе 422 `daemon_version_unsupported`), а если runtime недоступен — 422 `agent_unavailable`.

