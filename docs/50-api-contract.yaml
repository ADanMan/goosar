  /api/daemon/runtimes/{runtimeId}/tasks/claim:
    post:
      operationId: daemonClaimTaskForRuntime
      tags:
      - Daemon
      summary: Claim a single queued task for one runtime
      description: 'Requires a client that advertises at least the minimum daemon version (`X-Client-Version`
        header; gate via `RequireMinDaemonVersion`, default minimum from `GOOSAR_MIN_DAEMON_VERSION` or
        the built-in default) — an outdated client gets `426 Upgrade Required`. On success, mints a short-lived
        agent task token (`mat_...`, 24h TTL) returned as `auth_token` inside the task object.

        '
      security:
      - daemonAuth: []
      x-roles: workspace-member (or daemon-token bound to the workspace)
      parameters:
      - in: path
        name: runtimeId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: the claimed task, or `{"task":null}` if nothing is queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    oneOf:
                    - $ref: '#/components/schemas/AgentTask'
                    - type: 'null'
        '404':
          description: runtime not found
        '426':
          $ref: '#/components/responses/DaemonTooOld'
        '500':
          description: runtime owner missing, or claim/token/finalize failure — task is cancelled or requeued
            server-side
        '401':
          $ref: '#/components/responses/Unauthorized'
