      summary: Отредактировать комментарий
      description: 'Только автор комментария или владелец/админ воркспейса. Если `content` реально меняется,
        сервер отменяет все ещё не выполненные задачи агентов, которые были поставлены в очередь именно
        этим комментарием как триггером, и заново прогоняет обновлённый текст через ту же логику определения
        целей, что при создании (см. «Правила запуска агентов из комментария» в C.md) — агентам, чьи задачи
        выжили после отмены (например, уже выполнялись), новый текст передаётся как обновление контекста,
        а не новый запуск. `attachment_ids`, если передан (даже пустой список), полностью заменяет набор
        вложений комментария.

        '
      security:
