      description: 'command_name — одиночный исполняемый токен без пробелов (аргументы — в fixed_args).
        protocol_family должен быть одним из поддерживаемых типов агентского протокола. display_name уникален
        в пределах пространства. Уведомляет привязанные десктоп-раннеры об изменении профилей и публикует
        daemon.register.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
