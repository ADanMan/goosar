      summary: Самостоятельно вступить в открытое ролевое пространство участником
      description: '404, если пространство не помечено открытым для вступления. Если вызывающий уже участник
        — идемпотентно отвечает 200 с already_member:true, без ошибки. Отмечает пользователя онбордингнутым
        при первом вступлении, публикует member.added, уведомляет десктоп-раннеры. Обычный аудит запроса
        (не admin-аудит) — это самообслуживание, а не административное действие.

