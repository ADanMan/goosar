      tags:
      - Workspaces
      - Export
      summary: Запустить полную выгрузку данных пространства
      description: 'Асинхронно; создаёт job и сразу отвечает 202, сама сборка архива идёт в фоне (таймаут
        настраивается деплоем, по умолчанию 2 часа). Только один активный экспорт на пространство одновременно
        (409 при попытке запустить второй). Пишет запись в admin-аудит (workspace.export) сразу при запуске,
        до завершения сборки. Требует настроенного файлового хранилища для вложений — иначе 503.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - owner
      responses:
        '202':
          description: Job создан, статус pending/running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceExportJob'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: экспорт этого пространства уже выполняется
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: не настроено файловое хранилище
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
