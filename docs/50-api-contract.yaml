      tags:
      - Squads
      summary: Записать решение лидера отряда по задаче (взял в работу / не взял / ошибка)
      description: 'Вызывается только самим агентом-лидером отряда, на который назначена задача, и только
        в рамках его собственного активного запуска (заголовок `X-Task-ID` обязателен и должен принадлежать
        этой задаче и этому лидеру); человек или другой агент получит 403. Записывает запись активности
        `squad_leader_evaluated` с исходом (`action`/`no_action`/`failed`) и произвольной причиной.

        '
