  /api/runtimes/{runtimeId}/local-skills/import:
    post:
      operationId: initiateRuntimeLocalSkillImport
      summary: Запросить импорт одного локально найденного навыка в воркспейс
      description: 'В отличие от простого просмотра списка, инициировать импорт может только владелец
        runtime (не любой участник воркспейса), поскольку импорт читает содержимое файлов с машины владельца.
        `action=""` (create, значение по умолчанию) создаёт новый Skill; `action=overwrite` требует `target_skill_id`
        — существующий навык, которым владеет тот же пользователь, и подставляет `supports_conflict=true`
        автоматически.

        '
      tags:
      - Runtimes
      security:
      - cookieAuth: []
      - bearerAuth: []
