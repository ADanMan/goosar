  /api/issues/{id}/comments:
    parameters:
    - $ref: '#/components/parameters/WorkspaceSlugHeader'
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: createIssueComment
      tags:
      - IssueComments
      summary: Добавить комментарий к задаче
      description: '`type` по умолчанию `comment` (другие системные значения:

        `status_change`, `progress_update`, `system` — выставляются сервером

        для автоматических записей, не для этого эндпоинта напрямую).

        `parent_id` делает комментарий ответом в треде; если родитель был

        порождён как триггер для активной задачи агента с уже установленным

        `trigger_comment_id`, ответ обязан быть направлен либо на этот

        триггер-комментарий, либо на один из "коалесцированных" (см. C.md) —

        иначе 409.


        Комментарий, начинающийся с `/note` (без учёта регистра, с любыми

        ведущими пробелами), никогда не запускает агентов — это заметка.


        `suppress_agent_ids` исключает перечисленных агентов из авто-запуска

        по этому конкретному комментарию (например, чтобы явно не разбудить

        одного из нескольких упомянутых).


        Публикация комментария от имени агента отменяет отложенные эскалации

        (deferred escalation) по этой связке задача+агент и может авто-снять

        резолюцию треда, если родительский комментарий был отмечен решённым, а

        кто-то ответил в него.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - member
      - agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Комментарий создан; `trigger_outcomes` показывает, что случилось с каждой целью
            запуска
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueComment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Комментарий-триггер агентской задачи должен быть ответом в её тред, а не новым
            топ-уровневым комментарием
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-events:
      - name: comment:created
        when: всегда при успешном создании
        payload: '{ comment, issue_title, issue_assignee_type, issue_assignee_id, issue_status }'
      - name: task:queued / task:dispatch (через подсистему задач)
        when: комментарий упоминает агента/лидера отряда, является ответом автору предыдущего сообщения
          в треде или продолжает диалог с активным агентом — см. «Правила запуска агентов из комментария»
          в C.md
    get:
      operationId: listIssueComments
      tags:
      - IssueComments
      summary: Список комментариев задачи с гибкой пагинацией/фильтрацией по треду
      description: "Поддерживаемые режимы (взаимно исключающие правила см. ниже):\n\n- без параметров\
        \ — все комментарии задачи (до 2000);\n- `since` (RFC3339) — только созданные после указанного\
        \ момента;\n- `thread=<comment_id>` — все сообщения треда, корень которого —\n  указанный комментарий;\
        \ с `tail=<N>` — только последние N ответов\n  треда плюс корень, с курсором `before`+`before_id`\
        \ для более старых\n  страниц (композитный курсор — оба параметра только вместе);\n- `recent=<N>`\
        \ — N последних *тредов* (по времени последней\n  активности), с тем же курсором `before`+`before_id`\
        \ для более\n  старых тредов;\n- `roots_only=true` — только корневые комментарии (без ответов),\
        \ с\n  `reply_count`/`last_activity_at` в ответе на каждый;\n- `fold=true` — сворачивает решённые\
        \ треды: показывает только\n  корень и его комментарий-резолюцию (если разрешён явным ответом)\
        \ с\n  `folded_count` скрытых сообщений и `thread_resolved: true`; не\n  сочетается с `since`,\
        \ `tail`, `roots_only` (для решённого треда без\n  явной резолюции-ответа остаётся показан целиком).\n\
        - `summary=true` — обрезает `content` каждого комментария до 200\n  символов рун, отмечая `content_truncated:\
        \ true`.\n\nНесовместимые комбинации возвращают 400 (`thread`+`recent`,\n`roots_only` вместе с\
        \ `thread`/`recent`/`tail`/курсором,\n`tail` без `thread`, курсор без `recent` или без `thread`+`tail`).\n"
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - member
      - agent
      parameters:
      - name: since
        in: query
        schema:
          type: string
          format: date-time
      - name: thread
        in: query
        schema:
          type: string
          format: uuid
      - name: recent
        in: query
        schema:
          type: integer
      - name: tail
        in: query
        schema:
          type: integer
      - name: before
        in: query
        schema:
          type: string
          format: date-time
      - name: before_id
        in: query
        schema:
          type: string
          format: uuid
      - name: roots_only
        in: query
        schema:
          type: boolean
      - name: fold
        in: query
        schema:
          type: boolean
      - name: summary
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Список комментариев (плоский массив, не объект); курсор для следующей страницы
            — в заголовках ответа
          headers:
            X-Goosar-Next-Before:
              schema:
                type: string
              description: RFC3339 время для следующей страницы курсора
            X-Goosar-Next-Before-Id:
              schema:
                type: string
              description: ID для следующей страницы курсора
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IssueComment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: thread anchor не найден в этой задаче, либо сама задача не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
