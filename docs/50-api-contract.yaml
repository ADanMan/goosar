components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: goosar_auth
      description: 'HttpOnly session cookie holding an HS256 session JWT (claims: sub, email, name, tv,
        sid, iat, exp). Any state-changing request authenticated by this cookie must also send `X-CSRF-Token`
        (see `goosar_csrf`, a matching non-HttpOnly cookie) — this is enforced centrally, not per endpoint.

        '
    bearerAuth:
      type: http
      scheme: bearer
      description: '`Authorization: Bearer <token>`. Token shape decides how it''s verified: `gsl_...`
        = personal access token (PAT, hash-looked-up, cached); `gsln_...` = cloud PAT, verified against
        the cloud fleet; `mat_...` = short-lived agent task token bound to one task (issued by task-claim
        endpoints); anything else is parsed as an HS256 session JWT (same claims as the cookie).

        '
    daemonAuth:
      type: http
      scheme: bearer
      description: '`Authorization: Bearer <token>`, required on every `/api/daemon/**` route. Accepts,
        in this order: `mdt_...` daemon token (workspace + daemon id baked in, hash-looked-up/cached);
        `gsln_...` cloud PAT; `gsl_...` PAT; otherwise an HS256 session JWT. Whichever path is used, the
        request ends up with an `X-User-ID` (human paths) or a daemon workspace/daemon-id context (daemon-token
        path) used downstream for workspace-scoping checks.

        '
    githubWebhookSignature:
      type: apiKey
      in: header
      name: X-Hub-Signature-256
      description: HMAC-SHA256 of the raw body, keyed with GITHUB_WEBHOOK_SECRET, as `sha256=<hex>`.
    vcsWebhookSignature:
      type: apiKey
      in: header
      name: X-Hub-Signature-256
      description: provider-specific signature verified against the VCS connection's own encrypted-at-rest
        webhook secret.
    stripeWebhookSignature:
      type: apiKey
      in: header
      name: Stripe-Signature
      description: verified by the upstream cloud-runtime billing service, not by this server directly.
    attachmentDownloadTicket:
      type: apiKey
      in: query
      name: token
      description: short-lived HMAC-signed ticket scoped to one attachment id and one user id (see AttachmentDownloadAuth).
  parameters:
    WorkspaceSlugHeader:
      name: X-Workspace-Slug
      in: header
      required: false
      schema:
        type: string
      description: 'Preferred way to select the active workspace on endpoints that need one but don''t
        take it in the path. Resolution order (first present wins): `X-Actor-Source: task_token` → the
        token''s bound `X-Workspace-ID` (client-supplied slug/id headers are ignored in that case); else
        `X-Workspace-Slug` header; else `workspace_slug` query param; else `X-Workspace-ID` header; else
        `workspace_id` query param.

        '
    WorkspaceIdHeader:
      name: X-Workspace-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Fallback workspace selector, used when no slug is given (see WorkspaceSlugHeader for
        the full resolution order).
    DashboardDays:
      name: days
      in: query
      description: Ширина окна в днях (1..365). По умолчанию 30 (90 для usage runtime).
      schema:
        type: integer
        minimum: 1
        maximum: 365
    DashboardTz:
      name: tz
      in: query
      description: IANA-таймзона для группировки по дням/часам. При отсутствии — таймзона профиля пользователя,
        иначе UTC.
      schema:
        type: string
    DashboardProjectId:
      name: project_id
      in: query
      description: Фильтр по проекту (см. схему Project в части C).
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    HumanOnly:
      description: this endpoint is only available to human actors (rejected for task-token and cloud-PAT-derived
        agent/service callers)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DaemonTooOld:
      description: 'the daemon''s reported CLI version (X-Client-Version) is older than the server''s
        configured minimum; body includes `min_daemon_version` and `daemon_version`. Header `X-Min-Daemon-Version`
        is also set.

        '
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string
                const: daemon_too_old
              min_daemon_version:
                type: string
              daemon_version:
                type: string
    Unauthorized:
      description: Не аутентифицирован
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Недостаточно прав
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CloudRuntimeUnavailable:
      description: Облачный рантайм (биллинг) не подключён на этом деплое
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CloudRuntimeBadGateway:
      description: Облачный рантайм ответил ошибкой или недоступен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CloudRuntimeTimeout:
      description: Превышено время ожидания ответа облачного рантайма
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      description: uniform error body written by writeError/writeErrorCode/writeRateLimited across the
        whole API.
      required:
      - error
      properties:
        error:
          type: string
          description: human-readable message
        code:
          type: string
          description: stable machine-readable code, present on most 4xx (e.g. invalid_or_expired_code,
            rate_limited, daemon_too_old); absent on some generic 4xx/5xx
        request_id:
          type: string
          description: echoes X-Request-ID when the server had already set one
    User:
      type: object
      description: The caller's own account.
      required:
      - id
      - name
      - email
      - avatar_url
      - onboarded_at
      - onboarding_questionnaire
      - starter_content_state
      - language
      - profile_description
      - timezone
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        avatar_url:
          type:
          - string
          - 'null'
        language:
          type:
          - string
          - 'null'
          enum:
          - en
          - zh-Hans
          - ko
          - ja
          - ru
          - null
        timezone:
          type:
          - string
          - 'null'
        onboarded_at:
          type:
          - string
          - 'null'
          format: date-time
        onboarding_questionnaire:
          type: object
          additionalProperties: true
        starter_content_state:
          type:
          - string
          - 'null'
        profile_description:
          type: string
          maxLength: 2000
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Workspace:
      type: object
      description: A workspace. Full CRUD lives in a separate section of this contract; included here
        only as the shared shape.
      required:
      - id
      - name
      - slug
      - description
      - context
      - settings
      - repos
      - issue_prefix
      - avatar_url
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type:
          - string
          - 'null'
        context:
          type:
          - string
          - 'null'
        settings:
          type: object
          additionalProperties: true
        repos:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceRepo'
        issue_prefix:
          type: string
        avatar_url:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Member:
      type: object
      description: A bare workspace membership row (see MemberWithUser for the joined form).
      required:
      - id
      - workspace_id
      - user_id
      - role
      - created_at
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - owner
          - admin
          - member
        created_at:
          type: string
          format: date-time
        perimeter_access:
          type: boolean
    WorkspaceRepo:
      type: object
      required:
      - url
      properties:
        url:
          type: string
        description:
          type: string
    ReadinessResponse:
      type: object
      required:
      - status
      - checks
      properties:
        status:
          type: string
          enum:
          - ok
          - not_ready
        checks:
          type: object
          properties:
            db:
              type: string
              enum:
              - ok
              - error
            migrations:
              type: string
              enum:
              - ok
              - out_of_date
              - error
              - unknown
    LoginResult:
      type: object
      description: 'Returned by every login-completing endpoint. Either `token` + `user` are set (session
        started; cookies are also set on this response), or `mfa_required` is true and `mfa_token` must
        be exchanged at POST /api/auth/mfa/verify.

        '
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
        mfa_required:
          type: boolean
        mfa_token:
          type: string
        mfa_enrollment_required:
          type: boolean
          description: the org's MFA policy requires this user to enroll a second factor soon (informational;
            does not block the session).
    MFAVerifyRequest:
      type: object
      required:
      - mfa_token
      properties:
        mfa_token:
          type: string
        code:
          type: string
          description: 6-digit TOTP code (mutually exclusive with recovery_code)
        recovery_code:
          type: string
    AuthMethodsResponse:
      type: object
      required:
      - methods
      properties:
        methods:
          type: array
          items:
            type: string
            enum:
            - email
            - oidc
            - ldap
        oidc_display_name:
          type: string
        ldap_display_name:
          type: string
    MFAStatusResponse:
      type: object
      required:
      - enabled
      - pending_enrollment
      - enabled_at
      - recovery_codes_remaining
      - required
      - available
      properties:
        enabled:
          type: boolean
        pending_enrollment:
          type: boolean
        enabled_at:
          type:
          - string
          - 'null'
          format: date-time
        recovery_codes_remaining:
          type: integer
        required:
          type: boolean
          description: server MFA policy requires this user to enroll
        available:
          type: boolean
          description: GOOSAR_MCP_SECRET_KEY is configured
          so MFA secrets can actually be stored: null
    MFAEnrollResponse:
      type: object
      required:
      - secret
      - otpauth_uri
      - issuer
      - account
      - digits
      - period_seconds
      - algorithm
      properties:
        secret:
          type: string
          description: base32-encoded TOTP secret
        otpauth_uri:
          type: string
        issuer:
          type: string
        account:
          type: string
        digits:
          type: integer
          const: 6
        period_seconds:
          type: integer
          const: 30
        algorithm:
          type: string
          const: SHA1
    MFACodeRequest:
      type: object
      required:
      - code
      properties:
        code:
          type: string
    MFAConfirmResponse:
      type: object
      required:
      - enabled
      - recovery_codes
      properties:
        enabled:
          type: boolean
          const: true
        recovery_codes:
          type: array
          items:
            type: string
          description: 10 one-time codes, shown only in this response.
    SessionResponse:
      type: object
      required:
      - id
      - user_agent
      - created_at
      - last_seen_at
      - current
      properties:
        id:
          type: string
          format: uuid
        user_agent:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        current:
          type: boolean
    AppConfig:
      type: object
