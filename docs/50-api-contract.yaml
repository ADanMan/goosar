      description: 'Участнику-человеку без собственного «личного помощника» сервер может автоматически
        создать его (тихая инициализация); аналогично, если в воркспейсе ещё нет ни одного системного
        ролевого агента — он тоже может быть создан по факту этого запроса. Приватные агенты, к которым
        у вызывающего участника нет прав вызова, из списка исключаются. `mcp_config` и `composio_toolkit_allowlist`
        в каждом элементе маскируются/скрываются по тем же правилам видимости секретов, что и у getAgent.

        '
      security:
