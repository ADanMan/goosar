      - name: agent:created
        payload: '{ agent }'
  /api/agents/{id}:
    parameters:
    - $ref: '#/components/parameters/WorkspaceSlugHeader'
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getAgent
      tags:
      - Agents
      summary: Получить агента целиком
      description: 'Доступ к приватному агенту (не входящему в область видимости вызывающего) — 403. Секреты
        (`mcp_config`, значения окружения, `composio_toolkit_allowlist`) видны в открытом виде только
        владельцу агента (или воркспейсу с настройкой "всегда раскрывать секреты" — тогда и владельцу/админу);
