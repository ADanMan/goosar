  /api/runtimes/{runtimeId}/update:
    post:
      operationId: initiateRuntimeUpdate
      summary: Запросить самообновление daemon-приложения на runtime
      description: 'Ставит асинхронный запрос на обновление в очередь daemon-а (polling через отдельный
        daemon-канал вне этой части спецификации). Отключено (403) на деплоях с периметровым (perimeter)
        профилем поставки — там обновления доставляются оператором. Только владелец runtime или owner/admin
        воркспейса может инициировать обновление. Одновременно на один runtime может быть только один
        необработанный запрос — иначе 409. Запрос считается протухшим и переходит в timeout, если daemon
        не откликнулся за 120 секунд (pending) либо не завершил обновление за 150 секунд после начала
        выполнения (running); истёкшие записи хранятся в памяти сервера ещё 5 минут для чтения через getRuntimeUpdate.

        '
      tags:
      - Runtimes
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: runtimeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      x-roles:
      - owner
      - admin
      - member (только владелец runtime)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - target_version
              properties:
                target_version:
                  type: string
      responses:
        '200':
          description: Запрос поставлен в очередь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeUpdateRequest'
        '400':
          description: target_version отсутствует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: недостаточно прав, либо self-update отключён (perimeter delivery profile)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: runtime не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: для этого runtime уже есть необработанный запрос на обновление
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
