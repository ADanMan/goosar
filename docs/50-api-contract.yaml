  /api/workspace-mcp-servers/{serverId}/credentials:
    parameters:
    - name: serverId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      operationId: setWorkspaceMcpCredentials
      tags:
      - WorkspaceMcp
      summary: Задать свои персональные значения credential-полей MCP-сервера (свой или включённый из
        деплоя)
      description: 'Каждый участник хранит собственные значения отдельно (это не административная настройка
        сервера, а самообслуживание — доступно любому участнику пространства, не только owner/admin, но
        не агенту-актору). Значения объединяются с уже сохранёнными: пустая строка для ключа удаляет его,
        отсутствующий в запросе ключ — сохраняется как был. Отклоняется, если у сервера вообще нет credential_schema
        (400), если ключ не входит в схему, или если значение слишком длинное. Значения запечатываются
        перед сохранением.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - member
      parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetWorkspaceMcpCredentialsRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMcpServer'
        '400':
          description: сервер не запрашивает credential-поля, либо переданы неизвестные ключи/слишком
            длинные значения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: вызывающий — агент-актор
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: сервер не найден в этом пространстве (ни свой, ни включённый из деплоя)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: ключ шифрования не настроен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deleteWorkspaceMcpCredentials
      tags:
      - WorkspaceMcp
      summary: Очистить свои персональные значения credential-полей MCP-сервера
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - member
      parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      responses:
        '200':
          description: OK — сервер с пустыми provided_credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMcpServer'
        '403':
          description: вызывающий — агент-актор
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/deployment-mcp-servers:
    get:
      operationId: listWorkspaceDeploymentMcpServers
      tags:
      - WorkspaceMcp
      - DeploymentMcp
      summary: Список серверов из библиотеки деплоя, доступных пространству, с флагом включения
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - member
      parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeploymentMcpServer'
        '400':
          description: workspace_id не передан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/deployment-mcp-servers/{serverId}/enabled:
    parameters:
    - name: serverId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      operationId: setWorkspaceDeploymentMcpServerEnabled
      tags:
      - WorkspaceMcp
      - DeploymentMcp
      summary: Включить/выключить сервер из библиотеки деплоя для пространства
      description: 'При выключении дополнительно снимает назначения этого сервера у всех агентов пространства
        (иначе они остались бы ссылаться на недоступный сервер). Недоступно агенту-актору.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - owner
      - admin
      parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - enabled
              properties:
                enabled:
                  type: boolean
      responses:
        '204':
          description: Обновлено
        '400':
          description: enabled не передан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: вызывающий — агент-актор, либо не owner/admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: пространство или сервер не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/deployment-policy:
    get:
      operationId: getDeploymentPolicy
      tags:
      - WorkspaceConfig
      summary: Прочитать документ политики деплоя (только для чтения, вход через членство в пространстве)
      description: 'Тот же документ, что у административной ручки GET /api/deployment/policy, но доступ
        определяется тем же правилом, что у /api/workspace-config — owner/admin пространства или deployment-admin.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - owner
      - admin
      - deployment-admin
      parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentPolicyDocument'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/effective-config:
    get:
      operationId: getEffectiveConfigView
      tags:
      - WorkspaceConfig
      summary: Итоговая (эффективная) конфигурация LLM/MCP для пары пространство+пользователь, с признаками
        происхождения и блокировки
      description: 'Показывает результат наложения слоёв политика-деплоя → конфиг-пространства → персональный
        override, с указанием, из какого слоя взято каждое значение (origin) и заблокировано ли оно для
        переопределения ниже (locked). Секретные значения не отдаются — только has_api_key/has_env.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - member
      parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveConfigView'
        '400':
          description: workspace_id не передан/невалиден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: вызывающий не участник пространства
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/deployment/client-secrets:
    get:
      operationId: getDeploymentClientSecrets
      tags:
      - DeploymentAdmin
      summary: Выдать управляемому десктоп-раннеру ключ LLM деплоя и адреса библиотеки MCP вне активной
        задачи
      description: 'Единственный канал получения секретов деплоя раннером в простое (чат-помощник, самопроверка
        при установке); персональные MCP-креды сюда не попадают, только конфигурация уровня деплоя. Доступен
        только инсталляциям, запущенным самим приложением — определяется заголовком X-Goosar-Launched-By:
        desktop (иначе 403 с code=client_secrets_not_managed). Каждая выдача пишется в admin-аудит (deployment.client_secrets.issued)
        со списком выданных полей, но без самих значений.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - any-authenticated
      parameters:
      - name: X-Goosar-Launched-By
        in: header
        required: true
        schema:
          type: string
          enum:
          - desktop
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentClientSecrets'
        '403':
          description: код client_secrets_not_managed — вызов не от управляемой инсталляции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/llm/health:
    get:
      operationId: getLlmHealth
      tags:
      - WorkspaceConfig
      summary: Здоровье сконфигурированного на деплое LLM-эндпоинта (пингует /models)
      description: 'Результат кэшируется на 60 секунд (общий кэш процесса, не привязан к пространству/пользователю).
        unconfigured, если на деплое не заданы base_url/api_key.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - member
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmHealth'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/issues/table/groups:
    post:
      operationId: listIssueTableGroups
      tags:
      - IssueTable
      summary: Сгруппировать задачи для табличного/канбан-представления
      description: 'Возвращает список групп (по статусу, исполнителю, проекту, родителю, значению кастомного
        свойства или составной ключ) с количеством задач в каждой, для последующей постраничной загрузки
        строк через listIssueTableRows. Выполняется в транзакции с REPEATABLE READ, поэтому паджинация
        groups/rows остаётся согласованной в рамках одного запроса пользователя.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - member
      - agent
      parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueTableGroupsRequest'
      responses:
        '200':
          description: Список групп
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueTableGroupsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '504':
          description: Запрос превысил лимит времени (8с); нужно сузить фильтры
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/issues/table/rows:
    post:
      operationId: listIssueTableRows
      tags:
      - IssueTable
      summary: Постранично получить строки (задачи) внутри группы или ветки иерархии
      description: 'Курсорная пагинация по одной группе (group_key) либо по дочерним задачам родителя
        (parent_id) при включённой иерархии (hierarchy.enabled). Курсор непрозрачен и привязан к query_fingerprint
        запроса — курсор, выданный для одного набора фильтров/сортировки, не годится для другого.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - member
      - agent
      parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueTableRowsRequest'
      responses:
        '200':
          description: Страница строк
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueTableRowsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '504':
          description: Таймаут запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/issues/table/facets:
    post:
      operationId: listIssueTableFacets
      tags:
      - IssueTable
      summary: Получить фасеты (счётчики значений) для панели фильтров задач
      description: 'Для каждого запрошенного фасета (status, priority, assignee, creator, project, label,
        property) возвращает список встречающихся значений и количество задач с этим значением при уже
        применённых остальных фильтрах query.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - member
      - agent
      parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueTableFacetsRequest'
      responses:
        '200':
          description: Значения фасетов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueTableFacetsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/issues/search:
    get:
      operationId: searchIssues
      tags:
      - Issues
      summary: Полнотекстовый поиск задач по заголовку, описанию и комментариям
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - member
      - agent
      parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: q
        in: query
        required: true
        schema:
          type: string
        description: Поисковая фраза; поддерживается поиск по номеру/идентификатору задачи (например "ENG-42")
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
          maximum: 50
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      - name: include_closed
        in: query
        schema:
          type: boolean
          default: false
        description: Включать задачи в статусах done/cancelled
      responses:
        '200':
          description: Результаты поиска, отсортированные по релевантности и статусу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchIssuesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          description: Поиск превысил лимит времени БД
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/issues/child-progress:
    get:
      operationId: getChildIssueProgress
      tags:
      - Issues
      summary: Сводка прогресса дочерних задач по родителям в воркспейсе
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - member
      - agent
      parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      responses:
        '200':
          description: Для каждого родителя — всего дочерних и сколько завершено (done/cancelled)
          content:
            application/json:
              schema:
                type: object
                properties:
                  progress:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChildIssueProgressEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/issues/children:
    get:
      operationId: listIssueChildrenByParents
      tags:
      - Issues
      summary: Список дочерних задач для набора родителей одним запросом
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - member
      - agent
      parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: parent_ids
        in: query
        required: false
        schema:
          type: string
        description: Список ID родительских задач через запятую (максимум 200); при пустом значении возвращает
          пустой список
      responses:
        '200':
          description: Список дочерних задач (без учёта, к какому родителю какая относится, кроме поля
            parent_issue_id внутри Issue)
          content:
            application/json:
              schema:
                type: object
                properties:
                  issues:
                    type: array
                    items:
                      $ref: '#/components/schemas/Issue'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/issues/grouped:
    get:
      operationId: listGroupedIssues
      tags:
      - Issues
      summary: Список задач, сгруппированных по исполнителю (устаревший упрощённый вариант IssueTable)
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - member
      - agent
      parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: group_by
        in: query
        schema:
          type: string
          enum:
          - assignee
          default: assignee
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
          maximum: 100
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      - name: statuses
        in: query
        schema:
          type: string
        description: Список статусов через запятую (или устаревший алиас status)
      - name: priorities
        in: query
        schema:
          type: string
      - name: assignee_types
        in: query
        schema:
          type: string
        description: Подмножество {member,agent,squad} через запятую
      - name: assignee_id
        in: query
        schema:
          type: string
          format: uuid
      - name: assignee_ids
        in: query
        schema:
          type: string
      - name: creator_id
        in: query
        schema:
          type: string
          format: uuid
      - name: project_id
        in: query
        schema:
          type: string
          format: uuid
      - name: metadata
        in: query
        schema:
          type: string
        description: JSON-объект {key:value} с примитивными значениями; фильтрует по вхождению (jsonb
          @>)
      - name: properties
        in: query
        schema:
          type: string
        description: JSON-объект {property_definition_id:[values]}; см. ListIssues
      - name: involves_user_id
        in: query
        schema:
          type: string
          format: uuid
        description: Возвращает задачи, назначенные на агентов/отряды, которыми владеет или в которые
          входит указанный участник
      responses:
        '200':
          description: Группы по исполнителю с общим количеством задач в каждой
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupedIssuesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/issues:
    get:
      operationId: listIssues
      tags:
      - Issues
      summary: Список задач воркспейса с фильтрами, сортировкой и пагинацией
      description: 'Основной листинг задач. Без `open_only=true` пагинация — `limit`/`offset`

        (по умолчанию limit=100, максимум 100); с `open_only=true` возвращаются

        все открытые задачи без лимита (используется для лёгких клиентских

        вьюх типа "мои задачи").


        Сортировка (`sort`): `position` (по умолчанию, ASC), `title`,

        `created_at`, `updated_at`, `start_date`, `due_date` (NULLS LAST),

        `status` (по порядку канбан-колонок: backlog, todo, in_progress,

        in_review, done, blocked, cancelled), `priority` (urgent, high, medium,

        low, none), либо `property:<UUID определения свойства>` — сортировка

        по значению кастомного свойства (число/дата/текст сравниваются по

        типу свойства, NULLS LAST). `direction` (`asc`/`desc`) игнорируется

        при сортировке по `position` (там всегда ASC).


        Фильтры комбинируются через AND, кроме списков в одном параметре

        (через запятую или JSON), которые внутри себя — OR:

        `statuses`/`status`, `priorities`/`priority`, `assignee_id`,

        `assignee_ids`, `assignee_types` (только member/agent/squad),

        `assignee_filters` (список `type:id`, например `agent:<uuid>`, плюс

        `include_no_assignee=true` — незакреплённые задачи), `creator_id`,

        `creator_filters` (аналогично assignee_filters), `project_id`,

        `project_ids` + `include_no_project=true`, `label_ids`, `ids` (точный

        набор ID), `top_level_only=true` (только задачи без родителя), `q`

        (простой посимвольный поиск по заголовку и номеру, без ранжирования

        как в /search), `scheduled=true` (есть start_date или due_date),

        `metadata` (JSON-объект, jsonb-containment), `properties` (JSON вида

        `{definition_id:[value,...]}` — между определениями AND, значения

        внутри определения — OR; значение сопоставляется и как скаляр, и как

        элемент multi_select-массива, и как булево при "true"/"false"),

        `date_field` (`created_at`|`updated_at`) + `date_start` + `date_end`

        (RFC3339, все три обязательны вместе, start < end),

        `involves_user_id` (задачи на агентах, которыми владеет пользователь,

        либо на отрядах, где он владелец агента-участника или агента-лидера).

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - member
      - agent
      parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: limit
        in: query
        schema:
          type: integer
          default: 100
          maximum: 100
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      - name: open_only
        in: query
        schema:
          type: boolean
          default: false
      - name: sort
        in: query
        schema:
          type: string
      - name: direction
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: statuses
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
        deprecated: true
      - name: priorities
        in: query
        schema:
          type: string
      - name: priority
        in: query
        schema:
          type: string
        deprecated: true
      - name: assignee_id
        in: query
        schema:
          type: string
          format: uuid
      - name: assignee_ids
        in: query
        schema:
          type: string
      - name: assignee_types
        in: query
        schema:
          type: string
