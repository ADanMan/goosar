            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SkillSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createSkill
      summary: Создать навык вручную
      description: 'Создаёт новый Skill вместе с опциональным набором вспомогательных файлов. Путь каждого
        файла проверяется на отсутствие абсолютных путей и выхода за пределы каталога навыка (`..`). Имя
        навыка уникально в пределах воркспейса.

        '
      tags:
      - Skills
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      x-roles:
      - owner
      - admin
      - member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                description:
                  type: string
                content:
                  type: string
                  description: Содержимое SKILL.md
                config:
                  type: object
                files:
                  type: array
                  items:
                    $ref: '#/components/schemas/SkillFileInput'
      x-events:
      - event: skill:created
