      summary: Прочитать конфиг-слой пространства по его id (административный вход)
      description: 'Тот же обработчик и та же форма ответа, что у /api/workspace-config (см. описание
        ниже) — здесь id пространства берётся из пути, а не из заголовка/query. Каждое чтение через этот
        административный вход (когда вызывающий — deployment-admin, а не owner/admin самого пространства)
        пишет запись в admin-аудит (config.read) с хэшем прочитанного документа.

