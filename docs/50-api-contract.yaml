              $ref: '#/components/schemas/PutProvisioningPinsRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisioningPinsList'
        '400':
          description: package_type/package_name/version невалидны, либо дублирующаяся пара
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/workspace-config:
    get:
      operationId: getWorkspaceConfig
      tags:
      - WorkspaceConfig
      summary: Прочитать конфиг-слой пространства (LLM base_url/model/api_key, MCP-умолчания)
      description: 'Пространство определяется заголовком/query (см. WorkspaceSlugHeader), не путём URL.
        Доступ — owner/admin пространства, либо deployment-admin (в этом случае чтение дополнительно пишется
        в admin-аудит config.read с хэшем документа). has_llm_api_key — булев признак наличия ключа, сам
        ключ никогда не возвращается. mcp_defaults возвращается маскированным: значения env заменены на
        true/false (есть/нет), сами значения не отдаются.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - owner
      - admin
      - deployment-admin
      parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceConfigLayer'
        '400':
          description: workspace_id/slug не переданы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: вызывающий не owner/admin пространства и не deployment-admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: документ запечатан, ключ расшифровки не настроен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: putWorkspaceConfig
      tags:
      - WorkspaceConfig
      summary: Записать конфиг-слой пространства
      description: 'Частичный патч по слою: переданные поля заменяют текущие, отсутствующие не трогаются.
        llm_base_url — обязательно абсолютный http(s) URL (или пустая строка, чтобы очистить), ограничен
        по длине; llm_model ограничен по длине; llm_api_key запечатывается перед сохранением и никогда
        не возвращается открытым текстом. mcp_defaults — JSON-объект {имя_сервера: {enabled?, env?}},
        где env — карта строка→строка|null (null удаляет переменную); документ целиком ограничен по размеру.
        Запись llm_api_key или непустого mcp_defaults требует настроенного ключа шифрования (иначе 503).
        Запись через deployment-admin вход дополнительно пишет workspace_config.set в admin-аудит с хэшами
        до/после.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - owner
      - admin
      - deployment-admin
      parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutWorkspaceConfigRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceConfigLayer'
        '400':
          description: llm_base_url не абсолютный http(s), поле превышает лимит длины, либо mcp_defaults
            превышает лимит размера/не является объектом с полями enabled/env
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: требуется ключ шифрования, который не настроен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
