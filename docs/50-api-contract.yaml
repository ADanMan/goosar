      properties:
        workspace_id:
          type: string
          format: uuid
        daemon_id:
          type: string
        legacy_daemon_ids:
          type: array
          items:
            type: string
        device_name:
          type: string
        cli_version:
          type: string
        launched_by:
          type: string
        runtimes:
