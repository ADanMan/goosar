  /api/tokens:
    get:
      operationId: listPersonalAccessTokens
      tags:
      - Tokens
      summary: Список личных токенов доступа (PAT) вызывающего
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - any-authenticated
      x-rate-limit: 20 запросов/час на пользователя или IP (общий бюджет группы /api/tokens/**)
      responses:
        '200':
          description: OK — значения токенов не возвращаются, только префикс
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonalAccessToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createPersonalAccessToken
      tags:
      - Tokens
      summary: Создать личный токен доступа
      description: Токен в открытом виде возвращается один раз и не хранится.
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - any-authenticated
      x-rate-limit: 20 запросов/час на пользователя или IP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonalAccessTokenRequest'
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePersonalAccessTokenResponse'
        '400':
          description: name пуст
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/tokens/current/renew:
    post:
      operationId: renewCurrentPersonalAccessToken
      tags:
      - Tokens
      summary: Продлить срок действия PAT, которым выполнен текущий запрос
      description: 'Работает только если запрос аутентифицирован PAT-токеном в заголовке Authorization
        (не сессионной cookie). Продление происходит только если до истечения осталось ≤ 7 дней (иначе
        renewed:false и текущая дата истечения без изменений); продлевает ещё на 90 дней. Бессрочный токен
        всегда отвечает renewed:false, expires_at:"".

        '
      security:
      - bearerAuth: []
      x-roles:
      - any-authenticated
      x-rate-limit: 20 запросов/час на пользователя или IP
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenewPersonalAccessTokenResponse'
        '400':
          description: запрос выполнен не PAT-токеном
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: токен более не действителен или принадлежит другому пользователю
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
