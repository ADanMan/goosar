          - 11-50
          - 51-200
          - 201-500
          - 501-1000
          - 1000+
        country_region:
          type: string
          maxLength: 80
        use_case:
          type: string
          enum:
          - evaluate
          - adopt_team
          - self_host
          - integrate
          - partner
          - other
        goals:
          type: string
          maxLength: 2000
        source:
          type: string
        consent_outreach:
          type: boolean
        consent_updates:
          type: boolean
    ContactSalesResponse:
      type: object
      required:
      - id
      - created_at
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    DaemonRegisterRequest:
      type: object
