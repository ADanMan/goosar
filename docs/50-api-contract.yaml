          maxLength: 80
        last_name:
          type: string
          maxLength: 80
        business_email:
          type: string
          format: email
          maxLength: 254
          description: must not be a free-mail domain (gmail.com
          outlook.com: null
          '...)"': null
        company_name:
          type: string
          maxLength: 200
        company_size:
          type: string
          enum:
