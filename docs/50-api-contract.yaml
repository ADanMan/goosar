  /api/deployment/admins:
    get:
      operationId: listDeploymentAdmins
      tags:
      - DeploymentAdmin
      summary: Список держателей роли deployment-admin
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - deployment-admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeploymentAdmin'
        '403':
          description: вызывающий не deployment-admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: requestDeploymentAdminGrant
      tags:
      - DeploymentAdmin
      summary: Заявить о выдаче роли deployment-admin пользователю по email
      description: 'Изменение состава роли — двухканальное: этот вызов лишь заявляет запрос (пишет строку
        в admin-аудит) и отвечает 202 со ссылкой на pending-заявку; применяет её оператор отдельной серверной
        командой вне HTTP API. Если целевой пользователь уже деplоymент-admin — отвечает 200 с его текущей
        записью без создания заявки. Повторная заявка на ту же пару (действие, пользователь) не дублируется
        — возвращается уже существующая.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - deployment-admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: пользователь уже deployment-admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentAdmin'
        '202':
          description: заявка на выдачу роли создана (или уже существовала)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentAdminPendingRequest'
        '400':
          description: email пуст
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: с этим email нет пользователя (роль выдаётся только существующему)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/deployment/admins/{userId}:
    parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    delete:
      operationId: requestDeploymentAdminRevoke
      tags:
      - DeploymentAdmin
      summary: Заявить об отзыве роли deployment-admin
      description: 'Так же двухканально, как выдача — отвечает 202 с заявкой; применяет оператор отдельно.
        Отказывает 409, если это последний deployment-admin (нельзя остаться совсем без администраторов
        деплоя).

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - deployment-admin
      responses:
        '202':
          description: заявка на отзыв создана (или уже существовала)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentAdminPendingRequest'
        '404':
          description: пользователь не является deployment-admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: нельзя отозвать последнего deployment-admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/deployment/admins/pending:
    get:
      operationId: listDeploymentAdminPendingRequests
      tags:
      - DeploymentAdmin
      summary: Список заявок на выдачу/отзыв роли deployment-admin, ждущих подтверждения оператором
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - deployment-admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeploymentAdminPendingRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/deployment/audit:
    get:
      operationId: listDeploymentAudit
      tags:
      - DeploymentAdmin
      summary: Журнал аудита деплоя (admin-действия и auth-события), объединённый и отсортированный
      description: 'Объединяет две ленты — административный журнал (изменения политики, конфигурации,
        состава ролей) и журнал аутентификации (успехи/отказы входа, отзывы сессий) — сортирует по времени
        и курсору. Параметр cursor переключает выдачу в режим "вперёд от курсора" (для live-tail), его
        отсутствие — режим "последние N назад от now/until".

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - deployment-admin
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: action
        in: query
        schema:
          type: string
      - name: actor
        in: query
        schema:
          type: string
        description: UUID актора или произвольная строка (для auth-событий с нечеловеческим актором)
      - name: since
        in: query
        schema:
          type: string
          format: date-time
      - name: until
        in: query
        schema:
          type: string
          format: date-time
      - name: cursor
        in: query
        schema:
          type: string
        description: курсор постраничности, из поля cursor предыдущей записи
      - name: source
        in: query
        schema:
          type: string
          enum:
          - admin
          - auth
          - all
          default: all
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeploymentAuditEntry'
        '400':
          description: limit/since/until/cursor/source не проходят валидацию формата
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/deployment/users/{userId}/deactivate:
    parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: deactivateDeploymentUser
      tags:
      - DeploymentAdmin
      summary: Деактивировать учётную запись пользователя на уровне деплоя
      description: 'Отзывает все личные токены доступа, все токены даемона/раннера, принудительно переводит
        рантаймы пользователя в offline, закрывает его реалтайм-подключения. Нельзя деактивировать себя
        (409). Пишет admin-аудит user.deactivate.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - deployment-admin
      responses:
        '200':
          description: OK — сводка с числом отозванных токенов/подключений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentUser'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: нельзя деактивировать собственную учётную запись
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/deployment/users/{userId}/reactivate:
    parameters:
