            type: string
        allowed_providers:
          type: array
          items:
            type: string
        external_images:
          type: string
          enum:
          - block
          - allowlist
        email_transport:
          type: string
        min_daemon_version:
          type: string
        image_hosts:
          type: array
          items:
            type: string
        deployment_hosts:
          type: object
          additionalProperties:
            type: string
    ContactSalesRequest:
      type: object
