        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - outcome
              properties:
                outcome:
                  type: string
                  enum:
                  - action
                  - no_action
                  - failed
                reason:
                  type: string
      responses:
        '201':
          description: Запись активности создана
          content:
            application/json:
              schema:
