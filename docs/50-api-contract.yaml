  /api/workspace-mcp-servers:
    get:
      operationId: listWorkspaceMcpServers
      tags:
      - WorkspaceMcp
      summary: Список MCP-серверов, видимых пространству (свои плюс включённые из библиотеки деплоя)
      description: 'Объединяет собственные MCP-серверы пространства (source=workspace) и включённые пространством
        серверы библиотеки деплоя (source=deployment, только те, что реально включены). Для каждого сервера
        показывает credential_schema, какие поля вызывающий уже заполнил (provided_credentials) и какие
        обязательные ещё не заполнены (missing_credentials).

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - member
      parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceMcpServer'
        '400':
          description: workspace_id не передан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createWorkspaceMcpServer
      tags:
      - WorkspaceMcp
      summary: Создать собственный MCP-сервер пространства
      description: 'Недоступно агенту-актору (только человеку или сервисному вызову от имени владельца-человека).
        name — только буквы/цифры/дефис/подчёркивание, уникален в пространстве. config — как у серверов
        деплоя (без enabled/disabled и без маркера маски); при непустой credential_schema транспорт должен
        поддерживать env (не http/sse). Требует GOOSAR_MCP_SECRET_KEY.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - owner
      - admin
      parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceMcpServerRequest'
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMcpServer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: вызывающий — агент-актор, либо не owner/admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: пространство не найдено (гонка с удалением пространства)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: имя уже занято в пространстве
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: ключ шифрования не настроен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
