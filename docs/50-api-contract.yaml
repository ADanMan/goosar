        are base64-encoded only when content_encoding=base64 was requested; otherwise they are the raw
        skill text/file bytes.

        '
      properties:
        id:
          type: string
        source:
          type: string
          description: 'where this skill lives: e.g. workspace, agent, builtin'
        name:
          type: string
        description:
          type: string
        hash:
          type: string
          description: content hash the caller used to ask for this bundle
        size_bytes:
          type: integer
        content:
          type: string
        files:
          type: array
          items:
            type: object
            required:
            - path
            - content
            properties:
              path:
                type: string
              content:
                type: string
              sha256:
                type: string
              size_bytes:
                type: integer
    RuntimeLocalMcpServer:
      type: object
      required:
      - name
      - enabled
      description: one MCP server the daemon found configured locally on a runtime, reported by the local-skills
        probe.
      properties:
        name:
          type: string
        transport:
          type: string
          description: e.g. stdio, sse, http
        source:
          type: string
          description: which local config file/mechanism declared this server
        enabled:
          type: boolean
    ReportedLocalSkill:
      type: object
      required:
      - name
      - description
      - content
      - source_path
      - provider
      description: the full content of one local skill the daemon is importing into the workspace's skill
        library.
      properties:
        name:
          type: string
        description:
          type: string
        content:
          type: string
        source_path:
          type: string
          description: path on the daemon's machine the skill was read from
        provider:
          type: string
        files:
          type: array
          items:
            type: object
            required:
            - path
            - content
            properties:
              path:
                type: string
              content:
                type: string
    TaskUsageEntry:
      type: object
      required:
      - model
      - input_tokens
      - output_tokens
      - cache_read_tokens
      - cache_write_tokens
      - cost_usd_ticks
      properties:
        provider:
          type: string
          description: defaults to the task's runtime provider when omitted
        model:
          type: string
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        cache_read_tokens:
          type: integer
        cache_write_tokens:
          type: integer
        cost_usd_ticks:
          type: integer
          description: cost in 1/10000 USD ticks; <=0 means "not authoritative" server-side
    TaskMessageInput:
      type: object
      required:
      - seq
      - type
      properties:
        seq:
          type: integer
        type:
          type: string
          enum:
          - text
          - thinking
          - tool_use
          - tool_result
          - error
        tool:
          type: string
        content:
          type: string
        input:
          type: object
          additionalProperties: true
        output:
          type: string
    WorkspaceTemplateSummary:
      type: object
      required:
      - key
      - name
      - description
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
    TaskAgent:
      type: object
      required:
      - id
      - name
      - instructions
      description: the agent identity and configuration a claimed task runs with.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        instructions:
          type: string
          description: the agent's system prompt / instructions text.
        skills:
          type: array
          items:
            $ref: '#/components/schemas/AgentSkillBundle'
          description: full skill content, sent when the daemon has not advertised the skill-bundles-v1
            capability.
        skill_refs:
          type: array
          items:
            $ref: '#/components/schemas/AgentSkillRef'
          description: skill references (id/source/hash) instead of full content, sent when the daemon
            advertises skill-bundles-v1 — the daemon then resolves each one via POST .../skill-bundles/resolve,
            using its local cache first.
        custom_env:
          type: object
          additionalProperties:
            type: string
          description: extra environment variables to set for the agent's process.
        custom_args:
          type: array
          items:
            type: string
          description: extra command-line arguments to pass to the underlying CLI/runtime.
        mcp_config:
          description: the agent's own MCP server configuration (arbitrary JSON in the shape the target
            runtime's MCP config file expects); merged with the runtime-level MCP policy/overlay before
            use.
          type:
          - object
          - 'null'
          additionalProperties: true
        model:
          type: string
          description: model id override for this agent.
        thinking_level:
          type: string
          description: requested reasoning/thinking effort level, matching one of ModelEntry.thinking.supported_levels.
        service_tier:
          type: string
          description: requested service tier id, matching one of ModelEntry.service_tiers.
        disabled_runtime_skills:
          type: array
          items:
            $ref: '#/components/schemas/DisabledRuntimeSkill'
          description: runtime-local skills this agent has explicitly turned off, so the daemon excludes
            them even though they're present locally.
        runtime_config:
          description: provider-specific runtime configuration blob (e.g. an OpenClaw gateway/mode selection);
            shape depends on runtime provider.
          type:
          - object
          - 'null'
          additionalProperties: true
    AgentSkillRef:
      type: object
      required:
      - id
      - source
      - name
      - hash
      - size_bytes
      - file_count
      description: a pointer to a skill's content, resolved on demand via POST .../skill-bundles/resolve.
      properties:
        id:
          type: string
        source:
          type: string
        name:
          type: string
        description:
          type: string
        hash:
          type: string
          description: content hash; used both as a cache key on the daemon and to ask the server for
            exactly this version.
        size_bytes:
          type: integer
        file_count:
          type: integer
        files:
          type: array
          items:
            type: object
            required:
            - path
            - sha256
            - size_bytes
            properties:
              path:
                type: string
              sha256:
                type: string
              size_bytes:
                type: integer
    TaskConnectedApp:
      type: object
      required:
      - provider
      - server_name
      - toolkit_slug
      properties:
        provider:
          type: string
          description: integration provider, e.g. composio.
        server_name:
          type: string
          description: name to expose this connection under as an MCP server to the agent.
        toolkit_slug:
          type: string
        toolkit_name:
          type: string
    TaskRepo:
      type: object
      required:
      - url
      description: a repository the daemon should make available for the task; like WorkspaceRepo but
        can additionally pin a ref.
      properties:
        url:
          type: string
        description:
          type: string
        ref:
          type: string
          description: branch/tag/commit to check out, when the task pins one; absent means the repo's
            default.
    TaskProjectResource:
      type: object
      required:
      - id
      - resource_type
      - resource_ref
      properties:
        id:
          type: string
          format: uuid
        resource_type:
          type: string
          description: e.g. local_directory — what kind of resource this is.
        resource_ref:
          description: resource-type-specific reference payload (e.g. a local directory descriptor); shape
            depends on resource_type.
          type:
          - object
          - array
          - string
          - 'null'
        label:
          type: string
    TaskChatAttachment:
      type: object
      required:
      - id
      - filename
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        content_type:
          type: string
    TaskCoalescedComment:
      type: object
      required:
      - id
      - content
      properties:
        id:
          type: string
          format: uuid
        thread_id:
          type: string
          format: uuid
        author_type:
          type: string
          enum:
          - member
          - agent
          - system
        author_name:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time
    TaskMcpPolicy:
      type: object
      description: perimeter restrictions on the MCP servers/commands this task's agent may use, merged
        into the agent's own mcp_config on the daemon.
      properties:
        allowed_hosts:
          type: array
          items:
            type: string
        hosts_restricted:
          type: boolean
          description: true means allowed_hosts is an allow-list to enforce, not just informational.
        allowed_commands:
          type: array
          items:
            type: string
        commands_restricted:
          type: boolean
    TaskAttribution:
      type: object
      required:
      - source
      - precise
      description: who/what this task is ultimately attributed to, for audit trails and analytics; not
        consumed by the reference daemon.
      properties:
        source:
          type: string
          description: attribution category, e.g. human, autopilot, agent, system.
        precise:
          type: boolean
          description: whether the attribution is exact rather than a best-effort guess.
        initiator:
          $ref: '#/components/schemas/TaskAttributionUser'
        originator:
          $ref: '#/components/schemas/TaskAttributionUser'
        evidence:
          $ref: '#/components/schemas/TaskEvidence'
        rule_version_id:
          type: string
          format: uuid
          description: automation rule version that produced this task, if any.
        delegated_from_task_id:
          type: string
          format: uuid
        retry_of_task_id:
          type: string
          format: uuid
        rerun_of_task_id:
          type: string
          format: uuid
    TaskAttributionUser:
      type: object
