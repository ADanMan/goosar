        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - server
              - status
              properties:
                server:
                  type: string
                status:
                  type: string
                  description: ok | proxy_unreachable | mcp_failed(<reason>)
      responses:
        '204':
          description: Принято
        '400':
          description: поля server и status пустые, либо status не соответствует допустимому формату
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
