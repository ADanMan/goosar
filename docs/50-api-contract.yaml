      summary: Отметить комментарий (и тем самым его тред) решённым
      description: 'Разрешение треда единственно: если в этом же треде была резолюция на другом комментарии,
        она автоматически снимается (публикуя `comment:unresolved` для неё) в одной транзакции с установкой
        новой.

