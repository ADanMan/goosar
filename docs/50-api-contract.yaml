      - owner
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - skill_key
              properties:
                skill_key:
                  type: string
                  description: ключ локального навыка из ответа initiateRuntimeLocalSkillList
                name:
                  type: string
                description:
                  type: string
                action:
                  type: string
                  enum:
                  - ''
                  - overwrite
                  default: ''
                target_skill_id:
                  type: string
                  format: uuid
                  description: обязателен при action=overwrite
                supports_conflict:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Запрос поставлен в очередь
          content:
            application/json:
              schema:
