        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - runtime_id
              - root
              - key
              - enabled
              properties:
                runtime_id:
                  type: string
                  format: uuid
                root:
                  type: string
                  enum:
                  - provider
                  - universal
                  - plugin
                key:
                  type: string
                  maxLength: 512
                name:
                  type: string
                plugin:
                  type: string
                  description: Обязателен при root=plugin
                  только для провайдера runtime-c: null
                enabled:
                  type: boolean
      responses:
        '204':
          description: Настройка сохранена
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Указанный runtime не найден в воркспейсе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Агент больше не привязан к указанному runtime_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
