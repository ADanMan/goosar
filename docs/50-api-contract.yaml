        '201':
          description: Создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: display_name уже занят в пространстве
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
