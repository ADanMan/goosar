  /api/agent-builder/sessions:
    post:
      operationId: createAgentBuilderSession
      summary: Начать диалоговую сессию конструктора агента
      description: 'Создаёт служебного системного агента "Agent Builder" (kind=system, system_key вида
        agent_builder:<flowId>) и обычную чат-сессию, привязанную к нему. Пользователь далее ведёт диалог
        через обычные чат-эндпоинты (POST /api/chat/sessions/{sessionId}/messages); Agent Builder отвечает
        черновиком конфигурации агента (JSON-блок в тексте ответа), но сам никаких агентов не создаёт
        — это делает клиент отдельным вызовом после подтверждения черновика пользователем. Runtime, на
        котором будет исполняться диалог, должен быть в статусе online и быть публичным либо принадлежать
        вызывающему пользователю (или тот должен быть owner/admin воркспейса).

        '
      tags:
      - AgentBuilder
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      x-roles:
      - owner
      - admin
      - member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - runtime_id
              properties:
                runtime_id:
                  type: string
                  format: uuid
                model:
                  type: string
                  description: Необязательный id модели для стартовой конфигурации диалога
      responses:
        '201':
          description: Сессия конструктора создана
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                    format: uuid
                  builder_agent_id:
                    type: string
                    format: uuid
                  runtime_id:
                    type: string
                    format: uuid
        '400':
          description: runtime_id отсутствует или не UUID / тело запроса некорректно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: runtime приватный и не принадлежит пользователю
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: воркспейс не найден (гонка удаления во время блокировки)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: runtime не в статусе online
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/agent-builder/sessions/{sessionId}/runtime:
    patch:
      operationId: switchAgentBuilderRuntime
      summary: Переключить runtime активной сессии конструктора агента
      description: 'Меняет runtime у системного агента, обслуживающего конкретную сессию Agent Builder.
        Разрешено только пока сессия active и у неё нет незавершённой (pending) задачи — иначе нужно сперва
        остановить текущий ответ. Целевой сессией должен владеть вызывающий пользователь, а её агент обязан
        быть распознан как carrier конструктора (kind=system и system_key с префиксом agent_builder:).

        '
      tags:
      - AgentBuilder
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      x-roles:
      - owner
      - admin
      - member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - runtime_id
              properties:
                runtime_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Runtime переключён
          content:
            application/json:
              schema:
                type: object
                properties:
                  runtime_id:
                    type: string
                    format: uuid
        '400':
          description: runtime_id отсутствует, либо сессия архивная (status != active)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: сессия не найдена / не принадлежит пользователю / не является сессией конструктора
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: у сессии есть незавершённая задача, либо runtime offline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/skills:
    get:
      operationId: listSkills
      summary: Список навыков (skills) воркспейса
      description: Краткие сведения без содержимого SKILL.md (без поля content).
      tags:
      - Skills
      security:
      - cookieAuth: []
      - bearerAuth: []
