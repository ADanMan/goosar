      tags:
      - Agents
      summary: Создать агента из готового шаблона (с набором навыков)
      description: 'Шаблон (`template_slug`) описывает предустановленный набор навыков — часть из них
        поставляется вместе с сервером (vendored), часть подгружается по URL источника при первом использовании
        и затем переиспользуется по имени в рамках воркспейса. Если хотя бы один внешний источник недоступен
        — вся операция отменяется (422 со списком неудачных URL) без создания агента. В остальном поведение
        и права — как у createAgent; `extra_skill_ids` добавляет навыки сверх тех, что несёт сам шаблон.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - member
