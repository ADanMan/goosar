      tags:
      - AgentSkills
      summary: Включить/выключить встроенный навык рантайма (не пользовательский Skill) для агента
      description: 'Отдельный механизм от AgentSkills: относится к навыкам, которые поставляются самим
        исполняемым рантаймом агента (провайдеры `runtime-c`/`runtime-e`, режим `local`), а не к сущностям
        Skill воркспейса. Список выключенных навыков рантайма хранится прямо на агенте (`disabled_runtime_skills`)
        и обнуляется/переоценивается, если агент перепривязан на другой рантайм.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - agent-owner
      - owner
      - admin
      parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
