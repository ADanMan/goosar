      description: 'Применяет `updates` (тот же формат полей, что у PUT /api/issues/{id}) к каждой задаче
        из `issue_ids` независимо; ошибка на одной задаче (не найдена, невалидный assignee, цикл в родителях
        и т.п.) молча пропускает эту задачу и не прерывает обработку остальных. Ответ содержит только
        количество фактически обновлённых задач, без списка причин пропуска. Каждое успешное обновление
        публикует `issue:updated` и, если применимо, может поставить задачу в очередь так же, как обычный
        PUT (если `updates.suppress_run` не true).

