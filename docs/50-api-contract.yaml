  /api/attachments/{id}/download:
    get:
      operationId: attachmentsDownloadById
      tags:
      - Attachments
      summary: Download (or redirect to) an attachment's file
      description: 'Auth is either a normal session (cookie/PAT/JWT — workspace membership on the attachment''s
        workspace is checked and cached), or a short-lived signed `?token=` download ticket minted by
        the API (e.g. embedded in a markdown link) that is scoped to this exact attachment id and a specific
        user. Depending on server config and storage backend, responds with a CloudFront-signed redirect,
        a presigned object-store URL redirect, or streams the file itself (with HTTP Range support).

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      - attachmentDownloadTicket: []
      x-roles: workspace-member (the attachment's workspace), or a valid download ticket for this attachment
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: token
        schema:
          type: string
        description: signed attachment-download ticket (alternative to a session)
      - in: header
        name: Range
        schema:
          type: string
      responses:
        '200':
          description: file bytes (proxy mode)
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '206':
          description: partial content (Range request, proxy mode)
        '302':
          description: redirect to a signed CloudFront/object-store URL
        '401':
          description: not authenticated, or download ticket invalid/expired/for a different attachment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: attachment not found, not a member of its workspace, or storage object missing
        '416':
          description: requested Range not satisfiable
        '503':
          description: storage backend not configured
