          description: what the evidence points at, e.g. comment, webhook_delivery.
        ref_id:
          type: string
          description: id of that referenced record.
    WorkspaceItem:
      description: 'Форма ровно как #/components/schemas/Workspace в общем фрагменте контракта; продублирована
        здесь полями для сверки, а не как отдельная схема — реализатор должен использовать общий Workspace.

