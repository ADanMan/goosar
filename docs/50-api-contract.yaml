        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/daemon/deregister:
    post:
      operationId: daemonDeregisterRuntimes
      tags:
      - Daemon
      summary: Mark runtimes offline
      security:
      - daemonAuth: []
      x-roles: workspace-member (or daemon-token bound to the workspace)
      requestBody:
        required: true
