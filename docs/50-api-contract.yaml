      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: reactivateDeploymentUser
      tags:
      - DeploymentAdmin
      summary: Восстановить деактивированную учётную запись
      description: Пишет admin-аудит user.reactivate.
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - deployment-admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentUser'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/deployment/users/{userId}/revoke-sessions:
    parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: revokeDeploymentUserSessions
      tags:
      - DeploymentAdmin
      summary: Принудительно отозвать все веб-сессии пользователя
      description: 'Инкрементирует версию токена пользователя (мгновенно обесценивает уже выданные сессионные
        JWT) и удаляет хранимые сессии. Не трогает PAT и токены раннера — для этого есть deactivate.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - deployment-admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked:
                    type: integer
                  token_version:
                    type: integer
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/deployment/users/{userId}:
    parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    delete:
      operationId: deleteDeploymentUser
      tags:
      - DeploymentAdmin
      summary: Удалить (анонимизировать) учётную запись пользователя на уровне деплоя
      description: 'Необратимая анонимизация персональных данных (имя заменяется на фиксированную метку-заглушку,
        email/сторонние идентичности/MCP-креды/ уведомления/фидбек стираются), членства во всех пространствах
        удаляются. Затем отзываются все живые токены/подключения — как при деактивации. Нельзя удалить
        себя (409) и нельзя удалить учётную запись, пока она сама deployment-admin — сначала отозвать
        роль (409 с подсказкой). Пишет admin-аудит user.delete.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - deployment-admin
      responses:
        '200':
          description: OK — сводка удаления
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteDeploymentUserResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: попытка удалить себя, либо действующего deployment-admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/deployment/mcp-servers:
    get:
      operationId: listDeploymentMcpServers
      tags:
      - DeploymentMcp
      summary: Библиотека MCP-серверов уровня деплоя
      description: 'Конфигурация каждого сервера (адрес/команда/секреты) запечатана и никогда не отдаётся
        в ответе целиком — только имя, транспорт, схема запрашиваемых у пользователя credential-полей
        и число пространств, включивших сервер.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - deployment-admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeploymentMcpServer'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createDeploymentMcpServer
      tags:
      - DeploymentMcp
      summary: Добавить MCP-сервер в библиотеку деплоя
      description: 'config не может содержать ключи enabled/disabled (включение — прерогатива пространства
        через отдельную ручку) и не может содержать служебный маркер маски. Если объявлена credential_schema
        (поля, которые сервер просит у каждого пользователя), транспорт сервера должен поддерживать переменные
        окружения — http/sse отклоняются (400), т.к. у них нет env-канала для подстановки. Требует GOOSAR_MCP_SECRET_KEY
        на сервере (иначе 503). Пишет admin-аудит deployment_mcp_server.create с хэшем содержимого (само
        содержимое в аудит не попадает).

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - deployment-admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentMcpServerRequest'
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentMcpServer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: имя уже занято
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: ключ шифрования конфигурации не настроен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/deployment/mcp-servers/{serverId}:
    parameters:
    - name: serverId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      operationId: updateDeploymentMcpServer
      tags:
      - DeploymentMcp
      summary: Обновить MCP-сервер библиотеки деплоя
      description: Частичное обновление — поля, не переданные, не меняются. Валидация та же, что при создании.
        Пишет deployment_mcp_server.update.
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - deployment-admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentMcpServerRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentMcpServer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: имя уже занято другим сервером
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deleteDeploymentMcpServer
      tags:
      - DeploymentMcp
      summary: Удалить MCP-сервер из библиотеки деплоя
      description: 'Каскадно снимает включения у всех пространств, отвязывает от всех агентов и стирает
        пользовательские credential-значения для него. Пишет deployment_mcp_server.delete.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - deployment-admin
      responses:
        '204':
          description: Удалён
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/deployment/policy:
    get:
      operationId: getDeploymentPolicyAsAdmin
      tags:
      - DeploymentAdmin
      summary: Прочитать документ политики деплоя (административный вход)
      description: 'Пустая политика (`{}`), если ничего не сохранено. Тот же документ, что отдаёт публичная
        только-для-чтения ручка /api/deployment-policy, но без обязательного членства в конкретном пространстве.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - deployment-admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentPolicyDocument'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: putDeploymentPolicy
      tags:
      - DeploymentAdmin
      summary: Заменить документ политики деплоя целиком
      description: 'Документ — не более 64 КБ, только объект с полями llm/mcp/session (без произвольных
        дополнительных ключей), без полей, похожих на секреты по имени (key/token/secret/password — такие
        отклоняются 400, секреты живут в слоях конфигурации пространства/пользователя, а не в политике).
        Запись "*" в mcp поддерживает только форму `{"enabled": false, "locked": true}` — общий выключатель
        MCP на весь деплой. Пустой объект `{}` допустим и очищает политику. Каждое изменение пишет в admin-аудит
        хэши документа до/после и инвалидирует закэшированные политики сессий.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - deployment-admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - policy
              properties:
                policy:
                  $ref: '#/components/schemas/DeploymentPolicyBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentPolicyDocument'
        '400':
          description: policy пуст/невалиден, превышает лимит, содержит запрещённые/похожие-на-секрет
            поля, либо запись "*" не в канонической форме
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
