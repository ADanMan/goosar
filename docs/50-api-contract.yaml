          application/json:
            schema:
              type: object
              required:
              - runtime_id
              properties:
                runtime_id:
                  type: string
                  format: uuid
                supports_batch_import:
                  type: boolean
      responses:
        '200':
          description: ack with any pending work
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaemonHeartbeatAck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: runtime not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/daemon/ws:
    get:
      operationId: daemonConnect
      tags:
      - Daemon
      summary: Upgrade to the daemon WebSocket (heartbeat push + bidirectional RPC)
      description: 'Full handshake and message protocol documented in A.md (§ "Протокол /api/daemon/ws").
        Query parameters: one or more `runtime_id` (repeatable) or a comma-separated `runtime_ids`; at
        least one runtime id or an authenticated human user identity is required.

        '
      parameters:
      - in: query
        name: runtime_id
        schema:
          type: array
          items:
            type: string
            format: uuid
        style: form
        explode: true
      - in: query
        name: runtime_ids
        schema:
          type: string
          description: comma-separated runtime ids
      security:
      - daemonAuth: []
      x-roles: workspace-member (or daemon-token bound to the workspace)
      responses:
        '101':
          description: switching protocols
        '400':
          description: no runtime_ids and no authenticated user
        '404':
          description: a given runtime does not exist, or belongs to a different daemon
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/daemon/workspaces:
    get:
      operationId: daemonListWorkspaces
      tags:
      - Daemon
      summary: List workspaces visible to the caller (human) or the single bound workspace (daemon token)
      description: Supports conditional GET via `ETag` / `If-None-Match` (weak etag over the response
        body).
      security:
      - daemonAuth: []
      x-roles: any-authenticated (human sees all their workspaces; a daemon-token caller sees only its
        own)
      parameters:
      - in: header
        name: If-None-Match
        schema:
          type: string
      responses:
        '200':
          description: workspaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DaemonWorkspace'
        '304':
          description: not modified
        '401':
          description: daemon workspace identity required (no user id, no daemon token workspace)
        '404':
          description: bound workspace not found
