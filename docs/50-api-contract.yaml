    put:
      operationId: putProvisioningPins
      tags:
      - Provisioning
      summary: Заменить набор закреплений пространства целиком
      description: 'Полная замена — существующие pin''ы пространства удаляются, затем вставляются переданные,
        одной транзакцией. package_type/package_name/ version должны пройти формат-валидацию; для одной
        пары (package_type, package_name) допустима только одна запись (иначе 400 duplicate).

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
