  /api/chat/sessions/{sessionId}/messages:
    post:
      operationId: sendChatMessage
      summary: Отправить сообщение в чат-сессию (запускает задачу агента)
      description: 'Ключевой сценарий: сообщение пользователя создаёт задачу агента (`agent task`) с приоритетом
        чата, привязанную к сессии и к runtime агента; задача ставится в очередь runtime. Требования:
        сессия активна (не архивирована), агент не архивирован, у агента назначен runtime, у вызывающего
        есть право вызывать агента именно в контексте этой сессии. К сообщению можно приложить ранее загруженные
        вложения (`attachment_ids`); в ответ возвращаются только реально привязанные id (то есть без дублей/уже
        занятых). Если это первое пользовательское сообщение в сессии — асинхронно запускается генерация
        заголовка сессии по содержимому сообщения.

        Дальнейший обмен не синхронный: ответ агента приходит позже через realtime-события на ту же сессию
        — по мере выполнения задачи публикуются `task:queued` → `task:dispatch`/`task:running` → (опционально)
        серии `task:progress`/`task:message` с промежуточными шагами инструмента → и в конце либо `task:completed`,
        либо `task:failed`. Одновременно с завершением сервис создаёт ассистентское сообщение чата и публикует
        `chat:message` (role=assistant) и затем `chat:done`. Если пользователь отменяет задачу до ответа
        — публикуется `chat:cancel_finalized`.

        '
      tags:
      - Chat
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      x-roles:
      - owner
      - admin
      - member (только создатель сессии)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - content
              properties:
                content:
                  type: string
                  minLength: 1
                attachment_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      x-events:
      - event: chat:message
        payload: 'ChatMessagePayload { chat_session_id, message_id, role: "user", content, task_id, created_at
          } — публикуется немедленно'
      - event: task:queued / task:dispatch / task:running / task:progress / task:message / task:completed
          / task:failed / task:cancelled
        payload: публикуются асинхронно сервисом задач по ходу исполнения (не этим хендлером напрямую)
      - event: chat:message
        payload: 'ChatMessagePayload { role: "assistant", ... } — при получении ответа агента'
      - event: chat:done
        payload: ChatDonePayload { chat_session_id, task_id, message_id?, content?, elapsed_ms?, message_kind?
          } — сигнал конца ответа
      responses:
        '201':
          description: Сообщение принято, задача поставлена в очередь
          content:
            application/json:
              schema:
                type: object
                properties:
                  message_id:
                    type: string
                    format: uuid
                  task_id:
                    type: string
                    format: uuid
                  attachment_ids:
                    type:
                    - array
                    - 'null'
                    items:
                      type: string
                      format: uuid
                  created_at:
                    type: string
                    format: date-time
        '400':
          description: content пуст, либо attachment_ids содержит не-UUID, либо сессия архивна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: нет прав вызывать агента в этой сессии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: агент архивирован или у него нет назначенного runtime
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      operationId: listChatMessages
      summary: Полная история сообщений сессии (без пагинации)
      tags:
