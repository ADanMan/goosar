    get:
      operationId: getChatChannelHistory
      summary: История внешнего чат-канала (например, Slack) для сессии, вызываемая из задачи агента
      description: 'Специальный маршрут, вызываемый не человеком из браузера, а самим агентом во время
        выполнения задачи через инструмент чтения истории канала: требует заголовок `X-Actor-Source: task_token`
        и `X-Task-ID` с id текущей задачи; задача обязана быть чатовой. Если у сессии нет привязанного
        внешнего канала (например, обычный внутренний чат, не Slack-тред) — возвращает пустой список с
        полем `note`, а не ошибку.

        '
      tags:
      - Chat
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: X-Actor-Source
        in: header
        required: true
        schema:
          type: string
          enum:
          - task_token
      - name: X-Task-ID
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        schema:
          type: integer
      - name: before
        in: query
        schema:
          type: string
      x-roles:
      - agent (только вызов из контекста задачи, не человек)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatChannelHistoryResponse'
        '400':
          description: отсутствует/некорректен X-Task-ID, либо задача не чатовая
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'запрос не помечен как X-Actor-Source: task_token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: задача или чат-сессия не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: внешний канал вернул ошибку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
