openapi: 3.1.0
info:
  title: Goosar HTTP API
  version: 1.2.0
  description: 'Единая спецификация всех HTTP- и WebSocket-маршрутов Goosar API: аутентификация и сессии,
    рабочие пространства и участники, задачи (issues) и их подресурсы, проекты, squads, autopilots, агенты
    и их рантаймы, чат, инбокс, вложения, интеграции, административные и deployment-маршруты, а также
    протокол демона (daemon) и realtime каналы (/ws, /api/daemon/ws).


    Документ собран из четырёх ранее раздельных фрагментов (platform/auth/daemon; workspaces/integrations/deployment;
    issues/comments/projects/squads/autopilots/agents; templates/skills/runtimes/chat/inbox) в один источник
    истины. Сопроводительный текст — docs/50-api-contract.md.

    '
servers:
- url: /
security:
- cookieAuth: []
- bearerAuth: []
- {}
tags:
- name: Health
- name: Realtime
- name: Auth
- name: Config
- name: ContactSales
- name: Webhooks
- name: Daemon
- name: Attachments
- name: Me
- name: Issues
- name: IssueTable
- name: IssueComments
- name: IssueReactions
- name: IssueSubscribers
- name: IssueLabels
- name: IssueProperties
- name: IssueMetadata
- name: IssueTasks
- name: Comments
- name: Labels
- name: Properties
- name: Projects
- name: ProjectResources
- name: Squads
- name: Autopilots
- name: AutopilotTriggers
- name: AutopilotRuns
- name: AutopilotDeliveries
- name: Pins
- name: Agents
- name: AgentSkills
- name: AgentMcpServers
- name: AgentEnv
- name: Workspaces
- name: Integrations
- name: RuntimeProfiles
- name: Export
- name: Invitations
- name: Tokens
- name: CloudBilling
- name: DeploymentAdmin
- name: DeploymentMcp
- name: WorkspaceConfig
- name: Provisioning
- name: WorkspaceMcp
- name: AgentTemplates
- name: AgentBuilder
- name: Skills
- name: Dashboard
- name: Runtimes
- name: CloudRuntime
- name: Tasks
- name: WorkspaceActivity
- name: Chat
- name: Inbox
- name: NotificationPreferences
paths:
  /health:
    get:
      operationId: healthCheckLiveness
      tags:
      - Health
      summary: Liveness probe
      x-roles: public
      responses:
        '200':
          description: process is up
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    const: ok
  /readyz:
    get:
      operationId: healthCheckReadiness
      tags:
      - Health
      summary: Readiness probe (DB reachable, migrations up to date)
      x-roles: public
      responses:
        '200':
          description: ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: not ready (DB unreachable or migrations behind)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /healthz:
    get:
      operationId: healthCheckReadinessAlias
      tags:
      - Health
      summary: Alias of /readyz (kept for orchestrators that expect this exact path)
      x-roles: public
      responses:
        '200':
          description: ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /health/realtime:
    get:
      operationId: healthRealtimeMetrics
      tags:
      - Health
      summary: Realtime hub metrics snapshot
      description: 'Without `REALTIME_METRICS_TOKEN` set, only requests arriving directly from loopback
        (no X-Forwarded-* / Forwarded header) are served; every other request gets a plain 404 (the route
        is hidden, not just unauthorized). With the token set, a `Bearer <token>` header is required from
        anywhere.

        '
      security:
      - {}
      - bearerAuth: []
      x-roles: operator (loopback or bearer token)
      responses:
        '200':
          description: hub + daemon-hub connection/room counters
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: bearer token required and missing/wrong (only when REALTIME_METRICS_TOKEN is set)
        '404':
          description: not reachable from this address and no token configured
  /ws:
    get:
      operationId: realtimeConnect
      tags:
      - Realtime
      summary: Upgrade to the client realtime WebSocket
      description: 'Upgrades to WebSocket. Full handshake, subscription and event-type protocol is documented
        in A.md (§ "Протокол /ws") rather than as a request/response body, since this is not a plain HTTP
        exchange. Query parameters: `workspace_id` or `workspace_slug` (one required), optional `client_platform`,
        `client_version`, `client_os`.

        '
      parameters:
      - in: query
        name: workspace_id
        schema:
          type: string
          format: uuid
      - in: query
        name: workspace_slug
        schema:
          type: string
      - in: query
        name: client_platform
        schema:
          type: string
      - in: query
        name: client_version
        schema:
          type: string
      - in: query
        name: client_os
        schema:
          type: string
      security:
      - cookieAuth: []
      - {}
      x-roles: any-authenticated (cookie auth optional at handshake; unauthenticated upgrade must send
        a PAT/session token as the first WS frame within 10s, see A.md)
      responses:
        '101':
          description: switching protocols to WebSocket
        '400':
          description: workspace_id or workspace_slug missing
        '401':
          description: invalid/expired token (cookie, or first-frame token)
        '403':
          description: authenticated user is not a member of the target workspace
        '404':
          description: workspace_slug does not resolve to a workspace
  /auth/send-code:
    post:
      operationId: authSendCode
      tags:
      - Auth
      summary: Send a one-time email login/signup code
      x-roles: public
      x-rate-limit: 5/min per IP (RATE_LIMIT_AUTH); 10/min per email (RATE_LIMIT_AUTH_EMAIL); also throttled
        to 1 code per 60s per email server-side
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: signup not allowed for this email/domain, or signup disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: code requested too recently, or rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: email delivery not configured on this instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/verify-code:
    post:
      operationId: authVerifyCode
      tags:
      - Auth
      summary: Verify an emailed one-time code and start a session (or continue to MFA)
      x-roles: public
      x-rate-limit: 20/min per IP (RATE_LIMIT_AUTH_VERIFY); 10/min per email (RATE_LIMIT_AUTH_EMAIL)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - code
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  description: 6-digit code
      responses:
        '200':
          description: 'Session started (sets goosar_auth + goosar_csrf cookies and returns the same token
            in the body), or MFA required.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          description: invalid or expired code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: account deactivated, or signup restricted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/verify-link:
    post:
      operationId: authVerifyLoginLink
      tags:
      - Auth
      summary: Verify a magic login-link token (from the same email as send-code) and start a session
      x-roles: public
      x-rate-limit: 20/min per IP (RATE_LIMIT_AUTH_VERIFY)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - link_token
              properties:
                link_token:
                  type: string
      responses:
        '200':
          description: session started, or MFA required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          description: invalid or expired link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      operationId: authLogout
      tags:
      - Auth
      summary: Clear the session cookies
      description: Always succeeds; does not require a valid session. Does not revoke the underlying server-side
        session row.
      x-roles: public
      responses:
        '200':
          description: logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /api/auth/mfa/verify:
    post:
      operationId: authVerifyMfaChallenge
      tags:
      - Auth
      summary: Complete sign-in with a second factor (TOTP code or recovery code)
      description: Exchanges the short-lived `mfa_token` issued by send-code/verify-code/verify-link/OIDC/LDAP
        for a real session.
      x-roles: public (holder of a valid mfa_token)
      x-rate-limit: 20/min per IP (RATE_LIMIT_AUTH_VERIFY); 10/5min per mfa_token, hashed (RATE_LIMIT_MFA_VERIFY)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFAVerifyRequest'
      responses:
        '200':
          description: session started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '401':
          description: mfa_token expired/invalid, or code/recovery code invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/methods:
    get:
      operationId: authListMethods
      tags:
      - Auth
      summary: List sign-in methods enabled on this server
      x-roles: public
      x-rate-limit: 20/min per IP (RATE_LIMIT_AUTH_VERIFY)
      responses:
        '200':
          description: methods usable right now (email is always included as a fallback if nothing else
            is configured)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMethodsResponse'
  /api/auth/oidc/start:
    get:
      operationId: authStartOidc
      tags:
      - Auth
      summary: Start the corporate OIDC sign-in redirect
      x-roles: public
      x-rate-limit: 20/min per IP (RATE_LIMIT_AUTH_VERIFY)
      parameters:
      - in: query
        name: client
        schema:
          type: string
          enum:
          - web
          - desktop
        description: desktop clients get a goosar:// callback instead of a browser redirect
      responses:
        '302':
          description: redirect to the identity provider's authorization endpoint
        '404':
          description: OIDC not enabled on this server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: failed to prepare state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/oidc/callback:
    get:
      operationId: authOidcCallback
      tags:
      - Auth
      summary: OIDC identity provider callback
      description: 'Always responds with an HTTP redirect: on success, to the app (or `goosar://auth/callback?token=...`
        for the desktop client, or with `mfa_token=...` if a second factor is still required); on failure,
        to `/login#auth_error=<code>` (or the desktop equivalent).

        '
      x-roles: public
      x-rate-limit: 20/min per IP (RATE_LIMIT_AUTH_VERIFY)
      parameters:
      - in: query
        name: state
        schema:
          type: string
      - in: query
        name: code
        schema:
          type: string
      - in: query
        name: error
        schema:
          type: string
      responses:
        '302':
          description: redirect back to the app, success or failure
        '404':
          description: OIDC not enabled on this server
  /api/auth/ldap/login:
    post:
      operationId: authLoginLdap
      tags:
      - Auth
      summary: Sign in with LDAP/Active Directory credentials
      x-roles: public
      x-rate-limit: 5/min per IP (RATE_LIMIT_AUTH); 10/min per username (RATE_LIMIT_AUTH_EMAIL)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              - password
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: session started, or MFA required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '401':
          description: invalid username or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: LDAP not enabled on this server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: LDAP server unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/mfa:
    get:
      operationId: authGetMfaStatus
      tags:
      - Auth
      summary: Get the caller's second-factor status
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles: any-authenticated-human
      x-rate-limit: 600/min per user (RATE_LIMIT_API)
      responses:
        '200':
          description: MFA status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFAStatusResponse'
        '403':
          $ref: '#/components/responses/HumanOnly'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/mfa/totp/enroll:
    post:
      operationId: authEnrollTotp
      tags:
      - Auth
      summary: Begin TOTP enrollment (generates and stores a pending secret)
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles: any-authenticated-human
      x-rate-limit: 600/min per user (RATE_LIMIT_API); 20/hour per user (RATE_LIMIT_TOKEN)
      responses:
        '200':
          description: secret + otpauth:// URI to scan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFAEnrollResponse'
        '403':
          $ref: '#/components/responses/HumanOnly'
        '409':
          description: a second factor is already active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: GOOSAR_MCP_SECRET_KEY not configured — MFA storage unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/mfa/totp/confirm:
    post:
      operationId: authConfirmTotp
      tags:
      - Auth
      summary: Confirm TOTP enrollment with a live code and receive one-time recovery codes
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles: any-authenticated-human
      x-rate-limit: 600/min per user (RATE_LIMIT_API); 20/hour per user (RATE_LIMIT_TOKEN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFACodeRequest'
      responses:
        '200':
          description: MFA enabled; 10 recovery codes returned (shown once)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFAConfirmResponse'
        '400':
          description: not enrolled yet, code invalid, or code already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/HumanOnly'
        '409':
          description: already enrolled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/mfa/totp/disable:
    post:
      operationId: authDisableTotp
      tags:
      - Auth
      summary: Disable TOTP (requires a current code)
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles: any-authenticated-human
      x-rate-limit: 600/min per user (RATE_LIMIT_API); 20/hour per user (RATE_LIMIT_TOKEN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFACodeRequest'
      responses:
        '200':
          description: disabled; recovery codes are deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                    const: false
        '400':
          description: not enrolled, or code invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/HumanOnly'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/mfa/recovery-codes:
    post:
      operationId: authRegenerateMfaRecoveryCodes
      tags:
      - Auth
      summary: Regenerate the 10 recovery codes (requires a current TOTP/recovery code)
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles: any-authenticated-human
      x-rate-limit: 600/min per user (RATE_LIMIT_API); 20/hour per user (RATE_LIMIT_TOKEN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFACodeRequest'
      responses:
        '200':
          description: new codes issued; old ones are invalidated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFAConfirmResponse'
        '400':
          description: not enrolled, or code invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/HumanOnly'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/sessions:
    get:
      operationId: authListSessions
      tags:
      - Auth
      summary: List the caller's active sessions
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles: any-authenticated-human
      x-rate-limit: 600/min per user (RATE_LIMIT_API)
      responses:
        '200':
          description: sessions, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionResponse'
        '403':
          $ref: '#/components/responses/HumanOnly'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/sessions/{sessionId}:
    delete:
      operationId: authRevokeSession
      tags:
      - Auth
      summary: Revoke one of the caller's sessions
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles: any-authenticated-human (own sessions only)
      x-rate-limit: 600/min per user (RATE_LIMIT_API)
      parameters:
      - in: path
        name: sessionId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked:
                    type: integer
        '403':
          $ref: '#/components/responses/HumanOnly'
        '404':
          description: session not found (or belongs to another user)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/sessions/revoke-all:
    post:
      operationId: authRevokeAllSessions
      tags:
      - Auth
      summary: Revoke every session for the caller and bump their token version
      description: Also clears the caller's own auth cookies. Every JWT issued before this call becomes
        invalid immediately (token version check).
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles: any-authenticated-human
      x-rate-limit: 600/min per user (RATE_LIMIT_API)
      responses:
        '200':
          description: revocation summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked:
                    type: integer
                  token_version:
                    type: integer
        '403':
          $ref: '#/components/responses/HumanOnly'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/config:
    get:
      operationId: configGetPublic
      tags:
      - Config
      summary: Public runtime configuration for the frontend/CLI
      x-roles: public
      responses:
        '200':
          description: config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfig'
  /api/contact-sales:
    post:
      operationId: contactSalesCreateInquiry
      tags:
      - ContactSales
      summary: Submit a "contact sales" lead form
      x-roles: public
      x-rate-limit: 5/hour per IP (RATE_LIMIT_CONTACT_SALES); 3/hour per business_email server-side cap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactSalesRequest'
      responses:
        '201':
          description: inquiry recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactSalesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          description: too many recent inquiries from this email, or IP rate limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/webhooks/autopilots/{token}:
    post:
      operationId: webhooksReceiveAutopilotTrigger
      tags:
      - Webhooks
      summary: Inbound webhook that can start an Autopilot run
      description: '`token` is the opaque per-trigger secret (`awt_...`) minted when the trigger was created;
        it is the only credential. The body is normalized into `{event, eventPayload, request}` before
        being matched against the trigger''s event filters and, on a decision to run, handed to Autopilot
        admission. Deliveries are deduplicated by `X-GitHub-Delivery` / `Idempotency-Key`, and a duplicate
        delivery replays the first response instead of re-processing.

        '
      x-roles: public (bearer is the trigger's own opaque token)
      x-rate-limit: '60/min per trigger token (WebhookRateLimiter, if attached); 30/min per IP after a
        bad delivery (RATE_LIMIT backend, "bad_credential_ip"); 600/min per IP absolute ceiling regardless
        of outcome

        '
      parameters:
      - in: path
        name: token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 'accepted / skipped / ignored / duplicate — see `status` field. A run is only ever
            created for `status: accepted` or (already existing) `duplicate`.

            '
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - accepted
                    - skipped
                    - ignored
                    - duplicate
                  delivery_id:
                    type: string
                    format: uuid
                  run_id:
                    type: string
                    format: uuid
                  autopilot_id:
                    type: string
                    format: uuid
                  trigger_id:
                    type: string
                    format: uuid
                  reason:
                    type: string
                  event:
                    type: string
        '401':
          description: invalid or missing webhook signature (rejected, terminal)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: rejected
                  delivery_id:
                    type: string
                    format: uuid
                  reason:
                    type: string
                    enum:
                    - invalid_signature
                    - missing_signature
        '404':
          description: unknown token, or trigger/autopilot workspace mismatch
        '413':
          description: payload larger than 256 KiB
        '429':
          description: rate limit exceeded (IP-based)
  /api/webhooks/github:
    post:
      operationId: webhooksReceiveGithub
      tags:
      - Webhooks
      summary: GitHub App webhook (installation lifecycle, pull_request, CI status)
      description: 'HMAC-SHA256 signed with the App''s webhook secret. Handles `ping` (replies `{"ok":"pong"}`),
        `installation` (created/deleted/suspended → upserts/deletes `github_installation` rows and publishes
        `github_installation:created`/`github_installation:deleted`), `pull_request` (mirrors PR state,
        tries to link it to matching issues, publishes `pull_request:updated`), and `check_suite`/`check_run`/`status`
        (triggers a PR snapshot refresh). Every event beyond `ping` returns 202 unconditionally once the
        signature checks out.

        '
      security:
      - githubWebhookSignature: []
      x-roles: public (HMAC signature is the credential)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '202':
          description: accepted for async processing
        '200':
          description: 'ping event: {"ok":"pong"}'
        '401':
          description: invalid X-Hub-Signature-256
        '503':
          description: GitHub webhooks not configured (no secret set)
  /api/github/setup:
    get:
      operationId: webhooksGithubSetupCallback
      tags:
      - Webhooks
      summary: GitHub App installation callback (redirected here by GitHub after "Install App")
      description: 'Verifies the signed `state` (workspace id + return path), persists the new installation,
        publishes `github_installation:created`, then redirects to the workspace''s integration settings
        page with `?github_connected=1` or `&github_error=<code>`.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      - {}
      x-roles: public (state token carries the workspace binding; a session, if present, only tags who
        connected it)
      parameters:
      - in: query
        name: installation_id
        schema:
          type: string
      - in: query
        name: state
        required: true
        schema:
          type: string
      responses:
        '302':
          description: redirect to the frontend settings page, success or error
  /api/webhooks/vcs/{connectionId}:
    post:
      operationId: webhooksReceiveVcs
      tags:
      - Webhooks
      summary: Generic VCS connection webhook (GitLab/other providers wired through the vcs integration)
      description: 'Signature is verified per-provider using the connection''s own (encrypted-at-rest)
        webhook secret. Handles pull/merge-request events (mirrors into `vcs_pull_request`, links matching
        issues, publishes `pull_request:updated`) and CI status events (mirrors commit status, republishes
        `pull_request:updated` for issues on that head SHA).

        '
      security:
      - vcsWebhookSignature: []
      x-roles: public (per-connection HMAC signature is the credential)
      parameters:
      - in: path
        name: connectionId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '202':
          description: accepted
        '401':
          description: invalid signature
        '404':
          description: unknown connection, or VCS integration disabled
        '503':
          description: VCS webhooks not configured
  /api/webhooks/stripe:
    post:
      operationId: webhooksReceiveStripe
      tags:
      - Webhooks
      summary: Stripe billing webhook, proxied through to the cloud-runtime billing service
      description: 'Body is forwarded verbatim (with the `Stripe-Signature` header) to the configured
        cloud-runtime backend at `/api/v1/webhooks/stripe`, which owns signature verification; this endpoint
        only enforces size/rate limits and that a signature header is present at all.

        '
      security:
      - stripeWebhookSignature: []
      x-roles: public (Stripe-Signature header + upstream verification)
      x-rate-limit: 30/min per IP (WebhookIPRateLimiter); 600/min per IP absolute ceiling
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: forwarded and accepted by the billing service
        '401':
          description: missing Stripe-Signature header
        '413':
          description: body larger than 1 MiB
        '429':
          description: rate limit exceeded
        '503':
          description: cloud runtime billing not configured
  /api/integrations/composio/callback:
    get:
      operationId: webhooksComposioOauthCallback
      tags:
      - Webhooks
      summary: OAuth callback for a Composio toolkit connection
      description: Redirects to the frontend's connection-result page for the toolkit, success or failure,
        based on `status`/`connected_account_id` and the signed `state`.
      security:
      - {}
      x-roles: public (signed state is the credential)
      parameters:
      - in: query
        name: state
        required: true
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
      - in: query
        name: connected_account_id
        schema:
          type: string
      responses:
        '302':
          description: redirect to the frontend, success or failure
        '503':
          description: Composio integration not configured or feature-flagged off
  /api/daemon/register:
