          $ref: '#/components/responses/Unauthorized'
  /api/skills/search:
    get:
      operationId: searchSkills
      summary: Поиск навыков во внешнем каталоге сообщества
      description: 'Проксирует поисковый запрос во внешний публичный каталог навыков (по домену clawhub.ai).
        Источник может быть отключён администратором деплоя (403 source_disabled). Для первых 10 найденных
        кандидатов дополнительно подтягивается счётчик установок.

        '
      tags:
      - Skills
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: q
        in: query
        required: true
        schema:
          type: string
      x-roles:
      - owner
      - admin
      - member
      responses:
        '200':
          description: Найденные кандидаты
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SkillSearchCandidate'
        '400':
          description: параметр q отсутствует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: источник поиска отключён на этом деплое
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - source_disabled
                  error:
                    type: string
        '502':
          description: внешний каталог недоступен
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - upstream_unavailable
                  error:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/skills/import:
    post:
      operationId: importSkill
      summary: Импортировать навык из внешнего источника или архива
      description: 'Два режима запроса: 1) `application/json` с полем `url` — навык подтягивается по сети
        из одного из разрешённых источников (домены clawhub.ai, skills.sh, github.com; администратор деплоя
        может отключить любой источник по отдельности — тогда 403). SKILL.md обязателен и не должен быть
        пустым, иначе импорт отклоняется. 2) `multipart/form-data` с полем `file` — навык распаковывается
        из ZIP/.skill архива, загруженного пользователем (до 16 МБ), также обязателен SKILL.md внутри
        архива. В обоих случаях бинарные файлы (по расширению) и LICENSE-файлы пропускаются; импорт ограничен
        256 файлами и 8 МБ суммарно, отдельный файл — не более 1 МБ. Поведение при конфликте имени задаётся
        `on_conflict` (`fail` по умолчанию, `overwrite`, `rename`, `skip`); если это поле передано явно
        (даже пустой строкой не считается), ответ оборачивается в структурированный `SkillImportResult`
        вместо голого Skill.

        '
      tags:
      - Skills
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      x-roles:
      - owner
      - admin
      - member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              properties:
                url:
                  type: string
                  description: Ссылка на навык (clawhub.ai, skills.sh или github.com)
                on_conflict:
                  type: string
                  enum:
                  - fail
                  - overwrite
                  - rename
                  - skip
                  default: fail
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: ZIP/.skill архив с SKILL.md
                on_conflict:
                  type: string
                  enum:
                  - fail
                  - overwrite
                  - rename
                  - skip
      x-events:
      - event: skill:created
        payload: '{ skill: SkillWithFiles } — при status=created'
      - event: skill:updated
        payload: '{ skill: SkillWithFiles } — при status=updated (overwrite)'
      responses:
        '201':
          description: Навык создан (status=created либо тело — голый Skill, если on_conflict не передавался)
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/SkillWithFiles'
                - $ref: '#/components/schemas/SkillImportResult'
        '200':
          description: 'Импорт завершился без создания новой записи: updated / skipped / conflict'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillImportResult'
        '400':
          description: невалидный url/архив, недопустимый on_conflict, отсутствует SKILL.md
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: источник импорта отключён администратором деплоя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: конфликт имени при on_conflict=fail (или не передан) без структурированного ответа
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  existing_skill:
                    $ref: '#/components/schemas/ExistingSkillIdentity'
        '413':
          description: превышен лимит размера/количества файлов импорта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: источник вернул ошибку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: источник временно недоступен (например, недоступен GitHub API)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: тайм-аут получения файлов источника (45 секунд)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/skills/{id}:
    get:
      operationId: getSkill
