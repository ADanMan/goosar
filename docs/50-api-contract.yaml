  /api/provisioning/manifest:
    get:
      operationId: getProvisioningManifest
      tags:
      - Provisioning
      summary: Разрешённый манифест пакетов (skill, MCP-сервер, runtime) для пространства и платформы
      description: 'Если у пространства заданы pin''ы (закреплённые версии) — манифест строится из них
        плюс их транзитивные зависимости (requires); иначе — из полного каталога деплоя. Фильтруется по
        платформе (обязательный query platform). Каждая отдача манифеста фиксируется как "доставленный
        пакет" для последующей диагностики (used by /api/status). Пакеты, отозванные политикой деплоя,
        перечисляются отдельно в revokedPackages, не исключаясь молча.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - member
      parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: platform
        in: query
        required: true
        schema:
          type: string
          enum:
          - '*'
          - darwin-arm64
          - darwin-x64
          - win-x64
          - linux-x64
          - linux-arm64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisioningManifest'
        '400':
          description: workspace_id не передан/невалиден, либо platform отсутствует/невалиден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: не удалось разрешить манифест (сбой хранилища пакетов)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: provisioning не настроен на деплое
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/provisioning/blob/{name}/{version}:
    parameters:
    - name: name
      in: path
      required: true
      schema:
        type: string
    - name: version
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getProvisioningBlob
      tags:
      - Provisioning
      summary: Скачать бинарный блоб пакета (zstd-архив)
      description: 'Пакет должен присутствовать в манифесте, разрешённом для пространства и платформы
        — иначе 404, даже если блоб физически существует в хранилище. Ответ несёт X-Package-Sha256 для
        проверки целостности на стороне клиента.

        '
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-roles:
      - member
      parameters:
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: platform
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: application/zstd, X-Package-Sha256, Cache-Control no-store
          content:
            application/zstd:
              schema:
                type: string
                format: binary
        '400':
          description: platform отсутствует/невалиден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: пакет не входит в разрешённый для пространства/платформы манифест, либо блоб отсутствует
            в хранилище
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: provisioning не настроен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/provisioning/catalog:
    get:
      operationId: getProvisioningCatalog
