    AgentTask:
      type: object
      description: 'Строка очереди задач, как она передаётся daemon-клиенту при claim и последующих обменах
        статусом. Ниже перечислены все поля, которые реальный daemon-клиент разбирает и использует, с
        их фактическим значением; поля, описание которых заканчивается пометкой «(демон это поле не читает)»,
        присутствуют в ответе сервера, но самим daemon-клиентом не используются — их можно отдавать для
        совместимости с будущими версиями клиента, но их отсутствие не ломает сегодняшнее поведение. additionalProperties
        оставлен true только как запас на ещё не описанные поля; полагаться на это вместо перечисленных
        ниже свойств не следует.

        '
      additionalProperties: true
      required:
      - id
      - agent_id
      - runtime_id
      - issue_id
      - workspace_id
      - status
      - priority
      - attempt
      - max_attempts
      - created_at
      - delivered_comment_ids
      - kind
      properties:
        id:
          type: string
          format: uuid
          description: task id.
        agent_id:
          type: string
          format: uuid
          description: the agent this task runs as.
        runtime_id:
          type: string
          format: uuid
          description: the runtime (daemon-registered execution slot) the task was dispatched to.
        issue_id:
          type: string
          format: uuid
          description: the issue this task belongs to; empty string when the task is not issue-backed
            (e.g. a bare chat task).
        workspace_id:
          type: string
          format: uuid
        workspace_context:
          type: string
          description: free-text context the workspace owner set for all agents; folded into the prompt.
        thread_name:
          type: string
          description: display name of the source thread/channel (chat or comment thread), used for logging
            and, on some channels, addressing replies.
        status:
          type: string
          enum:
          - queued
          - dispatched
          - waiting_local_directory
          - running
          - completed
          - failed
          - cancelled
          - deferred
          description: lifecycle state at response time (демон это поле не читает — статус демон узнаёт
            из своих же вызовов start/complete/fail и из GetTaskStatus).
        priority:
          type: integer
          description: queue priority used by the server scheduler (демон это поле не читает).
        dispatched_at:
          type:
          - string
          - 'null'
          format: date-time
          description: when the task left the queue (демон это поле не читает).
        started_at:
          type:
          - string
          - 'null'
          format: date-time
          description: when StartTask was called (демон это поле не читает).
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: when the task finished, success or failure (демон это поле не читает).
        result:
          description: 'free-form outcome payload set by CompleteTask/FailTask (its shape mirrors whichever
            of those two request bodies the daemon last sent: pr_url/output/session_id/work_dir, or error/session_id/work_dir/failure_reason);
            only meaningful to other API consumers reading a finished task back, since the daemon that
            produced it never reads it (демон это поле не читает).

            '
          type:
          - object
          - 'null'
          additionalProperties: true
        error:
          type:
          - string
          - 'null'
          description: top-level failure message once failed (демон это поле не читает).
        failure_reason:
          type: string
          description: machine-readable failure category (демон это поле не читает).
        attempt:
          type: integer
          description: 1-based retry counter (демон это поле не читает).
        max_attempts:
          type: integer
          description: retry ceiling (демон это поле не читает).
        parent_task_id:
          type:
          - string
          - 'null'
          format: uuid
          description: task this one was retried/rerun/delegated from, if any (демон это поле не читает).
        is_leader_task:
          type: boolean
          description: true for the coordinating task of a squad run; changes how the daemon picks/reuses
            a local working directory.
        agent:
          $ref: '#/components/schemas/TaskAgent'
        connected_apps:
          type: array
          items:
            $ref: '#/components/schemas/TaskConnectedApp'
          description: Composio-style external tool connections the daemon should expose to the agent;
            folded into the prompt as a capability list.
        repos:
          type: array
          items:
            $ref: '#/components/schemas/TaskRepo'
          description: repositories the daemon should have available/cloned for this task.
        project_id:
          type: string
          format: uuid
          description: the project the issue belongs to, if any.
        project_title:
          type: string
        project_description:
          type: string
        project_resources:
          type: array
          items:
            $ref: '#/components/schemas/TaskProjectResource'
          description: linked resources of the project (e.g. a pinned local directory) — used, among other
            things, to find a per-project local working directory.
        created_at:
          type: string
          format: date-time
          description: when the task row was created (демон это поле не читает).
        prior_session_id:
          type: string
          description: underlying agent-runtime session id to resume, from a previous run on the same
            issue/chat.
        prior_work_dir:
          type: string
          description: working directory to reuse from a previous run.
        prior_session_resume_unavailable:
          type: boolean
          description: server (or the daemon itself, once it discovers this mid-run) marks resume as not
            possible; the daemon then starts a fresh session instead of resuming prior_session_id.
        work_dir:
          type: string
          description: working directory chosen for THIS run, echoed back by other API surfaces after
            the daemon reports it via complete/fail/session; not read back by the daemon (демон это поле
            не читает — рабочую директорию для текущего запуска демон выбирает сам).
        relative_work_dir:
          type: string
          description: work_dir expressed relative to the daemon's workspace root, for display purposes
            (демон это поле не читает).
        trigger_comment_id:
          type:
          - string
          - 'null'
          format: uuid
          description: the comment that triggered this task, if triggered by a single comment.
        coalesced_comment_ids:
          type: array
          items:
            type: string
            format: uuid
          description: ids of several comments batched into one task run (comment coalescing).
        coalesced_comments:
          type: array
          items:
            $ref: '#/components/schemas/TaskCoalescedComment'
          description: full text of the coalesced comments, in order, for building the prompt.
        delivered_comment_ids:
          type: array
          items:
            type: string
            format: uuid
          description: comment ids the server considers already delivered to some claim of this task,
            used server-side for at-least-once delivery bookkeeping (демон это поле не читает — на claim-ответе
            он получает актуальный список отдельно, как auth_token).
        trigger_thread_id:
          type: string
          description: id of the comment thread the trigger comment belongs to.
        trigger_comment_content:
          type: string
          description: text of the single triggering comment (when not using the coalesced form).
        trigger_summary:
          type:
          - string
          - 'null'
          description: short human summary of why the task was triggered, for logging/UI; not part of
            the daemon's read set.
        trigger_author_type:
          type: string
          enum:
          - member
          - agent
          - system
        trigger_author_name:
          type: string
        new_comment_count:
          type: integer
          description: how many new comments arrived since new_comments_since.
        new_comments_since:
          type: string
          format: date-time
        chat_session_id:
          type: string
          format: uuid
          description: the chat session this task answers, for chat-kind tasks.
        chat_channel_type:
          type: string
          description: which surface the chat is happening on, e.g. app, slack.
        chat_in_thread:
          type: boolean
          description: whether the chat reply should stay inside an existing thread on the channel.
        chat_message:
          type: string
          description: the user's chat message text the agent is responding to.
        chat_message_attachments:
          type: array
          items:
            $ref: '#/components/schemas/TaskChatAttachment'
        chat_intro:
          type: boolean
          description: true for the very first message of a new chat session (changes greeting behavior).
        autopilot_run_id:
          type: string
          format: uuid
          description: present when the task was created by an Autopilot run.
        autopilot_id:
          type: string
          format: uuid
        autopilot_title:
          type: string
        autopilot_description:
          type: string
        autopilot_source:
          type: string
          description: what triggered the autopilot run, e.g. webhook, schedule, manual.
        autopilot_trigger_payload:
          description: raw payload that triggered the Autopilot run (webhook body or schedule context),
            forwarded to the agent as-is.
          type:
          - object
          - array
          - 'null'
        quick_create_prompt:
          type: string
          description: free-text prompt for a task created via quick-create instead of a full issue.
        quick_create_priority:
          type: string
        quick_create_due_date:
          type: string
          format: date
        quick_create_attachment_ids:
          type: array
          items:
            type: string
            format: uuid
        handoff_note:
          type: string
          description: note left by whoever handed this task off to the agent (e.g. a human reassigning
            work).
        mcp_policy:
          $ref: '#/components/schemas/TaskMcpPolicy'
        squad_id:
          type: string
          format: uuid
          description: present when the agent belongs to a squad running this task together.
        squad_name:
          type: string
        parent_issue_id:
          type: string
          format: uuid
          description: parent of issue_id in the issue hierarchy, if any.
        parent_issue_identifier:
          type: string
          description: human-readable identifier (e.g. PREFIX-123) of parent_issue_id.
        requesting_user_name:
          type: string
          description: display name of the human who effectively asked for this task (initiator or issue
            requester).
        requesting_user_profile_description:
          type: string
        initiator_type:
          type: string
          enum:
          - member
          - agent
          - system
        initiator_id:
          type: string
          format: uuid
        initiator_name:
          type: string
        initiator_email:
          type: string
          format: email
        kind:
          type: string
          description: task category, e.g. issue, chat, autopilot, quick_create (демон это поле не читает
            — оно определяет поведение по факту того, какие из полей выше заполнены, а не читается напрямую).
        attribution:
          description: who/what ultimately originated this task, for audit/analytics (демон это поле не
            читает).
          allOf:
          - $ref: '#/components/schemas/TaskAttribution'
        auth_token:
          type: string
          description: short-lived mat_... agent task token this claim/run must use for every further
            /api/daemon/tasks/{id}/** call; present only in claim responses.
