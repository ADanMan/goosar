                  action:
                    type: string
                    enum:
                    - squad_leader_evaluated
                  created_at:
                    type: string
                    format: date-time
        '400':
          description: Неверный outcome, либо задача не назначена на отряд
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Вызывающий — не тот лидер отряда, на который назначена задача
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Отряд не найден, либо задача агента не привязана к этой задаче
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-events:
